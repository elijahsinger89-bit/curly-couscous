<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SINUMERIK ONE Generator</title>
<style>
:root {
  --bg: #f4f5f7; --panel: #ffffff; --ink: #1d2330; --muted: #5d6677; --line: #d5d9e0;
  --accent: #0b6e8a; --accent-ink: #ffffff; --bad: #b3261e; --bad-bg: #fdecea; --warn: #8a5a00;
  --warn-bg: #fff4dc; --ok: #1e7a3c; --ok-bg: #e7f5ec; --field: #ffffff; --off: #eceef2; --code: #f7f8fa;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14171c; --panel: #1c2027; --ink: #e3e6eb; --muted: #9aa3b2; --line: #343a45;
    --accent: #3fa7c4; --accent-ink: #0d1014; --bad: #ff8a80; --bad-bg: #3a1d1b; --warn: #f0c060;
    --warn-bg: #3a3018; --ok: #7fd49a; --ok-bg: #1b3324; --field: #232831; --off: #2a2f38; --code: #171a20;
  }
}
:root[data-theme="dark"] {
  --bg: #14171c; --panel: #1c2027; --ink: #e3e6eb; --muted: #9aa3b2; --line: #343a45;
  --accent: #3fa7c4; --accent-ink: #0d1014; --bad: #ff8a80; --bad-bg: #3a1d1b; --warn: #f0c060;
  --warn-bg: #3a3018; --ok: #7fd49a; --ok-bg: #1b3324; --field: #232831; --off: #2a2f38; --code: #171a20;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
header.top { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between;
  padding: 12px 16px; background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; }
header.top h1 { font-size: 17px; margin: 0; }
header.top .sub { color: var(--muted); font-size: 12px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
button { font: inherit; padding: 6px 12px; border: 1px solid var(--line); background: var(--field); color: var(--ink); border-radius: 6px; cursor: pointer; }
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
button.small { padding: 2px 8px; font-size: 12px; }
nav.tabs { display: flex; gap: 4px; padding: 8px 16px 0; overflow-x: auto; }
nav.tabs button { border-radius: 6px 6px 0 0; border-bottom: none; background: transparent; color: var(--muted); }
nav.tabs button.active { background: var(--panel); color: var(--ink); border-color: var(--line); font-weight: 600; }
main { padding: 0 16px 32px; }
.tab { display: none; background: var(--panel); border: 1px solid var(--line); border-radius: 0 8px 8px 8px; padding: 16px; }
.tab.active { display: block; }
h2 { font-size: 15px; margin: 18px 0 8px; }
h2:first-child { margin-top: 0; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px 16px; }
label.f { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--muted); }
label.f.chk { flex-direction: row; align-items: center; gap: 6px; color: var(--ink); font-size: 13px; }
input, select { font: inherit; color: var(--ink); background: var(--field); border: 1px solid var(--line); border-radius: 5px; padding: 5px 7px; min-width: 0; }
input[type=checkbox] { width: 16px; height: 16px; }
input:disabled, select:disabled { background: var(--off); color: var(--muted); }
input.err, select.err { border-color: var(--bad); background: var(--bad-bg); }
.note { color: var(--muted); font-size: 12px; margin: 4px 0 0; }
.box { border: 1px solid var(--line); border-radius: 8px; padding: 12px; margin-top: 10px; }
.tblwrap { overflow-x: auto; }
table.t { border-collapse: collapse; width: 100%; font-size: 13px; }
table.t th, table.t td { border-bottom: 1px solid var(--line); padding: 4px 5px; text-align: left; white-space: nowrap; }
table.t th { color: var(--muted); font-weight: 600; font-size: 12px; }
table.t input[type=text] { width: 100%; min-width: 64px; }
table.t td.c, table.t th.c { text-align: center; }
table.t td.ro { color: var(--muted); font-variant-numeric: tabular-nums; }
#msgs { margin: 10px 16px 0; }
.msg { border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; border: 1px solid; }
.msg.bad { background: var(--bad-bg); border-color: var(--bad); }
.msg.ok { background: var(--ok-bg); border-color: var(--ok); }
.msg.warn { background: var(--warn-bg); border-color: var(--warn); }
.msg ul { margin: 6px 0 0; padding-left: 20px; }
.msg a { color: inherit; }
.out { display: grid; grid-template-columns: minmax(200px, 280px) 1fr; gap: 12px; }
@media (max-width: 760px) { .out { grid-template-columns: 1fr; } }
.flist { list-style: none; margin: 0; padding: 0; border: 1px solid var(--line); border-radius: 8px; max-height: 70vh; overflow: auto; }
.flist li { padding: 6px 10px; border-bottom: 1px solid var(--line); cursor: pointer; display: flex; justify-content: space-between; gap: 8px; }
.flist li.sel { background: var(--off); font-weight: 600; }
.flist .dir { color: var(--muted); font-size: 11px; }
.viewer { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
.viewer .vh { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 6px 10px; border-bottom: 1px solid var(--line); }
.viewer pre { margin: 0; padding: 8px 0; background: var(--code); max-height: 70vh; overflow: auto; font: 12.5px/1.45 ui-monospace, Consolas, "Courier New", monospace; }
.viewer pre span.ln { display: inline-block; width: 4.2em; padding-right: 10px; text-align: right; color: var(--muted); user-select: none; }
dialog { border: 1px solid var(--line); border-radius: 10px; background: var(--panel); color: var(--ink); max-width: 560px; width: calc(100% - 32px); }
dialog::backdrop { background: rgba(0,0,0,.45); }
dialog .btns { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
.pill { display: inline-block; padding: 1px 8px; border-radius: 10px; background: var(--off); color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<header class="top">
  <div>
    <h1>SINUMERIK ONE Program Generator</h1>
    <div class="sub">Tombstone / single-part nest framework. Offline. <span id="jobLabel"></span></div>
  </div>
  <div class="actions">
    <button id="btnLoad" type="button">Load job…</button>
    <input type="file" id="fileLoad" accept=".json,application/json" hidden>
    <button id="btnSave" type="button">Save job</button>
    <button id="btnValidate" type="button">Validate</button>
    <button id="btnGenerate" type="button" class="primary">Generate ZIP</button>
  </div>
</header>
<nav class="tabs" role="tablist">
  <button type="button" data-tab="config" class="active">1 · Config &amp; steps</button>
  <button type="button" data-tab="probing">2 · Probing</button>
  <button type="button" data-tab="wcs">3 · Work offsets</button>
  <button type="button" data-tab="output">4 · Output</button>
</nav>
<div id="msgs"></div>
<main>
  <section class="tab active" id="tab-config"></section>
  <section class="tab" id="tab-probing"></section>
  <section class="tab" id="tab-wcs"></section>
  <section class="tab" id="tab-output"></section>
</main>
<dialog id="dlg">
  <h2 id="dlgTitle"></h2>
  <div id="dlgBody"></div>
  <div class="btns" id="dlgBtns"></div>
</dialog>

<script id="engine">
/* ==========================================================================
   ENGINE: pure functions. No DOM. Also loaded by the test harness (Node).
   Every emitted construct was checked against:
     SINUMERIK ONE Measuring cycles PM 07/2025 (MC)
     SINUMERIK ONE NC programming PM 07/2025   (NC)
     SINUMERIK ONE System variables LM 07/2022 (SV)
   ========================================================================== */
(function (G) {
'use strict';

var GEN_VERSION = '1.1.0';
var MAX_NESTS = 32;
var AXES = ['NONE', 'A', 'B', 'C'];
var XY_METHODS = ['SPLIT EXTERIOR', 'BORE', 'BOSS', 'RECT POCKET', 'RECT SPIGOT', 'NONE'];
var OUTSIDE = { 'SPLIT EXTERIOR': 1, 'BOSS': 1, 'RECT SPIGOT': 1 };
var INSIDE = { 'BORE': 1, 'RECT POCKET': 1 };
var LASER_RPM = 3750;               /* shop laser speed - fixed */
var UNIT = {
  METRIC: { key: 'METRIC', dec: 3, g: 'G71', label: 'METRIC (MM)', u: 'mm',
            clr: 1, feed: 300, fa: 5, travel: 15, zTol: 0.1, xyTol: 0.1, outClr: 25, inMargin: 1 },
  INCH:   { key: 'INCH', dec: 4, g: 'G70', label: 'INCH (IN)', u: 'in',
            clr: 0.04, feed: 12, fa: 0.2, travel: 0.6, zTol: 0.004, xyTol: 0.004, outClr: 1, inMargin: 0.04 }
};

/* ---------------- job model ---------------- */
function blankWcsRow() { return { x: '', y: '', z: '', trunnion: '', rotary: '', notes: '' }; }
function blankStep(stepNo) {
  return { step: String(stepNo), tool: '', brkTol: '', program: '', meas: true, measAlways: false,
           brk: true, maxBrk: '2', debug: false, life: '1', setpiece: true };
}
function defaultJob() {
  var wcs = [];
  for (var i = 0; i < MAX_NESTS; i++) wcs.push(blankWcsRow());
  return {
    format: 'SINUMERIK_ONE_GENERATOR_JOB', version: 1,
    header: { part: '', material: '', stock: '', machine: '', programmer: '' },
    config: { units: 'METRIC', trunnion: 'NONE', rotary: 'B', mode: 'TOMBSTONE',
              faces: '4', nestsPerFace: '2', totalNests: '8' },
    probeStep: { enabled: true, step: '1', program: '' },
    builder: { first: '10', last: '', inc: '10' },
    steps: [blankStep(10)],
    probing: {
      tool: 'PROBE', limitClear: '', feed: '', searchDist: '', prnum: '1', probeOnM: 'M56',
      partCheck: true, maxTravel: '', chkAlt: false, chkX: '', chkY: '', chkZ: '',
      skipZ: false, zAlt: false, zX: '', zY: '', zZ: '', zNom: '0', zTol: '',
      xyMethod: 'SPLIT EXTERIOR', widthX: '', widthY: '', diameter: '', appX: '0', appY: '0',
      probeZ: '', xyTol: '', approachClr: '',
      health: false, hX: '', hY: '', hStartZ: '', hTargetZ: '', hFeed: ''
    },
    wcs: wcs
  };
}
/* merge a loaded object over the defaults; unknown keys are dropped */
function normalizeJob(src) {
  var d = defaultJob();
  if (!src || typeof src !== 'object') return d;
  function mergeFlat(def, s) {
    if (!s || typeof s !== 'object') return def;
    Object.keys(def).forEach(function (k) {
      if (!(k in s) || s[k] === null || s[k] === undefined) return;
      if (typeof def[k] === 'boolean') def[k] = (s[k] === true || s[k] === 'true' || s[k] === 1 || s[k] === 'YES');
      else def[k] = String(s[k]);
    });
    return def;
  }
  mergeFlat(d.header, src.header);
  mergeFlat(d.config, src.config);
  mergeFlat(d.probeStep, src.probeStep);
  mergeFlat(d.builder, src.builder);
  mergeFlat(d.probing, src.probing);
  if (Array.isArray(src.steps)) {
    d.steps = src.steps.map(function (s) { return mergeFlat(blankStep(''), s); });
  }
  if (Array.isArray(src.wcs)) {
    for (var i = 0; i < MAX_NESTS; i++) d.wcs[i] = mergeFlat(blankWcsRow(), src.wcs[i]);
  }
  return d;
}

/* ---------------- numbers and text ---------------- */
function isBlank(v) { return v === undefined || v === null || String(v).trim() === ''; }
function num(v) {
  if (isBlank(v)) return NaN;
  var t = String(v).trim();
  if (!/^[+-]?(\d+(\.\d*)?|\.\d+)$/.test(t)) return NaN;
  return Number(t);
}
function isNum(v) { return !isNaN(num(v)); }
function isInt(v) { var n = num(v); return !isNaN(n) && Math.floor(n) === n; }
function fix(v, d) {
  var p = Math.pow(10, d);
  var a = Math.round(Math.abs(v) * p + 1e-7) / p;
  var s = a.toFixed(d);
  if (Number(s) !== 0 && v < 0) s = '-' + s;
  return s;
}
function compact(v, maxDec) {
  var s = fix(v, maxDec);
  if (s.indexOf('.') >= 0) s = s.replace(/0+$/, '').replace(/\.$/, '');
  return s;
}
function ascii(s) {
  return String(s === undefined || s === null ? '' : s).replace(/[\r\n\t]+/g, ' ')
    .replace(/[^\x20-\x7E]/g, '?').trim();
}
function pad(s, w) { s = String(s); while (s.length < w) s += ' '; return s; }
function today() {
  var d = new Date();
  return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
}
var PROG_RE = /^[A-Za-z_][A-Za-z_][A-Za-z0-9_]{0,22}$/;
var RESERVED = ['CON', 'PRN', 'AUX', 'NUL', 'COM1', 'COM2', 'COM3', 'COM4', 'COM5', 'COM6', 'COM7', 'COM8', 'COM9',
                'LPT1', 'LPT2', 'LPT3', 'LPT4', 'LPT5', 'LPT6', 'LPT7', 'LPT8', 'LPT9'];
function progNameError(name) {
  if (isBlank(name)) return 'program name is required';
  var t = String(name).trim();
  if (t.length > 24) return 'program name is ' + t.length + ' characters (max 24, NC 3.3)';
  if (!PROG_RE.test(t)) return 'program name must use A-Z, 0-9, _ and start with two letters/underscores (NC naming rules)';
  if (RESERVED.indexOf(t.toUpperCase()) >= 0) return 'program name ' + t + ' is reserved';
  return '';
}
function toolNameError(name) {
  if (isBlank(name)) return 'tool name is required';
  var t = String(name).trim();
  if (t.length > 25) return 'tool name is ' + t.length + ' characters (max 25, the L_ cycles take STRING[25])';
  if (/["]/.test(t)) return 'tool name must not contain a double quote';
  if (/[^\x20-\x7E]/.test(t)) return 'tool name must be plain ASCII';
  return '';
}

/* ---------------- step builder: first / last / increment ----------------
   Program names B_[part]_[step]_[machine], step zero-padded to 3 digits
   (4 when any step >= 1000), max 24 characters (NC naming rules).        */
var NAME_PART_RE = /^[A-Za-z0-9_]+$/;
var MAX_BUILD_ROWS = 100;
function nameParts(job) {
  return { part: String(job.header.part || '').trim(), mach: String(job.header.machine || '').trim() };
}
function nameInputsError(job) {
  var n = nameParts(job);
  if (!n.part) return 'Enter the part number (Header) first: program names are B_[part]_[step]_[machine].';
  if (!NAME_PART_RE.test(n.part)) return 'Part number "' + n.part + '" can only use letters, numbers and _ to be part of a program name.';
  if (n.mach && !NAME_PART_RE.test(n.mach)) return 'Machine "' + n.mach + '" can only use letters, numbers and _ to be part of a program name (or leave Machine blank).';
  return '';
}
function nameWidth(stepNos) {
  var hi = 0;
  stepNos.forEach(function (s) { if (isFinite(s) && s > hi) hi = s; });
  return hi >= 1000 ? 4 : 3;
}
function rawName(job, stepNo, width) {
  var n = nameParts(job), s = String(stepNo);
  while (s.length < width) s = '0' + s;
  return 'B_' + n.part + '_' + s + (n.mach ? '_' + n.mach : '');
}
function progName(job, stepNo, width) {
  var nm = rawName(job, stepNo, width);
  return progNameError(nm) ? '' : nm;
}
function maxMachineLen(job, width) {
  return 24 - (2 + nameParts(job).part.length + 1 + width + 1);
}
function allStepNos(steps, ps) {
  var a = [];
  steps.forEach(function (s) { if (isInt(s.step)) a.push(num(s.step)); });
  if (ps.enabled && isInt(ps.step)) a.push(num(ps.step));
  return a;
}
function cloneStep(s) { return JSON.parse(JSON.stringify(s)); }
function hasStepData(job) {
  return job.steps.some(function (s) { return !isBlank(s.tool) || !isBlank(s.program) || !isBlank(s.brkTol); });
}
/* mode 'overwrite': a fresh row per step of the range, every name generated.
   mode 'keep': every current row untouched, missing steps added, sorted.   */
function buildSteps(job, mode) {
  var b = job.builder, ps = job.probeStep;
  var R = { steps: null, probeProgram: ps.program, unnamed: [], error: '', count: 0, added: 0, width: 3 };
  var ne = nameInputsError(job);
  if (ne) { R.error = ne; return R; }
  if (!isInt(b.first) || !isInt(b.last) || !isInt(b.inc)) { R.error = 'First step, last step and increment must be whole numbers.'; return R; }
  var first = num(b.first), last = num(b.last), inc = num(b.inc);
  if (first < 1 || last > 99999) { R.error = 'Step numbers must be 1-99999.'; return R; }
  if (last < first) { R.error = 'Last step (' + last + ') must not be below first step (' + first + ').'; return R; }
  if (inc < 1) { R.error = 'Increment must be at least 1.'; return R; }
  var count = Math.floor((last - first) / inc) + 1;
  if (count > MAX_BUILD_ROWS) { R.error = 'That range makes ' + count + ' steps (max ' + MAX_BUILD_ROWS + ').'; return R; }
  if (ps.enabled && isInt(ps.step) && first <= num(ps.step)) { R.error = 'First step must come after the probe step (' + num(ps.step) + ').'; return R; }
  var range = [];
  for (var s = first; s <= last; s += inc) range.push(s);
  var steps, fresh = [];
  if (mode === 'keep') {
    steps = job.steps.map(cloneStep);
    var have = {};
    steps.forEach(function (st) { if (isInt(st.step)) have[num(st.step)] = 1; });
    range.forEach(function (n) { if (!have[n]) { var r = blankStep(n); fresh.push(r); steps.push(r); } });
    steps.sort(function (a, c) {
      var x = isInt(a.step) ? num(a.step) : Infinity, y = isInt(c.step) ? num(c.step) : Infinity;
      return x - y;
    });
  } else {
    steps = range.map(function (n) { var r = blankStep(n); fresh.push(r); return r; });
  }
  var w = nameWidth(allStepNos(steps, ps));
  fresh.forEach(function (st) {
    var nm = progName(job, num(st.step), w);
    if (nm) st.program = nm; else R.unnamed.push(num(st.step));
  });
  if (ps.enabled && isInt(ps.step) && (mode !== 'keep' || isBlank(ps.program))) {
    var pn = progName(job, num(ps.step), w);
    if (pn) R.probeProgram = pn; else R.unnamed.unshift(num(ps.step));
  }
  R.steps = steps; R.count = range.length; R.added = fresh.length; R.width = w;
  R.maxMachine = maxMachineLen(job, w);
  return R;
}
/* "Fill blank program names": same pattern, only blank names are touched */
function fillNames(job) {
  var ps = job.probeStep;
  var R = { steps: job.steps.map(cloneStep), probeProgram: ps.program, unnamed: [], error: '', filled: 0 };
  var ne = nameInputsError(job);
  if (ne) { R.error = ne; return R; }
  var w = nameWidth(allStepNos(job.steps, ps));
  R.width = w; R.maxMachine = maxMachineLen(job, w);
  if (ps.enabled && isBlank(ps.program) && isInt(ps.step)) {
    var pn = progName(job, num(ps.step), w);
    if (pn) { R.probeProgram = pn; R.filled++; } else R.unnamed.push(num(ps.step));
  }
  R.steps.forEach(function (st) {
    if (!isBlank(st.program) || !isInt(st.step)) return;
    var nm = progName(job, num(st.step), w);
    if (nm) { st.program = nm; R.filled++; } else R.unnamed.push(num(st.step));
  });
  return R;
}

/* ---------------- resolve the job into numbers ---------------- */
function resolve(job) {
  var c = job.config, R = {};
  R.units = c.units === 'INCH' ? 'INCH' : 'METRIC';
  R.U = UNIT[R.units];
  R.single = c.mode === 'SINGLE PART';
  R.mode = R.single ? 'SINGLE PART' : 'TOMBSTONE';
  R.trunnion = AXES.indexOf(c.trunnion) >= 0 ? c.trunnion : 'NONE';
  R.rotary = AXES.indexOf(c.rotary) >= 0 ? c.rotary : 'NONE';
  R.faces = R.single ? 1 : num(c.faces);
  R.npf = R.single ? 1 : num(c.nestsPerFace);
  R.total = R.single ? 1 : num(c.totalNests);
  R.clr = R.U.clr;
  R.header = {
    part: ascii(job.header.part), material: ascii(job.header.material), stock: ascii(job.header.stock),
    machine: ascii(job.header.machine), programmer: ascii(job.header.programmer)
  };
  R.nests = [];
  var tot = isNaN(R.total) ? 0 : Math.min(R.total, MAX_NESTS);
  for (var n = 1; n <= tot; n++) {
    var w = job.wcs[n - 1] || blankWcsRow();
    var face = R.single ? 1 : Math.ceil(n / R.npf);
    var defRot = R.single ? 0 : (face - 1) * 360 / R.faces;
    R.nests.push({
      n: n, face: face, frame: n + 4,
      x: isNum(w.x) ? num(w.x) : 0, y: isNum(w.y) ? num(w.y) : 0, z: isNum(w.z) ? num(w.z) : 0,
      blank: isBlank(w.x) || isBlank(w.y) || isBlank(w.z),
      trun: isBlank(w.trunnion) ? 0 : num(w.trunnion),
      rot: isBlank(w.rotary) ? defRot : num(w.rotary),
      defRot: defRot, notes: ascii(w.notes)
    });
  }
  R.probeStep = { enabled: !!job.probeStep.enabled, step: num(job.probeStep.step),
                  program: String(job.probeStep.program || '').trim() };
  R.steps = job.steps.map(function (s) {
    return {
      step: num(s.step), tool: ascii(s.tool), brkTol: isBlank(s.brkTol) ? 0 : num(s.brkTol),
      program: String(s.program || '').trim(), meas: !!s.meas, measAlways: !!s.measAlways, brk: !!s.brk,
      maxBrk: isBlank(s.maxBrk) ? 1 : num(s.maxBrk), debug: !!s.debug,
      life: isBlank(s.life) ? 1 : num(s.life), setpiece: !!s.setpiece
    };
  });
  var all = R.steps.map(function (s) { return s.step; });
  if (R.probeStep.enabled) all.push(R.probeStep.step);
  R.lastStep = all.length ? Math.max.apply(null, all) : 0;
  R.P = resolveProbe(job.probing, R);
  return R;
}

      if (!isInt(s.maxBrk) || num(s.maxBrk) < 1) err(p + 'maxBrk', tag + 'max breaks must be a whole number >= 1');
    } else {
      if (!isBlank(s.brkTol) && !isNum(s.brkTol)) err(p + 'brkTol', tag + 'breakage tolerance must be a number');

function fRunNests() {
  return text([
    'PROC L_RUN_NESTS(STRING[25] LD_TNAME, REAL LD_BRK_TOL, INT LD_TOTAL, STRING[32] LD_PROG, INT LD_MEAS, INT LD_ALWAYS, INT LD_USEBRK, INT LD_MAXBRK, INT LD_DEBUG, INT LD_LIFE, INT LD_USESP)',
    'DEF INT LV_TNO                    ;spindle tool T number (GETEXET)',
    ';L_RUN_NESTS.SPF',
    ';Runs one machining step across all its nests.',
    ';GV_NEST is set by the caller: 1 on a fresh run, or the nest',
    ';that was running when the job stopped (restart). Loops from',
    ';there to LD_TOTAL.',
    ';',
    ';NEW TOOL (top of each running nest): GETEXET reads the tool in',
    ';the spindle ($P_TOOLNO is not reliable with magazine management,',
    ';SV). If it is disabled ($TC_TP8 bit 2, set when a break is found)',
    ';or its piece count is used up ($TC_MOP13>0 and $TC_MOP4<=0),',
    ';T/M6 by name brings in a sister.',
    ';MEASURE: LD_ALWAYS=1 measures before every nest. LD_ALWAYS=0',
    ';measures only while $TC_TP8 bit 7 (tool was in use) is 0.',
    ';STOPRE after the cut: the nest is finished before anything is',
    ';counted or GV_NEST moves on, so a restart never skips a half-cut',
    ';nest.',
    ';Results come back in GV_NESTS_CUT and GV_BRK_COUNT.',
    ';',
    ';  LD_TNAME   - tool name',
    ';  LD_BRK_TOL - break tolerance',
    ';  LD_TOTAL   - nest count',
    ';  LD_PROG    - B_ program (called per nest)',
    ';  LD_MEAS    - 1 = measuring on (laser)',
    ';  LD_ALWAYS  - 1 = always measure, 0 = smart (bit 7)',
    ';  LD_USEBRK  - 1 = break check after each nest',
    ';  LD_MAXBRK  - breaks this step before a hard stop',
    ';  LD_DEBUG   - 1 = M1 optional stop between nests',
    ';  LD_LIFE    - pieces to count per good nest (SETPIECE)',
    ';  LD_USESP   - 1 = SETPIECE on',
    ';',
    'GV_BRK_COUNT=0',
    'GV_NESTS_CUT=0',
    ';',
    '_RN_LOOP:',
    'IF (GV_NEST_STATUS[GV_NEST]==1)',
    '  GETEXET(LV_TNO)',
    '  ;--- new tool needed? (disabled by breakage, or used up) ---',
    '  IF (($TC_TP8[LV_TNO] B_AND 4)>0) OR (($TC_MOP13[LV_TNO,1]>0) AND ($TC_MOP4[LV_TNO,1]<=0))',
    '    T=LD_TNAME',
    '    M6',
    '    STOPRE',
    '    GETEXET(LV_TNO)',
    '  ENDIF',
    '  ;--- measure the tool in the spindle ---',
    '  IF (LD_MEAS==1)',
    '    IF (LD_ALWAYS==1)',
    '      L_TOOL_MEAS(LD_TNAME)',
    '    ELSE',
    '      IF (($TC_TP8[LV_TNO] B_AND 128)==0)',
    '        L_TOOL_MEAS(LD_TNAME)',
    '      ENDIF',
    '    ENDIF',
    '  ENDIF',
    '  C_P1_LOAD_WO',
    '  CALL LD_PROG',
    '  STOPRE',
    '  IF (LD_USEBRK==1)',
    '    L_TOOL_BRK(LD_TNAME,LD_BRK_TOL)',
    '    IF (GV_NEST_STATUS[GV_NEST]<>1)',
    '      GV_BRK_COUNT=GV_BRK_COUNT+1',
    '    ELSE',
    '      GV_NESTS_CUT=GV_NESTS_CUT+1',
    '      IF (LD_USESP==1)',
    '        SETPIECE(LD_LIFE)',
    '      ENDIF',
    '    ENDIF',
    '  ELSE',
    '    GV_NESTS_CUT=GV_NESTS_CUT+1',
    '    IF (LD_USESP==1)',
    '      SETPIECE(LD_LIFE)',
    '    ENDIF',
    '  ENDIF',
    'ENDIF',
    ';--- too many breaks? (jump kept outside the IF blocks, NC 4.1.7) ---',
    'IF (GV_BRK_COUNT>0) AND (GV_BRK_COUNT>=LD_MAXBRK) GOTOF _RN_MAXBRK',
    'IF (LD_DEBUG==1)',
    '  M1',
    'ENDIF',
    'GV_NEST=GV_NEST+1',
    'IF (GV_NEST<=LD_TOTAL) GOTOB _RN_LOOP',
    'RET',
    ';',
    ';--- too many breaks this step: park and hold until reset ---',
    ';A restart resumes at GV_STEP / GV_NEST; broken nests stay off.',
    '_RN_MAXBRK:',
    'C_P1_HOME',
    'LOOP',
    '  MSG("MAX BREAKAGE: " << GV_BRK_COUNT << " AT STEP " << GV_STEP << " - CHECK SETUP")',
    '  M0',
    '  STOPRE',
    'ENDLOOP',
    'RET',
    ';'
  ]);
}

function fWO(R) {
  var o = [], len = function (v) { return fix(v, R.U.dec); };
  hdr(o, R, 'C_P1_WO.SPF', R.single ? 'WRITE THE WORK OFFSET FOR THE SINGLE PART' : 'WRITE WORK OFFSET VALUES FOR ALL NESTS', [
    '; PALLET       : 1',
    '; MODE         : ' + modeDesc(R),
    '; KINEMATICS   : ' + kinDesc(R),
    '; UNITS        : ' + R.U.label + ' - MUST MATCH THE BASIC SYSTEM MD10240'
  ]);
  rev(o, R);
  o.push(';');
  o.push(';-------------------');
  o.push('; GLOBAL VARIABLES');
  o.push(';-------------------');
  o.push(';GV_WO[#]  - WO FRAME INDEX PER NEST ($P_UIFR[5] = G505)');
  o.push(';-------------------');
  o.push('; LOCAL VARIABLES');
  o.push(';-------------------');
  o.push('DEF INT LV_NEST');
  o.push('L_PAL_CHECK(1)');
  o.push(';-------------------------------------------');
  o.push('; THE FRAME CARRIES THE ROTARY ZERO OFFSET, NOT MOTION.');
  o.push('; LOAD THE OFFSET AND COMMAND ' + (orientLine(R) || 'THE ROTARY AXIS AT 0') + ': THE TABLE');
  o.push('; SWIVELS TO PRESENT THIS NEST\'S FACE.');
  o.push('; CTRANS WRITES X/Y/Z AND CLEARS EVERY OTHER COMPONENT,');
  o.push('; FINE OFFSETS INCLUDED. ROTARY AXES GET THEIR OWN TR LINE.');
  o.push(';-------------------------------------------');
  o.push('; VALUES WRITE ONLY ON A FRESH START (GV_STEP==0).');
  o.push('; A RESTART SKIPS THIS SO PROBED OFFSETS SURVIVE.');
  o.push('IF (GV_STEP==0)');
  var lastFace = -1;
  R.nests.forEach(function (nn) {
    if (!R.single && nn.face !== lastFace) {
      lastFace = nn.face;
      var first = (nn.face - 1) * R.npf + 1, last = Math.min(nn.face * R.npf, R.total);
      o.push('  ;-------------------------------------------');
      o.push('  ; FACE ' + nn.face + ': NESTS ' + first + (last > first ? '-' + last : ''));
      o.push('  ;-------------------------------------------');
    }
    o.push('  ;NEST ' + nn.n + ' G5' + ('0' + (nn.frame)).slice(-2) + (nn.notes ? ' - ' + nn.notes : '') + (nn.blank ? ' (BLANK X/Y/Z WRITTEN AS 0)' : ''));
    o.push('  LV_NEST=' + nn.n);
    o.push('  GV_WO[LV_NEST]=' + nn.frame);
    o.push('  $P_UIFR[GV_WO[LV_NEST]]=CTRANS(X,' + len(nn.x) + ',Y,' + len(nn.y) + ',Z,' + len(nn.z) + ')');
    if (R.trunnion !== 'NONE') o.push('  $P_UIFR[GV_WO[LV_NEST],' + R.trunnion + ',TR]=' + fix(nn.trun, 3));
    if (R.rotary !== 'NONE') o.push('  $P_UIFR[GV_WO[LV_NEST],' + R.rotary + ',TR]=' + fix(nn.rot, 3));
    o.push('  STOPRE');
  });
  o.push('ENDIF');
  o.push(';');
  o.push('RET');
  o.push(';');
  return text(o);
}

/* ---- probe program ---- */
function cyc977(R, mvar, setv, setv0, setv1, sid, ma) {
  var P = R.P, len = function (v) { return fix(v, R.U.dec); };
  var a = [];
  a[0] = String(mvar);            /* S_MVAR  1xx = WO correction            */
  a[1] = 'GV_WO[GV_NEST]';        /* S_KNUM  adjustable WO, fine (MC 5.1.7) */
  a[2] = '';                      /* S_KNUM1                                */
  a[3] = String(P.prnum);         /* S_PRNUM probe data set                 */
  a[4] = len(setv);               /* S_SETV  diameter / width               */
  a[5] = len(setv0);              /* S_SETV0 rectangle X                    */
  a[6] = len(setv1);              /* S_SETV1 rectangle Y                    */
  a[7] = len(P.fa);               /* S_FA    measurement path               */
  a[8] = len(P.fa);               /* S_TSA   safe area = S_FA               */
  a[9] = '0';                     /* S_STA1  starting angle                 */
  a[10] = len(sid);               /* S_ID    lowering for outside features  */
  a[11] = '0';                    /* S_SZA                                  */
  a[12] = '0';                    /* S_SZO                                  */
  a[13] = String(ma);             /* S_MA                                   */
  a[14] = '1';                    /* S_NMSP                                 */
  a[15] = '""';                   /* S_TNAME                                */
  for (var i = 16; i <= 24; i++) a[i] = '';   /* S_DLNUM..S_MCBIT */
  a[25] = '1';                    /* _DMODE  G17 inside the cycle           */
  a[26] = '0';                    /* _AMODE  no dimensional tolerance       */
  return 'CYCLE977(' + a.join(',') + ')';
}
function cyc978(R) {
  var P = R.P, len = function (v) { return fix(v, R.U.dec); };
  var a = [];
  a[0] = '100';                   /* S_MVAR  surface, WO correction         */
  a[1] = 'GV_WO[GV_NEST]';        /* S_KNUM  adjustable WO, fine            */
  a[2] = '';                      /* S_KNUM1                                */
  a[3] = String(P.prnum);         /* S_PRNUM                                */
  a[4] = len(P.zNom);             /* S_SETV  setpoint Z                     */
  a[5] = len(P.fa);               /* S_FA                                   */
  a[6] = len(P.fa);               /* S_TSA = S_FA                           */
  a[7] = '3';                     /* S_MA    3rd axis of the plane (Z)      */
  a[8] = '2';                     /* S_MD    2 = negative direction         */
  a[9] = '1';                     /* S_NMSP                                 */
  a[10] = '""';                   /* S_TNAME                                */
  for (var i = 11; i <= 19; i++) a[i] = '';   /* S_DLNUM..S_MCBIT */
  a[20] = '1';                    /* _DMODE  G17 inside the cycle           */
  a[21] = '0';                    /* _AMODE                                 */
  return 'CYCLE978(' + a.join(',') + ')';
}

  o.push('T=' + q(P.tool) + ' M6');
  o.push(ret);
  o.push('CYCLE800()                         ;deselect any active swivel plane');
  o.push('TRAFOOF                            ;cancel any active transformation');
  o.push('G54 D1');
  var ol = orientLine(R);
  if (ol) o.push(pad(ol, 35) + ';swivel to this nest\'s face (angle is in the WO)');
  o.push('M19');
  o.push(';');
  var mOn = P.probeOnM;
  if (P.health) {
    o.push(';--- PROBE HEALTH CHECK (ONCE PER JOB, FIRST ACTIVE NEST) ---');
    o.push('IF (GV_PROBE_CHK==0)');
    o.push('  G54 D1');
    if (mOn) o.push('  ' + mOn + '                              ;probe on');
    o.push('  G0 X=' + len(P.hX) + ' Y=' + len(P.hY));
    o.push('  G0 Z=' + len(P.hStartZ));
    o.push('  G1 MEAS=1 Z=' + len(P.hTargetZ) + ' F' + feed(P.hFeed));
    o.push('  STOPRE');
    o.push('  IF ($AC_MEA[1]==0)');
    o.push('    ' + ret);
    o.push('    LOOP');
    o.push('      MSG("PROBE HEALTH CHECK FAILED - PROBE DID NOT TRIGGER")');
    o.push('      M0');
    o.push('      STOPRE');
    o.push('    ENDLOOP');
    o.push('  ENDIF');
    o.push('  ' + ret);
    o.push('  GV_PROBE_CHK=1');
    o.push('ENDIF');
    o.push(';');
  }
  if (P.partCheck) {
    o.push(';--- PART EXISTENCE CHECK (MEAS TOUCH, NO ALARM) ---');
    o.push(';  NO TRIGGER WITHIN ' + len(P.maxTravel) + ' OF TRAVEL = NO PART');
    o.push('G54 D1');
    if (mOn) o.push(mOn + '                                ;probe on');
    o.push('G0 X=' + len(P.chkLoc.x) + ' Y=' + len(P.chkLoc.y));
    o.push('G0 Z=' + len(P.chkLoc.z));
    o.push('G1 MEAS=1 Z=' + len(P.chkTarget) + ' F' + feed(P.feed));
    o.push('STOPRE');
    o.push('IF ($AC_MEA[1]==0)');
    o.push('  GV_NEST_STATUS[GV_NEST]=2');
    o.push('  MSG("NEST " << GV_NEST << " - NO PART")');
    o.push('ENDIF');
    o.push(ret);
    o.push('IF (GV_NEST_STATUS[GV_NEST]<>1) GOTOF PROBE_END');
    o.push(';');
  }
  if (!P.skipZ) {
    o.push(';--- Z DATUM: SURFACE (CYCLE978) ---');
    o.push('G54 D1');
    o.push('G0 X=' + len(P.zLoc.x) + ' Y=' + len(P.zLoc.y));
    o.push('G0 Z=' + len(P.zLoc.z));
    o.push(cyc978(R));
    o.push('STOPRE');
    tolCheck(o, R, 'Z', 'SURFACE');
    o.push(ret);
    o.push(';');
  }
  if (P.xyMethod !== 'NONE') {
    o.push(';--- XY DATUM: ' + P.xyMethod + ' ---');
    o.push('G54 D1');
    o.push('G0 X=' + len(P.appX) + ' Y=' + len(P.appY));
    if (P.outside) {
      o.push('G0 Z=' + len(P.xyStartZ) + '                    ;start above the feature');
      o.push(';  THE CYCLE LOWERS TO MEASURING HEIGHT ITSELF: S_ID = ' + len(P.sid));
    } else {
      o.push('G0 Z=' + len(P.xyStartZ));
      o.push('G1 Z=' + len(P.probeZ) + ' F' + feed(P.feed) + '                 ;lower to probe depth');
    }
    var w = P.widthX, h = P.widthY, d = P.diameter, sid = P.sid;
    switch (P.xyMethod) {
      case 'SPLIT EXTERIOR':
        o.push(';--- X RIB ---');
        o.push(cyc977(R, 104, w, 0, 0, sid, 1));
        o.push('STOPRE');
        tolCheck(o, R, 'X', 'RIB');
        o.push(';--- Y RIB (STARTS ABOVE THE CENTER, MC 4.3.10) ---');
        o.push(cyc977(R, 104, h, 0, 0, sid, 2));
        o.push('STOPRE');
        tolCheck(o, R, 'Y', 'RIB');
        break;
      case 'BORE':
        o.push(cyc977(R, 101, d, 0, 0, 0, 1));
        o.push('STOPRE');
        tolCheck(o, R, 'X', 'BORE'); tolCheck(o, R, 'Y', 'BORE');
        break;
      case 'BOSS':
        o.push(cyc977(R, 102, d, 0, 0, sid, 1));
        o.push('STOPRE');
        tolCheck(o, R, 'X', 'BOSS'); tolCheck(o, R, 'Y', 'BOSS');
        break;
      case 'RECT POCKET':
        o.push(cyc977(R, 105, 0, w, h, 0, 1));
        o.push('STOPRE');
        tolCheck(o, R, 'X', 'POCKET'); tolCheck(o, R, 'Y', 'POCKET');
        break;
      case 'RECT SPIGOT':
        o.push(cyc977(R, 106, 0, w, h, sid, 1));
        o.push('STOPRE');
        tolCheck(o, R, 'X', 'SPIGOT'); tolCheck(o, R, 'Y', 'SPIGOT');
        break;
    }
    o.push(';');
  }
  o.push('PROBE_END:');
  o.push(';--- SAFE Z RETRACT ---');
  o.push(ret);
  o.push(';');
  o.push('RET');
  o.push(';');
  return text(o);
}

/* ---- main program ---- */
function aBound(o, R) {
  o.push('IF (GV_NEST<1) OR (GV_NEST>' + R.total + ')');
  o.push('  GV_NEST=1');
  o.push('ENDIF');
}
function aStepStart(o) { o.push('LV_STEP_START=$A_HOUR*3600+$A_MINUTE*60+$A_SECOND'); }
function fMain(R) {
  var o = [], N = R.total, U = R.U;
  o.push('; PROGRAM      : A_P1.MPF');
  o.push('; PRG FUNCTION : MAIN PROGRAM - RUNS EVERY STEP ACROSS EVERY NEST');
  o.push('; PART NUMBER  : ' + (R.header.part || 'XXXX'));
  o.push('; MATERIAL     : ' + (R.header.material || 'XXXX'));
  o.push('; STOCK        : ' + (R.header.stock || 'XXXX'));
  o.push('; MACHINE      : ' + (R.header.machine || 'XXXX'));
  o.push('; CONTROL      : SINUMERIK ONE');
  o.push('; PROGRAMMER   : ' + (R.header.programmer || 'XXXX'));
  o.push('; DATE CREATED : ' + R.date);
  o.push('; PALLET       : 1');
  o.push('; MODE         : ' + modeDesc(R));
  o.push('; KINEMATICS   : ' + kinDesc(R));
  o.push('; UNITS        : ' + U.label + ' - MUST MATCH THE BASIC SYSTEM MD10240');
  o.push('; GENERATED    : SINUMERIK_GENERATOR.HTML V' + GEN_VERSION);
  rev(o, R);
  o.push(';');
  o.push(';-------------------');
  o.push('; GLOBAL VARIABLES (UGUD.DEF)');
  o.push(';-------------------');
  o.push(';GV_STEP           - CURRENT STEP (0 = FRESH PALLET)');
  o.push(';GV_NEST           - CURRENT NEST');
  o.push(';GV_NEST_STATUS[#] - 0 OFF, 1 RUNNING, 2 NO PART, 100+STEP FAILED');
  o.push(';GV_WO[#]          - WO FRAME PER NEST');
  o.push(';GV_SKIP           - 1 = EVERY NEST OFF, SKIP THE STEP');
  o.push(';GV_BRK_COUNT      - BREAKS THIS STEP');
  o.push(';GV_NESTS_CUT      - NESTS CUT THIS STEP');
  o.push(';GV_PROBE_CHK      - 1 = PROBE HEALTH CHECK DONE THIS JOB');
  o.push(';-----------------');
  o.push('; LOCAL VARIABLES (DEFINITIONS FIRST, NC 4.1.1.4)');
  o.push(';-----------------');
  o.push('DEF INT LV_GOOD_PARTS              ;GOOD PART COUNT AT END');
  o.push('DEF INT LV_I                       ;LOOP COUNTER');
  o.push('DEF REAL LV_CYCLE_START            ;CYCLE START TIME (SECONDS)');
  o.push('DEF REAL LV_STEP_START             ;STEP START TIME (SECONDS)');
  o.push('DEF REAL LV_CYCLE_TIME             ;CYCLE TIME (SECONDS)');
  o.push(';----------------');
  o.push('; SUB PROGRAMS');
  o.push(';----------------');
  o.push(';C_P1_WO       - WRITE WO FOR ALL NESTS (FRESH START ONLY)');
  o.push(';C_P1_NESTS    - SET NEST STATUS (FRESH START ONLY)');
  o.push(';C_P1_LOAD_WO  - LOAD G54 WITH THE CURRENT NEST WO');
  o.push(';C_P1_HOME     - SAFE Z AT THE TOP OF TRAVEL');
  if (R.probeStep.enabled) o.push(';' + pad(R.probeStep.program, 14) + '- PROBE ONE NEST');
  o.push(';L_PAL_CHECK   - CHECK PALLET NUMBER (CYCLE DIR)');
  o.push(';L_SKIP_CHECK  - SKIP A STEP IF EVERY NEST IS OFF');
  o.push(';L_TOOL_LOAD   - LOAD THE STEP TOOL BY NAME');
  o.push(';L_RUN_NESTS   - RUN ONE STEP ACROSS EVERY NEST');
  o.push(';L_TOOL_MEAS   - BLUM LASER TOOL MEASURE');
  o.push(';L_TOOL_BRK    - BLUM LASER BREAKAGE CHECK');
  o.push(';L_STEP_LOG    - STEP TIME + DATA LOGGING');
  o.push(';L_DATA_LOG    - PRODUCTION DATA LOG LINE');
  o.push(';L_STEP_ERROR  - HOLD IF GV_STEP IS UNKNOWN');
  o.push(';');
  o.push('GROUP_BEGIN(0,"SETUP",0,0)');
  o.push(pad(U.g, 35) + ';' + (R.units === 'INCH' ? 'INCH' : 'METRIC') + ' - SAME AS THE BASIC SYSTEM');
  o.push(';=== ' + modeDesc(R) + ' ===');
  o.push(';--------------------');
  o.push(';  PALLET & WCS SETUP');
  o.push(';--------------------');
  o.push('L_PAL_CHECK(1)');
  o.push('C_P1_WO');
  o.push('C_P1_NESTS');
  if (!R.single) {
    o.push(';--------------------');
    o.push(';  TURN OFF A NEST');
    o.push(';--------------------');
    o.push('; Delete the ; in front of a nest below to skip');
    o.push('; it this run (no probing, no machining).');
    o.push(';--------------------');
    for (var n = 1; n <= N; n++) o.push(';GV_NEST_STATUS[' + n + ']=0');
  }
  o.push('STOPRE');
  o.push(';--------------------');
  o.push(';   HOME POSITION');
  o.push(';--------------------');
  o.push('C_P1_HOME');
  o.push('GROUP_END(0,0)');
  o.push('GROUP_BEGIN(0,"STEP LIST",0,0)');
  o.push(';=====================');
  o.push(';     STEP LIST');
  o.push(';=====================');
  if (R.probeStep.enabled) {
    o.push(';STEP ' + R.probeStep.step + ': PROBE');
    o.push(';   PROG: ' + R.probeStep.program);
    o.push(';   TOOL: ' + R.P.tool);
    o.push(';');
  }
  R.steps.forEach(function (s) {
    o.push(';STEP ' + s.step + ':');
    o.push(';   PROG: ' + s.program);
    o.push(';   TOOL: ' + s.tool);
    o.push(';   MEAS=' + (s.meas ? (s.measAlways ? 'ALWAYS' : 'SMART') : 'OFF') + ' BRK=' + (s.brk ? 'ON TOL ' + fix(s.brkTol, U.dec) + ' MAX ' + s.maxBrk : 'OFF') +
           ' SETPIECE=' + (s.setpiece ? s.life : 'OFF') + (s.debug ? ' DEBUG M1' : ''));
    o.push(';');
  });
  o.push('GROUP_END(0,0)');
  o.push(';--------------------');
  o.push(';      RE-START');
  o.push(';--------------------');
  o.push(';GV_STEP<>0 MEANS THE LAST RUN DID NOT FINISH: THE JOB');
  o.push(';RESUMES AT THAT STEP AND NEST. A FRESH SISTER TOOL IS');
  o.push(';MEASURED AUTOMATICALLY.');
  o.push('LV_CYCLE_START=$A_HOUR*3600+$A_MINUTE*60+$A_SECOND');
  o.push('IF (GV_STEP<>0)');
  o.push('  MSG("RESUMING AT STEP " << GV_STEP << " NEST " << GV_NEST << " - FOR A NEW PALLET SET GV_STEP=0 THEN RESTART")');
  o.push('  M0');
  o.push('  STOPRE');
  o.push('ENDIF');
  if (R.probeStep.enabled) o.push('IF (GV_STEP==' + R.probeStep.step + ') GOTOF STEP' + R.probeStep.step);
  R.steps.forEach(function (s) { o.push('IF (GV_STEP==' + s.step + ') GOTOF STEP' + s.step); });
  o.push('L_STEP_ERROR');
  if (R.probeStep.enabled) {
    if (R.single) singleProbeStep(o, R); else probeStep(o, R);
  }
  R.steps.forEach(function (s) { cutStep(o, R, s); });
  if (R.single) singleEnd(o, R); else tombEnd(o, R);
  return text(o);
}
function stepBanner(o, s, l2, l3) {
  o.push(';================================');
  o.push(';          STEP ' + s);
  o.push(';        ' + l2);
  if (l3) o.push(';        ' + l3);
  o.push(';================================');
}
function probeStep(o, R) {
  var s = R.probeStep.step, N = R.total;
  stepBanner(o, s, 'PROBE ALL NESTS', R.probeStep.program);
  o.push('GV_STEP=' + s);
  o.push('STEP' + s + ':');
  o.push('MSG("STEP ' + s + ' / ' + R.lastStep + ' - PROBE")');
  aStepStart(o);
  o.push(';--- resume at the nest that was running, or start at 1 ---');
  aBound(o, R);
  o.push('STEP' + s + '_NEST:');
  o.push('IF (GV_NEST_STATUS[GV_NEST]==1)');
  o.push('  C_P1_LOAD_WO');
  o.push('  ' + R.probeStep.program);
  o.push('  STOPRE');
  o.push('ENDIF');
  o.push('GV_NEST=GV_NEST+1');
  o.push('IF (GV_NEST<=' + N + ') GOTOB STEP' + s + '_NEST');
  o.push(';---- STEP ' + s + ' END ----');
  o.push('L_STEP_LOG(' + s + ',' + q('PROBE') + ',0,0,LV_STEP_START)');
  o.push('STOPRE');
}
function singleProbeStep(o, R) {
  var s = R.probeStep.step;
  stepBanner(o, s, 'PROBE PART', R.probeStep.program);
  o.push('GV_STEP=' + s);
  o.push('STEP' + s + ':');
  o.push('MSG("STEP ' + s + ' / ' + R.lastStep + ' - PROBE")');
  aStepStart(o);
  o.push('GV_NEST=1');
  o.push('IF (GV_NEST_STATUS[1]==1)');
  o.push('  C_P1_LOAD_WO');
  o.push('  ' + R.probeStep.program);
  o.push('  STOPRE');
  o.push('ENDIF');
  o.push(';--- single part: no part or out of tolerance = hold ---');
  o.push('IF (GV_NEST_STATUS[1]<>1)');
  o.push('  C_P1_HOME');
  o.push('  LOOP');
  o.push('    MSG("NO PART, OUT OF TOLERANCE OR NEST OFF AT STEP ' + s + '")');
  o.push('    M0');
  o.push('    STOPRE');
  o.push('  ENDLOOP');
  o.push('ENDIF');
  o.push(';---- STEP ' + s + ' END ----');
  o.push('L_STEP_LOG(' + s + ',' + q('PROBE') + ',0,0,LV_STEP_START)');
  o.push('STOPRE');
}
function cutStep(o, R, s) {
  var U = R.U, N = R.total;
  stepBanner(o, s.step, q(s.tool), s.program);
  o.push('GV_STEP=' + s.step);
  o.push('STEP' + s.step + ':');
  o.push(';--- resume at the nest that was running, or start at 1 ---');
  aBound(o, R);
  o.push('MSG("STEP ' + s.step + ' / ' + R.lastStep + ' - ' + s.tool + '")');
  o.push('GV_NESTS_CUT=0 GV_BRK_COUNT=0');
  aStepStart(o);
  o.push('L_SKIP_CHECK(' + N + ')');
  o.push('IF (GV_SKIP==1) GOTOF STEP' + s.step + '_DONE');
  o.push('L_TOOL_LOAD(' + q(s.tool) + ')');
  o.push('L_RUN_NESTS(' + [q(s.tool), fix(s.brkTol, U.dec), N, q(s.program), s.meas ? 1 : 0, s.measAlways ? 1 : 0,
    s.brk ? 1 : 0, s.maxBrk, s.debug ? 1 : 0, s.life, s.setpiece ? 1 : 0].join(',') + ')');
  o.push('STEP' + s.step + '_DONE:');
  o.push(';---- STEP ' + s.step + ' END ----');
  o.push('L_STEP_LOG(' + s.step + ',' + q(s.tool) + ',GV_NESTS_CUT,GV_BRK_COUNT,LV_STEP_START)');
  o.push('STOPRE');
}
function cycleTime(o) {
  o.push('LV_CYCLE_TIME=$A_HOUR*3600+$A_MINUTE*60+$A_SECOND-LV_CYCLE_START');
  o.push('IF (LV_CYCLE_TIME<0)');
  o.push('  LV_CYCLE_TIME=LV_CYCLE_TIME+86400');
  o.push('ENDIF');
}
function tombEnd(o, R) {
  var N = R.total;
  o.push(';===================');
  o.push(';   PROGRAM END');
  o.push(';===================');
  o.push(';--- COUNT GOOD PARTS, LOG THE CYCLE ---');
  o.push('LV_GOOD_PARTS=0');
  o.push('LV_I=1');
  o.push('WHILE (LV_I<=' + N + ')');
  o.push('  IF (GV_NEST_STATUS[LV_I]==1)');
  o.push('    LV_GOOD_PARTS=LV_GOOD_PARTS+1');
  o.push('  ENDIF');
  o.push('  LV_I=LV_I+1');
  o.push('ENDWHILE');
  o.push('L_STEP_LOG(0,' + q('TOTAL') + ',LV_GOOD_PARTS,0,LV_CYCLE_START)');
  cycleTime(o);
  o.push(';--- SAFE HOME, THEN REPORT EVERY NEST THAT IS NOT GOOD ---');
  o.push('C_P1_HOME');
  o.push('LV_I=1');
  o.push('WHILE (LV_I<=' + N + ')');
  o.push('  IF (GV_NEST_STATUS[LV_I]==0)');
  o.push('    MSG("NEST " << LV_I << " = INACTIVE (OPERATOR)")');
  o.push('    M0');
  o.push('    STOPRE');
  o.push('  ENDIF');
  o.push('  IF (GV_NEST_STATUS[LV_I]==2)');
  o.push('    MSG("NEST " << LV_I << " = NO PART OR OUT OF TOLERANCE (PROBE)")');
  o.push('    M0');
  o.push('    STOPRE');
  o.push('  ENDIF');
  o.push('  IF (GV_NEST_STATUS[LV_I]>=100)');
  o.push('    MSG("NEST " << LV_I << " = TOOL FAILURE AT STEP " << (GV_NEST_STATUS[LV_I]-100))');
  o.push('    M0');
  o.push('    STOPRE');
  o.push('  ENDIF');
  o.push('  LV_I=LV_I+1');
  o.push('ENDWHILE');
  o.push('MSG("CYCLE COMPLETE - " << LV_GOOD_PARTS << " OF ' + N + ' GOOD - " << LV_CYCLE_TIME << " SEC")');
  endClear(o);
}
function singleEnd(o, R) {
  o.push(';===================');
  o.push(';   PROGRAM END');
  o.push(';===================');
  o.push('LV_GOOD_PARTS=0');
  o.push('IF (GV_NEST_STATUS[1]==1)');
  o.push('  LV_GOOD_PARTS=1');
  o.push('ENDIF');
  o.push('L_STEP_LOG(0,' + q('TOTAL') + ',LV_GOOD_PARTS,0,LV_CYCLE_START)');
  cycleTime(o);
  o.push('C_P1_HOME');
  o.push('IF (GV_NEST_STATUS[1]==1)');
  o.push('  MSG("CYCLE COMPLETE - GOOD PART - " << LV_CYCLE_TIME << " SEC")');
  o.push('ELSE');
  o.push('  IF (GV_NEST_STATUS[1]>=100)');
  o.push('    MSG("CYCLE COMPLETE - TOOL FAILURE AT STEP " << (GV_NEST_STATUS[1]-100) << " - " << LV_CYCLE_TIME << " SEC")');
  o.push('  ELSE');
  o.push('    IF (GV_NEST_STATUS[1]==2)');
  o.push('      MSG("CYCLE COMPLETE - NO PART - " << LV_CYCLE_TIME << " SEC")');
  o.push('    ELSE');
  o.push('      MSG("CYCLE COMPLETE - NEST OFF - " << LV_CYCLE_TIME << " SEC")');
  o.push('    ENDIF');
  o.push('  ENDIF');
  o.push('ENDIF');
  endClear(o);
}
function endClear(o) {
  o.push(';');
  o.push(';--- CLEAR STEP FOR THE NEXT PALLET ---');
  o.push('GV_STEP=0');
  o.push('GV_NEST=0');
  o.push(';');
  o.push('M30');
  o.push(';');
}

      u32(crc), u32(data.length), u32(data.length), u16(name.length), u16(0), u16(0), u16(0), u16(0),

}

function renderAll() {
  renderConfig(); renderProbing(); renderWcs(); renderOutput();
  var part = S.ascii(job.header.part);
  $('#jobLabel').textContent = part ? '· Job ' + part : '';
}

/* ---- messages ---- */
function showMsgs(kind, title, items) {
  var h = '<div class="msg ' + kind + '"><b>' + esc(title) + '</b>';
  if (items && items.length) h += '<ul>' + items.map(function (e) {
    return '<li>' + (e.path ? '<a href="#" data-goto="' + esc(e.path) + '">' + esc(e.msg) + '</a>' : esc(e.msg || e)) + '</li>'; }).join('') + '</ul>';
  h += '</div>';
  $('#msgs').innerHTML = h;
}
function clearMsgs() { $('#msgs').innerHTML = ''; }
function tabOf(path) {
  if (/^probing\./.test(path)) return 'probing';
  if (/^wcs\./.test(path)) return 'wcs';
  return 'config';
}
function showTab(name) {
  document.querySelectorAll('nav.tabs button').forEach(function (b) { b.classList.toggle('active', b.dataset.tab === name); });
  document.querySelectorAll('.tab').forEach(function (t) { t.classList.toggle('active', t.id === 'tab-' + name); });
}
function gotoPath(path) {
  showTab(tabOf(path));
  var el = document.querySelector('[data-path="' + path + '"]');
  if (el) { el.focus(); el.scrollIntoView({ block: 'center' }); }
}

/* ---- validation flow ---- */
function runValidate() {
  var v = S.validate(job);
  errPaths = {};
  v.errors.forEach(function (e) { errPaths[e.path] = 1; });
  renderAll();
  return v;
}
/* generic modal: paragraphs of plain text, buttons [{label, value, primary}];
   Escape answers escValue */
function askChoice(title, paras, buttons, escValue) {
  return new Promise(function (resolve) {
    var d = $('#dlg');
    $('#dlgTitle').textContent = title;
    var body = $('#dlgBody'), btns = $('#dlgBtns');
    body.innerHTML = ''; btns.innerHTML = '';
    paras.forEach(function (t) { var p = document.createElement('p'); p.textContent = t; body.appendChild(p); });
    function done(v) { d.close(); d.oncancel = null; btns.innerHTML = ''; resolve(v); }
    buttons.forEach(function (b) {
      var el = document.createElement('button');
      el.type = 'button'; el.textContent = b.label; el.dataset.choice = b.value;
      if (b.primary) el.className = 'primary';
      el.onclick = function () { done(b.value); };
      btns.appendChild(el);
    });
    d.oncancel = function (ev) { ev.preventDefault(); done(escValue); };
    d.showModal();
  });
}
function askBlank(list) {
  return askChoice('Blank work offsets', [
    'Nest' + (list.length > 1 ? 's ' : ' ') + list.join(', ') + ' ' + (list.length > 1 ? 'have' : 'has') + ' a blank X, Y or Z work offset.',
    'Those X / Y / Z values will be written as 0.000 = machine zero, not the part. In a multi-nest job that is almost always a mistake.',
    'Generate anyway?'
  ], [
    { label: 'No – stop', value: 'no', primary: true },
    { label: 'Yes – write 0.000', value: 'yes' }
  ], 'no').then(function (v) { return v === 'yes'; });
}

/* ---- step builder ---- */
function namesMsg(r) {
  if (!r.unnamed.length) return '';
  var m = ' Step' + (r.unnamed.length > 1 ? 's ' : ' ') + r.unnamed.join(', ') + ' got no program name: B_[part]_[step]_[machine] would be over 24 characters.';
  m += r.maxMachine > 0 ? ' With this part number the machine name can be at most ' + r.maxMachine + ' characters.'
    : ' The part number is too long for the pattern; type these names by hand.';
  return m;
}
function runBuilder() {
  var check = S.buildSteps(job, 'overwrite');
  if (check.error) { showMsgs('bad', 'Step builder: ' + check.error); return Promise.resolve(null); }
  var withData = job.steps.filter(function (s) { return !S.isBlank(s.tool) || !S.isBlank(s.program) || !S.isBlank(s.brkTol); }).length;
  var b = job.builder;
  var range = 'steps ' + S.num(b.first) + ' to ' + S.num(b.last) + ' by ' + S.num(b.inc) + ' (' + check.count + ' rows)';
  var gate = S.hasStepData(job) ? askChoice('Step table already has data', [
    'The table has ' + job.steps.length + ' row' + (job.steps.length === 1 ? '' : 's') + ', ' + withData + ' with a tool, program or tolerance filled in.',
    'Overwrite all: replace every row with ' + range + '. Everything typed in the table is lost.',
    'Keep existing: leave every current row exactly as it is, add the steps of the range that are missing, and sort by step number.'
  ], [
    { label: 'Overwrite all', value: 'overwrite' },
    { label: 'Keep existing, add missing', value: 'keep', primary: true },
    { label: 'Cancel', value: 'cancel' }
  ], 'cancel') : Promise.resolve('overwrite');
  return gate.then(function (mode) {
    if (mode === 'cancel') { showMsgs('warn', 'Step builder cancelled. Nothing changed.'); return null; }
    var r = S.buildSteps(job, mode);
    if (r.error) { showMsgs('bad', 'Step builder: ' + r.error); return null; }
    job.steps = r.steps; job.probeStep.program = r.probeProgram;
    dirty = true; errPaths = {}; renderAll(); showTab('config');
    var msg = (mode === 'keep' ? 'Kept every existing row and added ' + r.added + ' of ' + range + '.'
      : 'Step table rebuilt: ' + range + '.') + ' Fill in tool, breakage tolerance and life per row.' + namesMsg(r);
    showMsgs(r.unnamed.length ? 'warn' : 'ok', msg);
    return mode;
  });
}
function build(download) {
  var v = runValidate();
  if (v.errors.length) {
    showMsgs('bad', 'Cannot generate. Fix these first (' + v.errors.length + '):', v.errors);
    return Promise.resolve(null);
  }
  var gate = v.blankNests.length ? askBlank(v.blankNests) : Promise.resolve(true);
  return gate.then(function (yes) {
    if (!yes) { showMsgs('warn', 'Generation stopped. Fill in the blank work offsets on tab 3, then generate again.'); return null; }
    var g = S.generate(job);
    lastFiles = g.files; selFile = 0; dirty = false;
    if (download) {
      var z = S.makeZip(g.files);
      var name = (S.ascii(job.header.part).replace(/[^A-Za-z0-9_-]+/g, '_') || 'SINUMERIK') + '_NC_' + g.R.date + '.zip';
      saveBlob(new Blob([z], { type: 'application/zip' }), name);
      showMsgs('ok', 'Generated ' + g.files.length + ' files into ' + name + '.' + (v.blankNests.length ? ' Blank offsets written as 0 for nest(s) ' + v.blankNests.join(', ') + '.' : ''));
    } else {
      showMsgs('ok', 'Preview built: ' + g.files.length + ' files. Nothing saved yet.');
    }
    showTab('output'); renderOutput();
    return g;
  });
}
function saveBlob(blob, name) {
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

/* ---- edits ---- */
var STRUCT = /^(config\.|probeStep\.enabled|probing\.(xyMethod|partCheck|chkAlt|skipZ|zAlt|health|searchDist)$|steps\.\d+\.(brk|meas|setpiece)$)/;
function onEdit(e) {
  var el = e.target, p = el.dataset && el.dataset.path;
  if (!p) return;
  var v = el.type === 'checkbox' ? el.checked : el.value;
  setPath(job, p, v);
  dirty = true;
  if (errPaths[p] && e.type === 'input') { delete errPaths[p]; el.classList.remove('err'); }
  if (/^(header\.(part|machine)|builder\.)/.test(p)) {   /* live, no re-render */
    var bn = $('#builderNote'); if (bn) bn.innerHTML = builderNote();
    var part = S.ascii(job.header.part);
    $('#jobLabel').textContent = part ? '· Job ' + part : '';
  }
  if (e.type !== 'change') return;
  if (p === 'config.faces' || p === 'config.nestsPerFace') {
    var f = S.num(job.config.faces), n = S.num(job.config.nestsPerFace);
    if (S.isInt(job.config.faces) && S.isInt(job.config.nestsPerFace) && f > 0 && n > 0)
      job.config.totalNests = String(Math.min(f * n, S.MAX_NESTS));
  }
  if (p === 'config.mode' && job.config.mode === 'SINGLE PART') { /* kept, not used */ }
  if (STRUCT.test(p)) scheduleRender();
}
/* A change event fires on blur, which can be the mousedown of a button
   click. Re-rendering then would replace the button and swallow the click,
   so the re-render waits until the mouse button is released. */
var pointerDown = false, pendingRender = false;
document.addEventListener('mousedown', function () { pointerDown = true; }, true);
document.addEventListener('mouseup', function () {
  pointerDown = false;
  if (pendingRender) { pendingRender = false; setTimeout(doRender, 0); }
}, true);
function scheduleRender() { if (pointerDown) pendingRender = true; else doRender(); }
function doRender() {
  var a = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.path : null;
  renderAll();
  if (a) { var b = document.querySelector('[data-path="' + a + '"]'); if (b) b.focus(); }
}
function onClick(e) {
  var t = e.target.closest('[data-act],[data-tab],[data-file],[data-goto]');
  if (!t) return;
  if (t.dataset.tab) { showTab(t.dataset.tab); return; }
  if (t.dataset.goto) { e.preventDefault(); gotoPath(t.dataset.goto); return; }
  if (t.dataset.file !== undefined) { selFile = Number(t.dataset.file); renderOutput(); return; }
  var act = t.dataset.act, i = Number(t.dataset.i);
  if (act === 'add') {
    var last = job.steps.length ? S.num(job.steps[job.steps.length - 1].step) : NaN;
    var next = isNaN(last) ? 10 : Math.floor(last / 10) * 10 + 10;
    job.steps.push(S.blankStep(next)); dirty = true; renderAll();
  } else if (act === 'del') {
    if (job.steps.length <= 1) { showMsgs('warn', 'A job needs at least one cutting step.'); return; }
    job.steps.splice(i, 1); dirty = true; errPaths = {}; renderAll();
  } else if (act === 'up' && i > 0) {
    var a = job.steps[i - 1]; job.steps[i - 1] = job.steps[i]; job.steps[i] = a; dirty = true; errPaths = {}; renderAll();
  } else if (act === 'down' && i < job.steps.length - 1) {
    var b = job.steps[i + 1]; job.steps[i + 1] = job.steps[i]; job.steps[i] = b; dirty = true; errPaths = {}; renderAll();
  } else if (act === 'names') {
    var r = S.fillNames(job);
    if (r.error) { showMsgs('bad', r.error); return; }
    job.steps = r.steps; job.probeStep.program = r.probeProgram;
    dirty = true; renderAll();
    showMsgs(r.unnamed.length ? 'warn' : 'ok', 'Filled ' + r.filled + ' blank program name' + (r.filled === 1 ? '' : 's') + '.' + namesMsg(r));
  } else if (act === 'build') { runBuilder(); }
  else if (act === 'preview') { build(false); }
  else if (act === 'zip') { build(true); }
  else if (act === 'dlone' && lastFiles) {
    var f = lastFiles[selFile];
    saveBlob(new Blob([f.text], { type: 'text/plain' }), f.path.split('/').pop());
  }
}

/* ---- save / load ---- */
function saveJob() {
  var name = (S.ascii(job.header.part).replace(/[^A-Za-z0-9_-]+/g, '_') || 'JOB') + '_job.json';
  saveBlob(new Blob([JSON.stringify(job, null, 2) + '\n'], { type: 'application/json' }), name);
  dirty = false;
  showMsgs('ok', 'Saved ' + name + '. Load it with Load job… to reopen this job.');
}
function loadJob(file) {
  var r = new FileReader();
  r.onload = function () {
    try {
      var obj = JSON.parse(String(r.result));
      if (!obj || obj.format !== 'SINUMERIK_ONE_GENERATOR_JOB') throw new Error('not a job file saved by this generator');
      job = S.normalizeJob(obj); errPaths = {}; lastFiles = null; dirty = false;
      renderAll(); showTab('config');
      showMsgs('ok', 'Loaded ' + file.name + '.');
    } catch (ex) { showMsgs('bad', 'Could not load ' + file.name + ': ' + ex.message); }
  };
  r.readAsText(file);
}

document.addEventListener('input', onEdit);
document.addEventListener('change', onEdit);
document.addEventListener('click', onClick);
$('#btnValidate').addEventListener('click', function () {
  var v = runValidate();
  if (v.errors.length) showMsgs('bad', 'Validation: ' + v.errors.length + ' problem(s).', v.errors);
  else if (v.blankNests.length) showMsgs('warn', 'Valid, but nest(s) ' + v.blankNests.join(', ') + ' have blank X/Y/Z (written as 0.000 = machine zero). You will be asked when you generate.');
  else showMsgs('ok', 'Validation passed.');
});
$('#btnGenerate').addEventListener('click', function () { build(true); });
$('#btnSave').addEventListener('click', saveJob);
$('#btnLoad').addEventListener('click', function () { $('#fileLoad').value = ''; $('#fileLoad').click(); });
$('#fileLoad').addEventListener('change', function () { if (this.files && this.files[0]) loadJob(this.files[0]); });
window.addEventListener('beforeunload', function (e) { if (dirty) { e.preventDefault(); e.returnValue = ''; } });
window.SNG_UI = { getJob: function () { return job; }, setJob: function (j) { job = S.normalizeJob(j); errPaths = {}; lastFiles = null; renderAll(); } };
renderAll();
})();
</script>
</body>
</html>
