<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SINUMERIK ONE Generator</title>
<style>
:root {
  /* HELLER blue (slides #004388, site #004288), deep tile blue, cyan */
  --blue: #004288; --blue-h: #00366f; --blue-d: #002e5e; --blue-deep: #003b78; --blue-lt: #0b5aa6;
  --blue-t: #eef4fa; --blue-b: #b6c9de; --cyan: #00b0eb; --cyan-d: #0086bf; --cyan-g: rgba(0, 176, 235, 0.28);
  /* dark bands: near-black top bar and footer, steel page head */
  --bar: #141619; --band: #2b343e; --tile: #25292e; --tile-h: #30353b; --barline: #3d4248; --bartext: #d3d7db; --barmuted: #8d959d;
  /* greys (HELLER slides and site) */
  --k-900: #3b3b3d; --k-800: #4a4d50; --k-700: #5d6267; --k-600: #7f8489; --k-500: #9aa1a7; --k-400: #bcc3c8;
  --k-300: #d3d8dc; --k-200: #e3e7e9; --k-100: #eef0f0; --k-50: #f7f8f8;
  --canvas: #e8ebed; --panel: #ffffff; --pbody: #ffffff; --ink: #2b2d2f; --muted: #686d72;
  --red: #cd1316; --green: #3f7d12;
  --sans: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: "Cascadia Mono", "Cascadia Code", Consolas, "Courier New", monospace;
  /* names the page code and the pictures use */
  --bg: var(--canvas); --line: var(--k-400); --accent: var(--blue); --accent-ink: #ffffff;
  --bad: #b3141a; --bad-bg: #fcecec; --warn: #855a10; --warn-bg: #fbf3e2;
  --ok: var(--green); --ok-bg: #edf6e6; --field: #ffffff; --off: var(--k-100); --code: var(--k-50);
  --hi: var(--cyan-d); --hi-bg: #e3f5fc; --metal: #c6ccd1; --metal2: #e3e7ea; --zone: #d7ecf7;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { font-size: 15px; }
body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; background: var(--canvas); color: var(--ink);
  font: 0.93rem/1.45 var(--sans); }
.wrap { width: 100%; max-width: 1680px; margin: 0 auto; padding: 0 24px; }
@media (max-width: 640px) { .wrap { padding: 0 16px; } }
svg.logo { display: block; fill: currentColor; }

/* ---- buttons: square, upper case ---- */
button { font: 600 0.76rem/1.2 var(--sans); letter-spacing: 0.06em; text-transform: uppercase; padding: 0.55rem 0.95rem;
  border: 1px solid var(--k-400); background: #ffffff; color: var(--k-900); border-radius: 0; cursor: pointer; white-space: nowrap; }
button:hover { border-color: var(--blue); color: var(--blue); background: var(--blue-t); }
button.primary { background: var(--blue); border-color: var(--blue); color: #ffffff; }
button.primary:hover { background: var(--blue-h); border-color: var(--blue-h); color: #ffffff; }
button.primary:active { background: var(--blue-d); border-color: var(--blue-d); }
button:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--cyan-g); }
button.small { font-size: 0.68rem; padding: 0.28rem 0.6rem; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

/* ---- 1. fixed top bar: logo, step tiles 01-05, job file, Validate ---- */
header.nav { position: sticky; top: 0; z-index: 10; background: var(--bar); border-bottom: 3px solid var(--blue); }
header.nav .wrap { display: flex; flex-wrap: wrap; align-items: center; column-gap: 18px; }
header.nav .brand, header.nav .jobfile, header.nav .actions, header.nav .filemenu { min-height: 60px; display: flex; align-items: center; }
.brand { gap: 14px; white-space: nowrap; color: #ffffff; }
.brand svg.logo { height: 19px; width: auto; }
.brand .prod { border-left: 1px solid var(--barline); padding-left: 14px; display: flex; flex-direction: column; line-height: 1.15; }
.brand .prod b { font-size: 0.8rem; font-weight: 600; color: #ffffff; letter-spacing: 0.04em; }
.brand .prod span { font-size: 0.64rem; color: var(--barmuted); letter-spacing: 0.12em; text-transform: uppercase; }
/* step tiles (the HELLER navigation tiles): dark grey, the open step blue with a cyan foot */
header.nav nav.tabs { display: flex; gap: 4px; align-self: center; margin-left: 10px; overflow-x: auto; }
nav.tabs button { display: flex; flex-direction: column; justify-content: space-between; align-items: flex-start; gap: 2px;
  min-width: 118px; height: 46px; padding: 5px 9px 6px; border: 0; background: var(--tile); color: var(--bartext);
  font-size: 0.66rem; font-weight: 600; letter-spacing: 0.06em; text-align: left; white-space: normal; line-height: 1.1; }
nav.tabs button .no { font: 600 0.7rem var(--mono); letter-spacing: 0; color: #6cc7ee; }
nav.tabs button:hover { background: var(--tile-h); color: #ffffff; }
nav.tabs button.active { background: linear-gradient(180deg, #0d63b5, var(--blue-deep)); color: #ffffff; box-shadow: inset 0 -3px 0 var(--cyan); }
nav.tabs button.active .no { color: #a8e2f8; }
nav.tabs button:focus-visible { box-shadow: 0 0 0 3px var(--cyan-g); outline: none; }
/* the job name takes the free space and is cut (...) before the bar would wrap */
.jobfile { gap: 10px; flex: 1 1 0; min-width: 0; justify-content: flex-end; }
.jobfile > * { flex: none; }
.jobfile .jl { font-size: 0.62rem; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--barmuted); }
#jobLabel { color: #ffffff; font: 600 0.84rem var(--mono); white-space: nowrap; flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.jobfile .dot { font-size: 0.66rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #ff6b6b; white-space: nowrap; }
.jobfile .dot[hidden] { display: none; }
.filemenu { position: relative; }
.filemenu summary { list-style: none; cursor: pointer; color: var(--bartext); border: 1px solid var(--barline); padding: 8px 14px;
  font-weight: 600; font-size: 0.76rem; letter-spacing: 0.06em; text-transform: uppercase; user-select: none; background: transparent; }
.filemenu summary::-webkit-details-marker { display: none; }
.filemenu summary::after { content: " \25BE"; color: var(--barmuted); }
.filemenu summary:hover, .filemenu[open] summary { background: var(--tile); border-color: var(--barmuted); color: #ffffff; }
.filemenu summary:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--cyan-g); }
.filemenu .menu { position: absolute; right: 0; top: calc(100% - 6px); background: var(--panel); border: 1px solid var(--k-400);
  border-top: 3px solid var(--blue); box-shadow: 0 12px 28px rgba(20, 22, 25, 0.25); min-width: 230px; padding: 4px 0; z-index: 20; }
.filemenu .menu button { display: flex; justify-content: space-between; gap: 16px; width: 100%; border: 0; background: none;
  color: var(--ink); font-weight: 500; font-size: 0.86rem; letter-spacing: 0; text-transform: none; padding: 9px 14px; }
.filemenu .menu button:hover, .filemenu .menu button:focus-visible { background: var(--blue-t); color: var(--blue); box-shadow: none; }
.filemenu .menu kbd { font: 0.74rem var(--mono); color: var(--k-600); }
header.nav .actions button { background: transparent; border-color: #2f86c9; color: #8fd8f7; }
header.nav .actions button:hover { background: var(--blue); border-color: var(--blue); color: #ffffff; }
/* the bar's height (set by the page) keeps jumps and focused boxes clear of it */
html { scroll-padding-top: calc(var(--barh, 64px) + 12px); }
/* narrower screens: the product name goes first, then the JOB label; below 1100 px the tiles get their own row */
@media (max-width: 1399px) { .brand .prod { display: none; } nav.tabs button { min-width: 104px; } }
@media (max-width: 1239px) {
  header.nav .wrap { column-gap: 14px; }
  .jobfile .jl { display: none; }
  nav.tabs button { min-width: 92px; }
}
@media (max-width: 1100px) {
  header.nav .brand, header.nav .jobfile, header.nav .actions, header.nav .filemenu { min-height: 50px; }
  header.nav nav.tabs { order: 5; width: 100%; margin: 0 0 8px; }
  nav.tabs button { flex: 1 1 0; min-width: 64px; }
}
@media (max-width: 520px) {
  header.nav .wrap { column-gap: 10px; }
  .brand svg.logo { height: 15px; }
  /* phone: UNSAVED shows as the red dot only */
  .jobfile .dot { font-size: 0; }
  .jobfile .dot::before { content: "\25CF"; font-size: 0.8rem; }
  .filemenu summary, header.nav .actions button { padding: 7px 9px; }
}

/* ---- 2. page head: steel band with a blueprint grid; big step number on a rule, white title ---- */
.phead { background-color: var(--band);
  background-image: linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
                    linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px);
  background-size: 24px 24px; padding: 18px 0 calc(2.25rem + 16px); }
.phead .wrap { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px 30px; }
.phead .wrap > * { min-width: 0; max-width: 100%; }
.phead .stepno { flex: none; }
.phead .stepno .num { font: 300 3.1rem/0.95 var(--sans); color: var(--barmuted); letter-spacing: -0.01em; }
.phead .stepno .eyebrow { margin-top: 4px; padding-top: 4px; border-top: 2px solid var(--barline); }
.eyebrow { color: var(--cyan); font-size: 0.68rem; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; white-space: nowrap; }
.phead h1 { color: #ffffff; font-size: 1.55rem; font-weight: 300; letter-spacing: 0.02em; text-transform: uppercase; margin: 0 0 2px; line-height: 1.15; }
.phead p { color: var(--barmuted); margin: 0; font-size: 0.88rem; }

/* ---- 3. workspace: white panels on the light canvas, overlapping the foot of the head band ---- */
main.wrap { flex: 1; margin-top: -2.25rem; padding-bottom: 32px; }
#msgs:empty { display: none; }
.tab { display: none; }
.tab.active { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 16px; align-items: start; }
.tab.active > * { grid-column: 1 / -1; min-width: 0; }
.tab.active > .panel[data-span="5"] { grid-column: span 5; }
.tab.active > .panel[data-span="7"] { grid-column: span 7; }
@media (max-width: 1180px) { .tab.active > .panel[data-span] { grid-column: 1 / -1; } }
.panel, .card2 { background: var(--panel); border: 1px solid var(--k-300); border-radius: 0;
  box-shadow: 0 1px 2px rgba(20, 22, 25, 0.06), 0 6px 18px rgba(20, 22, 25, 0.06); }
/* panel heading: blue upper case on a grey rule with a short blue lead */
.panel > .ph { position: relative; padding: 13px 16px 10px; border-bottom: 2px solid var(--k-200); }
.panel > .ph::after { content: ""; position: absolute; left: 16px; bottom: -2px; width: 44px; height: 2px; background: var(--blue); }
.panel > .ph h2 { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin: 0; color: var(--blue);
  font-size: 0.92rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; }
.panel > .pb { padding: 14px 16px 16px; background: var(--pbody); }
.panel > .pb > :first-child { margin-top: 0; }
h2 { font-size: 0.98rem; margin: 18px 0 8px; }
h2:first-child { margin-top: 0; }

/* tags */
.pill { display: inline-block; padding: 2px 7px; border-radius: 0; background: var(--blue-t); border: 1px solid var(--blue-b);
  color: var(--blue); font-size: 0.62rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; vertical-align: middle; }

/* fields */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px 16px; }
label.f { display: flex; flex-direction: column; gap: 4px; font-size: 0.66rem; font-weight: 600; letter-spacing: 0.08em;
  text-transform: uppercase; color: var(--k-700); }
label.f .hint, label.f .ferr { text-transform: none; letter-spacing: 0; font-weight: 400; font-size: 0.74rem; }
label.f .hint { color: var(--muted); }
label.f .ferr { color: var(--bad); }
label.f.chk { flex-direction: row; align-items: center; gap: 8px; color: var(--ink); font-size: 0.88rem; font-weight: 500;
  letter-spacing: 0; text-transform: none; }
input, select { font: 0.9rem/1.3 var(--sans); color: var(--ink); background: var(--field); border: 1px solid var(--k-400);
  border-radius: 0; padding: 6px 8px; min-width: 0; text-transform: none; letter-spacing: 0; }
input:hover, select:hover { border-color: var(--k-600); }
input:focus, select:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px var(--cyan-g); }
input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--blue); }
input:disabled, select:disabled { background: var(--k-100); color: var(--k-600); border-color: var(--k-200); }
input.err, select.err { border-color: var(--bad); background: var(--bad-bg); }
.note { color: var(--muted); font-size: 0.82rem; margin: 6px 0 0; }
.box { border: 1px solid var(--k-300); border-left: 3px solid var(--k-400); padding: 12px 14px; margin-top: 12px; background: var(--k-50); }
.grid > label.f.wide { grid-column: span 2; }
@media (max-width: 520px) { .grid > label.f.wide { grid-column: auto; } }

/* machine type toggle + axes readout */
.kintoggle { display: flex; align-items: center; margin: 0 0 12px; }
.kintoggle span { color: var(--k-700); font-size: 0.66rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; margin-right: 12px; }
.kintoggle button { margin: 0; border-color: var(--k-400); background: #ffffff; color: var(--k-800); padding: 7px 14px; }
.kintoggle button:hover { background: var(--k-100); border-color: var(--k-600); color: var(--ink); }
.kintoggle button:last-of-type { border-left: 0; }
.kintoggle button.on, .kintoggle button.on:hover { background: var(--blue); border-color: var(--blue); color: #ffffff; }
.kinaxes { display: flex; flex-direction: column; justify-content: flex-end; gap: 4px; font-size: 0.86rem; }
.kinaxes span { color: var(--k-700); font-size: 0.66rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; }
.kinaxes b { font-weight: 600; color: var(--blue); }

/* tables: blue upper-case heads on a blue rule */
.tblwrap { overflow-x: auto; border: 1px solid var(--k-300); background: var(--panel); }
table.t { border-collapse: collapse; width: 100%; font-size: 0.85rem; }
table.t th, table.t td { border-bottom: 1px solid var(--k-200); padding: 5px 6px; text-align: left; white-space: nowrap; }
table.t tbody tr:last-child td { border-bottom: 0; }
table.t tbody tr:hover td { background: var(--k-50); }
table.t th { background: #ffffff; border-bottom: 2px solid var(--blue); color: var(--blue); font-weight: 600; font-size: 0.64rem;
  letter-spacing: 0.08em; text-transform: uppercase; }
table.t input[type=text] { width: 100%; min-width: 64px; font-family: var(--mono); font-size: 0.82rem; padding: 4px 6px; }
table.t td.c, table.t th.c { text-align: center; }
table.t th input.colall { margin: 3px 0 0; }
table.t td.ro { color: var(--muted); font-family: var(--mono); font-size: 0.82rem; }

/* notices: square, coloured left edge */
.msg { padding: 10px 14px; margin-bottom: 12px; border: 1px solid var(--k-300); border-left-width: 4px; background: var(--panel);
  box-shadow: 0 6px 18px rgba(20, 22, 25, 0.08); }
.msg.bad { background: var(--bad-bg); border-color: #e3a3a4; border-left-color: var(--red); }
.msg.ok { background: var(--ok-bg); border-color: #a9cf8e; border-left-color: var(--green); }
.msg.warn { background: var(--warn-bg); border-color: #e2c48a; border-left-color: #c98a12; }
.msg ul { margin: 6px 0 0; padding-left: 20px; }
.msg a { color: inherit; }
.warnline { margin-top: 6px; font-size: 0.8rem; color: var(--warn); background: var(--warn-bg); border: 1px solid #e2c48a; border-left: 3px solid #c98a12; padding: 5px 8px; }

/* output: file list + NC viewer (dark) */
.out { display: grid; grid-template-columns: minmax(220px, 300px) 1fr; gap: 16px; margin-top: 4px; }
@media (max-width: 760px) { .out { grid-template-columns: 1fr; } }
.flist { list-style: none; margin: 0; padding: 0; border: 1px solid var(--k-300); background: var(--panel); max-height: 70vh; overflow: auto; }
.flist li { padding: 7px 10px; border-bottom: 1px solid var(--k-200); cursor: pointer; display: flex; justify-content: space-between; gap: 8px; font: 0.82rem var(--mono); }
.flist li:hover { background: var(--k-50); }
.flist li.sel { background: var(--blue-t); box-shadow: inset 4px 0 0 var(--blue); color: var(--blue); font-weight: 600; }
.flist .dir { color: var(--muted); font-size: 0.72rem; font-weight: 400; }
.viewer { border: 1px solid var(--k-900); overflow: hidden; display: flex; flex-direction: column; min-width: 0; background: #2f3235; }
.viewer .vh { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 12px; background: var(--k-900); color: #ffffff; }
.viewer .vh b { font: 600 0.85rem var(--mono); }
.viewer .vh button { background: transparent; border-color: var(--k-600); color: #e3e7e9; }
.viewer .vh button:hover { background: var(--blue); border-color: var(--blue); color: #ffffff; }
.viewer pre { margin: 0; padding: 8px 0; background: #2f3235; color: #e9edf0; max-height: 70vh; overflow: auto; font: 0.8rem/1.5 var(--mono); }
.viewer pre span.ln { display: inline-block; width: 4.2em; padding-right: 12px; text-align: right; color: #7f8a93; user-select: none; }

/* dialog */
dialog { border: 1px solid var(--k-400); border-top: 4px solid var(--blue); border-radius: 0; background: var(--panel); color: var(--ink); max-width: 560px;
  width: calc(100% - 32px); padding: 0; box-shadow: 0 16px 48px rgba(20, 22, 25, 0.3); }
dialog::backdrop { background: rgba(20, 22, 25, 0.55); }
dialog h2 { margin: 0; padding: 12px 16px; border-bottom: 1px solid var(--k-200); color: var(--blue); font-weight: 600; font-size: 0.92rem;
  letter-spacing: 0.06em; text-transform: uppercase; }
#dlgBody { padding: 12px 16px; background: #ffffff; }
#dlgBody p { margin: 0 0 8px; }
dialog .btns { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--k-200); background: var(--k-50); }

/* ---- cards (probing, CMC): boxes left, picture and help right ---- */
.card2 { overflow: hidden; scroll-margin-top: 80px; border-top: 3px solid var(--blue); }
.card2.offcard { border-top-color: var(--k-400); }
.card2 > .head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; padding: 11px 16px; border-bottom: 1px solid var(--k-200); }
.card2 > .head b { font-size: 0.92rem; font-weight: 600; color: var(--blue); letter-spacing: 0.05em; text-transform: uppercase; }
.card2.offcard > .head b { color: var(--k-700); }
.card2 > .head span { color: var(--muted); font-size: 0.84rem; }
.card2.offcard > .head { opacity: .75; }
.card2 > .body { display: grid; grid-template-columns: minmax(0, 1fr) 440px; }
@media (max-width: 980px) { .card2 > .body { grid-template-columns: 1fr; } .card2 .pic { order: -1; border-left: none !important; border-bottom: 1px solid var(--k-200); } }
.card2 .form { padding: 14px 16px; min-width: 0; background: #ffffff; }
.grp { margin-bottom: 14px; }
.grp h3, .does h3 { display: flex; align-items: center; gap: 8px; margin: 0 0 8px; color: var(--k-800); font-size: 0.66rem; font-weight: 600;
  letter-spacing: 0.1em; text-transform: uppercase; }
.grp h3::after, .does h3::after { content: ""; flex: 1; height: 1px; background: var(--k-300); }
/* group number: small HELLER-blue square */
.grp h3 .n { display: inline-grid; place-items: center; width: 18px; height: 18px; background: var(--blue); color: #ffffff;
  font: 600 0.68rem var(--mono); letter-spacing: 0; flex: none; }
.grp .row, details.more .row { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px 12px; align-items: start; }
.grp .row .wide, details.more .row .wide { grid-column: 1 / -1; }
label.f.focus { color: var(--cyan-d); }
label.f.focus input, label.f.focus select { border-color: var(--cyan-d); box-shadow: 0 0 0 3px var(--cyan-g); background: #f5fbfe; }
label.f.chk { padding-top: 18px; }
details.more { border: 1px dashed var(--k-400); padding: 8px 10px; margin-top: 4px; background: var(--k-50); }
details.more summary { cursor: pointer; font-weight: 600; font-size: 0.84rem; color: var(--k-900); }
details.more .sum { font-weight: 400; color: var(--muted); margin-left: 6px; }
details.more[open] .row { margin-top: 8px; }
.card2 .pic { border-left: 1px solid var(--k-200); padding: 14px 16px; background: var(--k-50); }
.card2 .views { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.card2 .views.one { grid-template-columns: minmax(0, 300px); justify-content: center; }
.card2 .vt { font-size: 0.66rem; color: var(--k-600); text-align: center; margin-top: 2px; letter-spacing: 0.08em; text-transform: uppercase; }
.card2 .vt.vth { color: var(--cyan-d); font-weight: 600; }
.card2 svg { width: 100%; height: auto; display: block; }
.help { margin-top: 12px; border: 1px solid var(--blue-b); border-left: 3px solid var(--blue); background: var(--blue-t); padding: 8px 10px; }
.help b { color: var(--blue); }
.help p { margin: 4px 0 0; font-size: 0.84rem; }
dl.live { margin: 12px 0 0; display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; font-size: 0.8rem; }
dl.live dt { color: var(--muted); }
dl.live dd { margin: 0; font-family: var(--mono); }
dl.live dd.ok { color: var(--ok); }
dl.live dd.bad { color: var(--bad); font-weight: 600; }
.does { border-top: 1px solid var(--k-200); padding: 12px 16px 14px; background: #ffffff; }
.does ol { margin: 0; padding-left: 20px; font-size: 0.86rem; }
/* step strip: blue tiles, steps that are off grey */
.strip { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; margin: 2px 0; }
.strip .step { border: 0; color: #ffffff; background: linear-gradient(180deg, var(--blue-lt), var(--blue-deep)); padding: 6px 10px;
  font-size: 0.64rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; }
.strip .step:hover { background: var(--blue-h); color: #ffffff; }
.strip .step.off { background: var(--k-200); color: var(--k-600); text-decoration: line-through; }
.strip .arrow { color: var(--k-500); }
.card2 svg .metal { fill: var(--metal); stroke: var(--ink); stroke-width: 1.2; }
.card2 svg .metal2 { fill: var(--metal2); stroke: var(--ink); stroke-width: 1.2; }
.card2 svg .metalhi { stroke: var(--hi); stroke-width: 2.6; }
.card2 svg .cavity { fill: var(--panel); }
.card2 svg .zone { fill: var(--zone); stroke: var(--ink); stroke-width: 1; stroke-dasharray: 4 3; }
.card2 svg .zoneline { fill: none; stroke: var(--ink); stroke-width: 1.2; stroke-dasharray: 4 3; }
.card2 svg .zonehi { stroke: var(--hi); stroke-width: 2.4; }
.card2 svg .line { stroke: var(--ink); stroke-width: 1.4; fill: none; }
.card2 svg .cavity.line { fill: var(--panel); }
.card2 svg .thin { stroke: var(--muted); stroke-width: 1; fill: none; }
.card2 svg .dash { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 5 4; fill: none; }
.card2 svg .hi { stroke: var(--hi); stroke-width: 2.4; fill: none; }
.card2 svg .cavity.hi { fill: var(--panel); }
.card2 svg .dashhi { stroke-dasharray: 6 4; }
.card2 svg .thinhi { stroke-width: 1.2; }
.card2 svg .hifill { fill: var(--hi); }
.card2 svg .acc { stroke: var(--accent); stroke-width: 1.8; fill: none; }
.card2 svg .accfill { fill: var(--accent); }
.card2 svg .probe { fill: var(--panel); stroke: var(--ink); stroke-width: 1.4; }
.card2 svg .probehi { stroke: var(--hi); stroke-width: 2.4; }
.card2 svg .band { fill: var(--accent); opacity: .12; stroke: var(--accent); stroke-dasharray: 3 3; }
.card2 svg .bandhi { fill: var(--hi); opacity: .2; stroke: var(--hi); }
.card2 svg text { fill: var(--ink); font: 11px var(--sans); paint-order: stroke; stroke: var(--k-50); stroke-width: 3px; stroke-linejoin: round; }
.card2 svg text.m { fill: var(--muted); }
.card2 svg text.h { fill: var(--cyan-d); font-weight: 700; }
.card2 svg text.a { fill: var(--accent); font-weight: 600; }

/* ---- 4. footer: dark like the bar, blue corner square, HELLER at the right ---- */

(function (G) {

   and add a row to FW_HISTORY (tests/framework_revNN.sha256 enforces it). */
var FW_REV = '02';
var FW_HISTORY = [
  ['00', '2026-11-11', ['EXCEL/VBA PACKAGE']],
  ['01', '2026-11-12', ['REBUILT AND CHECKED AGAINST THE SINUMERIK ONE',

  ['02', '2026-11-19', ['L_TOOL_MEAS / L_TOOL_BRK: TURNING TOOLS ($TC_DP1',

                        'BLUM TACTILE BL9732']]
];
var MAX_NESTS = 32;
var AXES = ['NONE', 'A', 'B', 'C'];
/* Machine types (tab 1, "Machine type"): the trunnion / table rotary the nest frames and the A0 B0
   line use. nc = the KINEMATICS comment. ready: false = kinematics layout not set up yet (an error
   until it is; use "Axes by hand" meanwhile).
   head / headHome: head machines (5th axis in the head). The head is never in the work offset; the
   probe and CMC programs command it to headHome with the table, and every job program returns with
   the head there (the L_ cycles measure on the laser in that position). Nutating head (45 deg):
   vertical = head B -70..250, B0 spindle vertical, table C; horizontal = head C -250..100, C-180
   spindle horizontal (along Z), table B. Same machine, axis names only differ. */
var MACHINE_TYPES = [
  { key: 'H4_B', label: 'Horizontal 4-axis, B only', ready: true, trunnion: 'NONE', rotary: 'B',
    axes: 'B = rotary (table), no trunnion', nc: '4-AXIS HORIZONTAL: B = ROTARY' },
  { key: 'HF', label: 'Horizontal 5-axis, 5th axis in the table (HF)', ready: true, trunnion: 'A', rotary: 'B',
    axes: 'A = trunnion (table), B = rotary (table)',
    nc: 'HF HORIZONTAL 5-AXIS, 5TH AXIS IN THE TABLE: A = TRUNNION, B = ROTARY' },
  { key: 'F_H_NUT', label: 'Horizontal 5-axis, nutating head (F)', ready: true, trunnion: 'NONE', rotary: 'B',
    head: 'C', headHome: -180, headRange: '-250 TO +100',
    axes: 'C = nutating head (C-180 horizontal), B = table',
    nc: 'F HORIZONTAL 5-AXIS, 45 DEG NUTATING HEAD: C = HEAD (C-180 = SPINDLE ALONG Z), B = TABLE' },
  { key: 'F_H_SWIVEL', label: 'Horizontal 5-axis, swivel head (F)', ready: false },
  { key: 'F_V_NUT', label: 'Vertical 5-axis, nutating head (F)', ready: true, trunnion: 'NONE', rotary: 'C',
    head: 'B', headHome: 0, headRange: '-70 TO +250',
    axes: 'B = nutating head (B0 vertical), C = table',
    nc: 'F VERTICAL 5-AXIS, 45 DEG NUTATING HEAD: B = HEAD (B0 = SPINDLE ALONG Z), C = TABLE' },
  { key: 'F_V_SWIVEL', label: 'Vertical 5-axis, swivel head (F)', ready: false }

function machineType(key) {
  for (var i = 0; i < MACHINE_TYPES.length; i++) if (MACHINE_TYPES[i].key === key) return MACHINE_TYPES[i];
  return null;

function machineFromAxes(trunnion, rotary) {
  for (var i = 0; i < MACHINE_TYPES.length; i++) {

function kinOf(c) {
  if (c.kinStyle === 'AXES') return { style: 'AXES', type: null, trunnion: c.trunnion, rotary: c.rotary };
  var t = machineType(c.machineType);
  if (!t) return { style: 'MACHINE', type: null, trunnion: 'NONE', rotary: 'NONE', problem: 'Choose a machine type' };

      skipZ: false, zAlt: false, zX: '', zY: '', zZ: '', zNom: '0', zTol: '',
      xyMethod: 'SPLIT EXTERIOR', widthX: '', widthY: '', diameter: '', appX: '0', appY: '0',
      probeZ: '', xyTol: '', approachClr: '',

      /* probe ball diameter: only for the checks on the screen, never written to the NC */

           '; FRAMEWORK    : SINUMERIK ONE NEST FRAMEWORK REV ' + FW_REV];
  if (withUnits) b.push('; UNITS        : ' + R.units + ' - RETRACT ' + compact(R.clr, 4) + ' BELOW THE Z SOFTWARE LIMIT');
  b.push(';  REV  DATE        DESCRIPTION');
  FW_HISTORY.forEach(function (h) {
    h[2].forEach(function (d, i) {
      b.push(i === 0 ? ';  ' + h[0] + '   ' + h[1] + '  ' + d : ';                   ' + d);
    });
  });
  b.push(';-------------------------------------------');
  return b;
}
/* insert the block after line 1 (the PROC line where there is one) */
function fw(txt, R, withUnits) {
  var lines = txt.split('\n');
  Array.prototype.splice.apply(lines, [1, 0].concat(fwBlock(R, withUnits)));
  return lines.join('\n');
}
function modeDesc(R) {
  return R.single ? 'SINGLE PART: 1 NEST (G505)'
    : 'TOMBSTONE: ' + R.faces + ' FACES x ' + R.npf + ' NESTS/FACE, ' + R.total + ' NESTS USED';
}
function text(lines) { return lines.join('\n') + '\n'; }
function q(s) { return '"' + s + '"'; }

function fUGUD() {
  return text([
    ';UGUD.DEF',
    ';Global variables that survive power-off.',
    ';Reset the NCK after changing this file.',
    ';',
    'DEF NCK INT GV_STEP                    ;current machining step',
    'DEF NCK INT GV_NEST                    ;current nest',
    'DEF NCK INT GV_NEST_STATUS[33]         ;per-nest status (1-32):',
    '                                       ; 0 = off (operator turned it off)',
    '                                       ; 1 = running',
    '                                       ; 2 = no part (probe found nothing',
    '                                       ;     or out of tolerance)',
    '                                       ; 100+step = tool failed at that step',
    '                                       ;   (e.g. 110 = failed at step 10)',
    'DEF NCK INT GV_WO[33]                  ;work offset frame per nest (1-32)',
    'DEF NCK INT GV_SKIP                    ;1 = every nest is off, skip the step',
    'DEF NCK INT GV_BRK_COUNT               ;tool breaks this step',
    'DEF NCK INT GV_NESTS_CUT               ;nests actually cut this step',
    'DEF NCK INT GV_PROBE_CHK               ;1 = probe health check done this job',
    ';',
    'M30',
    ';'
  ]);
}

function fLoadWO() {

function fToolMeas(R) {
  return text([
    'PROC L_TOOL_MEAS(STRING[25] LD_TNAME)',
    '; PROGRAM      : L_TOOL_MEAS.SPF',
    '; PRG FUNCTION : MEASURE THE SPINDLE TOOL ON THE BLUM LASER',
    '; CONTROL      : SINUMERIK ONE',
    ';-------------------------------------------',
    '; CALLED BY L_RUN_NESTS BEFORE A NEST WHEN THE TOOL',
    '; NEEDS MEASURING. T="NAME" M6 KEEPS / SELECTS THE TOOL',
    '; OF THE SISTER GROUP, THEN BLUM BL9902 MEASURES IT.',
    '; S3750 = SHOP LASER SPEED.',
    ';',
    '; TURNING TOOL ($TC_DP1 500-599): NO SPINDLE START. THE',
    '; TOOL IS ALIGNED LIKE THE POSTED B PROGRAM DOES BEFORE',
    '; TURNING (CYCLE800 TOOL CARRIER TURN_TRAFO, GAMMA 0), THEN',
    '; THE BLUM TACTILE MEASURES L1 + L2 (BL9732 MMODE 0 =',
    '; GEOMETRY), THEN CYCLE800() TAKES THE ALIGNMENT OFF.',
    ';',
    '; THE ;NCG# LINES ARE THE BLUM SCREEN-FORM RECORD OF THE',
    '; BL9902 CALL BELOW. THEY ARE COPIED VERBATIM FROM THE',
    '; ORIGINAL PACKAGE (INCH VALUES). REGENERATE THEM WITH THE',
    '; BLUM SCREEN FORM ON THE CONTROL IF YOUR SETUP DIFFERS.',
    ';',
    '; PARAMETERS:',
    ';   LD_TNAME : TOOL NAME STRING',
    ';-------------------------------------------',
    'DEF INT LV_T                       ;spindle tool T number',
    ';',
    '; CANCEL TRANSFORMATIONS',
    'CYCLE800()',
    'TRAFOOF',
    ';',
    '; SAFE POSITION',
    retract(R.clr),
    ';',
    '; LOAD TOOL BY NAME',
    'T=LD_TNAME',
    'M6',
    'STOPRE',
    'GETEXET(LV_T)',
    TURN_TEST + '_TM_TURN',
    ';',
    '; SPIN FOR THE LASER',
    'S' + LASER_RPM,
    'M3',
    'STOPRE',
    ';',
    '; MEASURE TOOL (BLUM)',
    ';NCG#BL9902#bguilas.com#PRGCODE#*NCG;*RO*;*HD*',
    ';##"0=Measure"##1#1#23#1####0.196850393700787EX-002#0#0#0.393700787401575EX-003#"\\\\"#""#"\\\\"#"png"#"png"#"png"#1###2#0#25.4#0#7#1#0#"BL9902"#"PRGCODE"#*NCG;*RO*;*HD*',
    'BL9902(0,,0,0,0.393700787401575EX-003)',
    ';#END#*NCG;*RO*;*HD*',
    ';',
    'STOPRE',
    ';',
    '; SAFE RETRACT AFTER MEASUREMENT',
    retract(R.clr),
    'GOTOF _TM_END',
    ';',
    '; TURNING TOOL: ALIGN, BLUM TACTILE L1 + L2, ALIGNMENT OFF',
    '_TM_TURN:',
    'D1',
    TURN_ALIGN,
    'BL9732(0)',
    'STOPRE',
    retract(R.clr),
    'CYCLE800()',
    ';',
    '_TM_END:',
    '; CLEAR THE PIECE-COUNT LIST (NO DECREMENT)',
    'SETPIECE(0)',
    ';',
    'RET',
    ';'
  ]);
}
function fToolBrk(R) {
  return text([
    'PROC L_TOOL_BRK(STRING[25] LD_TNAME, REAL LD_BRK_TOL)',
    '; PROGRAM      : L_TOOL_BRK.SPF',
    '; PRG FUNCTION : TOOL BREAKAGE CHECK ON THE BLUM LASER',
    '; CONTROL      : SINUMERIK ONE',
    ';-------------------------------------------',
    '; CHECKS THE TOOL AFTER EACH NEST CUT WITH THE MODIFIED',
    '; BLUM MACRO BL9908_MOD, WHICH RETURNS AN ERROR CODE IN',
    '; LV_EC INSTEAD OF ALARMING.',
    ';',
    '; ON BREAKAGE (LV_EC = 19.19):',
    ';   GV_NEST_STATUS[GV_NEST] = GV_STEP + 100',
    ';   (+100 KEEPS IT CLEAR OF 0/1/2, E.G. 110 = STEP 10).',
    ';   THE NEST IS OFF FOR THE REST OF THE JOB. RETURNS',
    ';   WITHOUT ALARM; L_RUN_NESTS SWAPS TO A SISTER.',
    '; ON OK: SETPIECE(0) CLEARS THE PIECE-COUNT LIST SO THE',
    ';   CALLER\'S SETPIECE COUNTS ONLY THE SPINDLE TOOL.',
    ';',
    '; S3750 = SHOP LASER SPEED. M5/M9 HANDLED HERE.',
    ';',
    '; TURNING TOOL ($TC_DP1 500-599): NO SPINDLE START. ALIGNED',
    '; LIKE THE POSTED B PROGRAM (TURN_TRAFO, GAMMA 0), THEN THE',
    '; BLUM TACTILE CHECKS L1 + L2 AGAINST LD_BRK_TOL (BL9732',
    '; MMODE 2). A BROKEN TURNING TOOL STOPS THE MACHINE WITH THE',
    '; BLUM ERROR (BL9732 HAS NO RETURN CODE LIKE BL9908_MOD).',
    ';',
    '; PARAMETERS:',
    ';   LD_TNAME   : TOOL NAME (FOR THE MESSAGE)',
    ';   LD_BRK_TOL : BREAKAGE TOLERANCE (' + R.U.u.toUpperCase() + ')',
    ';',
    '; PREREQUISITE: BL9908_MOD.SPF INSTALLED ON THE CONTROL',
    ';-------------------------------------------',
    ';',
    'DEF REAL LV_EC                     ;BLUM ERROR CODE',
    'DEF INT LV_T                       ;spindle tool T number',
    ';',
    'LV_EC=0',
    ';',
    '; CANCEL TRANSFORMATIONS',
    'CYCLE800()',
    'TRAFOOF',
    'D0',
    ';',
    '; SAFE POSITION FOR LASER',
    retract(R.clr),
    ';',
    '; STOP SPINDLE AND COOLANT',
    'M5',
    'M9',
    'STOPRE',
    'GETEXET(LV_T)',
    TURN_TEST + '_TB_TURN',
    ';',
    '; SPIN TOOL FOR LASER CHECK',
    'D1',
    'S' + LASER_RPM + ' M3',
    ';',
    'BL9908_MOD(0,-1,LD_BRK_TOL,0,LV_EC)',
    'STOPRE',
    'IF (LV_EC==19.19)',
    '  GV_NEST_STATUS[GV_NEST]=GV_STEP+100',
    '  STOPRE',
    '  M5',
    '  MSG("BROKEN: " << LD_TNAME << " NEST " << GV_NEST << " STEP " << GV_STEP)',
    '  D1',
    'ELSE',
    '  SETPIECE(0)',
    '  M5',
    '  D1',
    'ENDIF',
    'GOTOF _TB_END',
    ';',
    '; TURNING TOOL: ALIGN, BLUM TACTILE CHECK, ALIGNMENT OFF',
    '_TB_TURN:',
    'D1',
    TURN_ALIGN,
    'BL9732(2,LD_BRK_TOL,LD_BRK_TOL)',
    'STOPRE',
    retract(R.clr),
    'CYCLE800()',
    'SETPIECE(0)',
    'D1',
    ';',
    '_TB_END:',
    'STOPRE',
    'RET',
    ';'
  ]);
}
function fRunNests() {
  return text([
    'PROC L_RUN_NESTS(STRING[25] LD_TNAME, REAL LD_BRK_TOL, INT LD_TOTAL, STRING[32] LD_PROG, INT LD_MEAS, INT LD_ALWAYS, INT LD_USEBRK, INT LD_MAXBRK, INT LD_DEBUG, INT LD_LIFE, INT LD_USESP)',
    'DEF INT LV_TNO                    ;spindle tool T number (GETEXET)',
    ';L_RUN_NESTS.SPF',
    ';Runs one machining step across all its nests.',
    ';GV_NEST is set by the caller: 1 on a fresh run, or the nest',
    ';that was running when the job stopped (restart). Loops from',
    ';there to LD_TOTAL.',
    ';',
    ';NEW TOOL (top of each running nest): GETEXET reads the tool in',
    ';the spindle ($P_TOOLNO is not reliable with magazine management,',
    ';SV). If it is disabled ($TC_TP8 bit 2, set when a break is found)',
    ';or its piece count is used up ($TC_MOP13>0 and $TC_MOP4<=0),',
    ';T/M6 by name brings in a sister.',
    ';MEASURE: LD_ALWAYS=1 measures before every nest. LD_ALWAYS=0',
    ';measures only while $TC_TP8 bit 7 (tool was in use) is 0.',
    ';STOPRE after the cut: the nest is finished before anything is',
    ';counted or GV_NEST moves on, so a restart never skips a half-cut',
    ';nest.',
    ';Results come back in GV_NESTS_CUT and GV_BRK_COUNT.',
    ';',
    ';  LD_TNAME   - tool name',
    ';  LD_BRK_TOL - break tolerance',
    ';  LD_TOTAL   - nest count',
    ';  LD_PROG    - B_ program (called per nest)',
    ';  LD_MEAS    - 1 = measuring on (laser)',
    ';  LD_ALWAYS  - 1 = always measure, 0 = smart (bit 7)',
    ';  LD_USEBRK  - 1 = break check after each nest',
    ';  LD_MAXBRK  - breaks this step before a hard stop',
    ';  LD_DEBUG   - 1 = M1 optional stop between nests',
    ';  LD_LIFE    - pieces to count per good nest (SETPIECE)',
    ';  LD_USESP   - 1 = SETPIECE on',
    ';',
    'GV_BRK_COUNT=0',
    'GV_NESTS_CUT=0',
    ';',
    '_RN_LOOP:',
    'IF (GV_NEST_STATUS[GV_NEST]==1)',
    '  GETEXET(LV_TNO)',
    '  ;--- new tool needed? (disabled by breakage, or used up) ---',
    '  IF (($TC_TP8[LV_TNO] B_AND 4)>0) OR (($TC_MOP13[LV_TNO,1]>0) AND ($TC_MOP4[LV_TNO,1]<=0))',
    '    T=LD_TNAME',
    '    M6',
    '    STOPRE',
    '    GETEXET(LV_TNO)',
    '  ENDIF',
    '  ;--- measure the tool in the spindle ---',
    '  IF (LD_MEAS==1)',
    '    IF (LD_ALWAYS==1)',
    '      L_TOOL_MEAS(LD_TNAME)',
    '    ELSE',
    '      IF (($TC_TP8[LV_TNO] B_AND 128)==0)',
    '        L_TOOL_MEAS(LD_TNAME)',
    '      ENDIF',
    '    ENDIF',
    '  ENDIF',
    '  C_P1_LOAD_WO',
    '  CALL LD_PROG',
    '  STOPRE',
    '  IF (LD_USEBRK==1)',
    '    L_TOOL_BRK(LD_TNAME,LD_BRK_TOL)',
    '    IF (GV_NEST_STATUS[GV_NEST]<>1)',
    '      GV_BRK_COUNT=GV_BRK_COUNT+1',
    '    ELSE',
    '      GV_NESTS_CUT=GV_NESTS_CUT+1',
    '      IF (LD_USESP==1)',
    '        SETPIECE(LD_LIFE)',
    '      ENDIF',
    '    ENDIF',
    '  ELSE',
    '    GV_NESTS_CUT=GV_NESTS_CUT+1',
    '    IF (LD_USESP==1)',
    '      SETPIECE(LD_LIFE)',
    '    ENDIF',
    '  ENDIF',
    'ENDIF',
    ';--- too many breaks? (jump kept outside the IF blocks, NC 4.1.7) ---',
    'IF (GV_BRK_COUNT>0) AND (GV_BRK_COUNT>=LD_MAXBRK) GOTOF _RN_MAXBRK',
    'IF (LD_DEBUG==1)',
    '  M1',
    'ENDIF',
    'GV_NEST=GV_NEST+1',
    'IF (GV_NEST<=LD_TOTAL) GOTOB _RN_LOOP',
    'RET',
    ';',
    ';--- too many breaks this step: park and hold until reset ---',
    ';A restart resumes at GV_STEP / GV_NEST; broken nests stay off.',
    '_RN_MAXBRK:',
    'C_P1_HOME',
    'LOOP',
    '  MSG("MAX BREAKAGE: " << GV_BRK_COUNT << " AT STEP " << GV_STEP << " - CHECK SETUP")',
    '  M0',
    '  STOPRE',
    'ENDLOOP',
    'RET',
    ';'
  ]);
}
function fBTemplate(R) {
  var hh = headHome(R);
  var o = [
    '; PROGRAM      : B_TEMPLATE.SPF',
    '; PRG FUNCTION : CAM STUB - REFERENCE FOR THE CAM POST',
    '; PART NUMBER  : ' + (R.header.part || 'XXXX'),
    '; MATERIAL     : ' + (R.header.material || 'XXXX'),
    '; MACHINE      : ' + (R.header.machine || 'XXXX'),
    '; CONTROL      : SINUMERIK ONE',
    ';===========================================',
    '; THIS IS A STUB. THE REAL B_ PROGRAMS COME FROM CAM.',
    '; IT HAS NO MOTION. RULES FOR EVERY B_ CUTTING PROGRAM:',
    ';  1. CUTS ONE NEST PER CALL (L_RUN_NESTS CALLS IT PER NEST',
    ';     WITH CALL LD_PROG; NO PARAMETERS)',
    ';  2. RUNS IN G54 (C_P1_LOAD_WO COPIES THE NEST WO INTO G54',
    ';     JUST BEFORE THE CALL)',
    ';  3. NO T / M6 (L_TOOL_LOAD AND L_RUN_NESTS LOAD THE TOOL',
    ';     AND ITS SISTERS)',
    hh ? ';  4. ORIENTS PER FACE WITH CYCLE800(...) FROM CAM (HEAD)' : ';  4. ORIENTS PER FACE WITH CYCLE800(0,"H",...) FROM CAM',
    ';  5. STARTS SPINDLE AND COOLANT (M3 Sxxxx, M8)',
    ';  6. ENDS WITH THE BLOCK BELOW: STOP, G97 (NO G96 LEFT ON AFTER',
    ';     TURNING), CANCEL SWIVEL /'
  ];
  if (hh) o.push(';     HIGH-SPEED SETTINGS / TRANSFORMATION, SAFE Z,',
                 ';     HEAD HOME ' + headWord(R) + ' (THE LASER IN L_TOOL_MEAS /',
                 ';     L_TOOL_BRK MEASURES THERE), RET');
  else o.push(';     HIGH-SPEED SETTINGS / TRANSFORMATION, SAFE Z, RET');
  o.push(';===========================================', ';', 'G54 D1', ';', ';--- CAM TOOLPATH GOES HERE ---', ';',
         ';--- PROGRAM END (KEEP) ---', 'M5', 'M9', 'G97', 'CYCLE800()', 'CYCLE832()', 'TRAFOOF', retract(R.clr));
  if (hh) o.push(hh);
  o.push('RET', ';');
  return text(o);
}

function fWO(R) {
  var o = [], len = function (v) { return fix(v, R.U.dec); };
  hdr(o, R, 'C_P1_WO.SPF', R.single ? 'WRITE THE WORK OFFSET FOR THE SINGLE PART' : 'WRITE WORK OFFSET VALUES FOR ALL NESTS', [
    '; PALLET       : 1',
    '; MODE         : ' + modeDesc(R),
    '; KINEMATICS   : ' + kinDesc(R),
    '; UNITS        : ' + R.U.label + ' - MUST MATCH THE BASIC SYSTEM MD10240'
  ]);
  rev(o, R);
  o.push(';');
  o.push(';-------------------');

  o.push('DEF INT LV_NOW, LV_T');
  o.push('LD_CHG=0');
  o.push('STOPRE');
  o.push('GETEXET(LV_NOW)');
  o.push('IF (LV_NOW==LD_TNO) GOTOF _CB_END');
  o.push('CYCLE800()');
  o.push('TRAFOOF');
  o.push(retract(R.clr));
  o.push('IF (LD_MODE==1) GOTOF _CB_TM6');
  o.push('LV_T=GETT(LD_TNAME,LD_DUPLO)');
  o.push('IF (LV_T<>LD_TNO) GOTOF _CB_TM6');
  o.push('IF (($TC_TP8[LV_T] B_AND 4)>0) GOTOF _CB_TM6');
  o.push('TCA(LD_TNAME,LD_DUPLO,' + R.cmcCarrier + ')');
  o.push('STOPRE');
  o.push('GOTOF _CB_CHECK');
  o.push('_CB_TM6:');
  o.push('T=LD_TNAME');
  o.push('M6');
  o.push('STOPRE');
  o.push('_CB_CHECK:');
  o.push('GETEXET(LV_NOW)');
  o.push('IF (LV_NOW<>LD_TNO)');
  o.push('  LD_CHG=1');
  o.push('ENDIF');
  o.push('_CB_END:');
  o.push('RET');
  o.push(';');
  return text(o);
}
function fCmcLog(R) {

  hdr(o, R, 'C_P1_CMC_LOG.SPF', 'CMC - ONE LINE INTO CMC_LOG.SPF', []);
  rev(o, R);
  o.push(';');
  o.push(';  WRITES "DATE,TIME," + LD_LINE INTO CMC_LOG.SPF IN THE DIRECTORY OF');
  o.push(';  THE SELECTED PROGRAM (NC 4.5.1 WRITE), LIKE L_DATA_LOG.');
  o.push(';  MEASUREMENT LINE:');
  o.push(';   DATE,TIME,STEP,NEST,FEATURE,TOOL,SISTER,T,EDGE,NOMINAL,EXPECTED,');
  o.push(';   MEASURED,MEASURED_Y,DEVIATION,WEAR_USED,WEAR_NEXT,PASS,RECUTS,RESULT');
  o.push(';   (MEASURED_Y FOR RECTANGLES ONLY; WEAR = CMC WEAR ON TOP OF THE WEAR');
  o.push(';   FOUND ON THE EDGE)');
  o.push(';   RESULT: CUT, RECUT, OK, OUT, SCRAP, HOLD, TOUCH, SISTER');
  o.push(';  STEP LINE: DATE,TIME,STEP,SUMMARY,OK=n,OUT=n,SCRAP=n');
  o.push(';-------------------------------------------');
  o.push('DEF INT LV_ERR');
  o.push('DEF STRING[2] LV_MO, LV_DY, LV_HH, LV_MM, LV_SS');
  [['$A_MONTH', 'LV_MO'], ['$A_DAY', 'LV_DY'], ['$A_HOUR', 'LV_HH'], ['$A_MINUTE', 'LV_MM'], ['$A_SECOND', 'LV_SS']].forEach(function (p) {
    o.push('IF (' + p[0] + '<10)');
    o.push('  ' + p[1] + '="0"<<' + p[0]);
    o.push('ELSE');
    o.push('  ' + p[1] + '=""<<' + p[0]);
    o.push('ENDIF');
  });
  o.push('WRITE(LV_ERR,"CMC_LOG_SPF","" << $A_YEAR << "-" << LV_MO << "-" << LV_DY << "," << LV_HH << ":" << LV_MM << ":" << LV_SS << "," << LD_LINE)');
  o.push('IF (LV_ERR<>0)');
  o.push('  MSG("CMC LOG WRITE ERROR: " << LV_ERR)');
  o.push('ENDIF');
  o.push('RET');
  o.push(';');
  return text(o);
}
function fCmcClear(R) {
  var o = [];
  hdr(o, R, 'C_P1_CMC_CLEAR.SPF', 'CMC - WEAR LEFT BY A STOPPED CUT PUT BACK, R BLOCKS CLEARED', [
    '; PART NUMBER  : ' + (R.header.part || 'XXXX')
  ]);
  rev(o, R);
  o.push(';');
  o.push(';  A_P1 RUNS THIS ON A FRESH START (GV_STEP==0). RUN IT BY HAND WHEN A');
  o.push(';  JOB IS ABANDONED PART-WAY THROUGH A CMC STEP, BEFORE ANOTHER JOB');
  o.push(';  USES THE CUTTER. CMC WEAR IS ONLY ON THE CUTTER WHILE THE PASS IS');
  o.push(';  1 (FIRST CUT) OR 4 (FINAL CUT); THE WEAR FOUND BEFORE IS PUT BACK.');
  o.push(';  GETT CHECKS THE RECORDED SISTER STILL HAS THE RECORDED T NUMBER.');
  o.push(';-------------------------------------------');
  o.push('DEF INT LV_T, LV_D, LV_DUP, LV_I');
  R.cmcList.forEach(function (s) {
    var b = s.cmcBase, c = s.cmc;
    o.push(';--- STEP ' + s.step + ': R' + b + '-R' + (b + CMC_BLOCK - 1) + ', ' + s.tool + ' D' + c.edge + ' $TC_' + c.field + ' ---');
    o.push('IF ((R' + b + '==1) OR (R' + b + '==4)) AND (R' + (b + 2) + '>0)');
    o.push('  LV_DUP=R' + (b + 3));
    o.push('  LV_T=GETT(' + q(s.tool) + ',LV_DUP)');
    o.push('  IF (LV_T==R' + (b + 2) + ')');
    o.push('    LV_D=' + c.edge);
    o.push('    $TC_' + c.field + '[LV_T,LV_D]=R' + (b + 43));
    o.push('  ENDIF');
    o.push('ENDIF');
    o.push('LV_I=' + b);
    o.push('WHILE (LV_I<=' + (b + CMC_BLOCK - 1) + ')');
    o.push('  R[LV_I]=0');
    o.push('  LV_I=LV_I+1');
    o.push('ENDWHILE');
  });
  o.push('STOPRE');
  o.push('RET');
  o.push(';');
  return text(o);
}
/* A_P1 after a CMC step: scrap nests off (status 3), count the nests still running, one log line */
function cmcAfter(o, R, s) {
  var b = s.cmcBase, N = R.total;
  o.push(';--- CMC RESULTS R' + (b + 10) + '-R' + (b + 9 + N) + ': SCRAP NESTS OFF FOR THE LATER STEPS (STATUS ' + CMC_SCRAP_STATUS + ') ---');
  o.push(';--- A NEST BROKEN IN THIS STEP KEEPS ITS TOOL-FAILURE STATUS              ---');
  o.push('LV_CMC_OK=0 LV_CMC_OUT=0 LV_CMC_SCRAP=0');
  o.push('LV_I=1');
  o.push('WHILE (LV_I<=' + N + ')');
  o.push('  IF (R[' + (b + 9) + '+LV_I]==' + CMC_RES.SCRAP + ')');
  o.push('    LV_CMC_SCRAP=LV_CMC_SCRAP+1');
  o.push('    IF (GV_NEST_STATUS[LV_I]==1)');
  o.push('      GV_NEST_STATUS[LV_I]=' + CMC_SCRAP_STATUS);
  o.push('    ENDIF');
  o.push('  ENDIF');
  o.push('  IF (GV_NEST_STATUS[LV_I]==1)');
  o.push('    IF (R[' + (b + 9) + '+LV_I]==' + CMC_RES.OK + ')');
  o.push('      LV_CMC_OK=LV_CMC_OK+1');
  o.push('    ENDIF');
  o.push('    IF (R[' + (b + 9) + '+LV_I]==' + CMC_RES.OUT + ')');
  o.push('      LV_CMC_OUT=LV_CMC_OUT+1');
  o.push('    ENDIF');
  o.push('  ENDIF');
  o.push('  LV_I=LV_I+1');
  o.push('ENDWHILE');
  o.push('LV_CMC_L="' + s.step + ',SUMMARY,OK=" << LV_CMC_OK << ",OUT=" << LV_CMC_OUT << ",SCRAP=" << LV_CMC_SCRAP');
  o.push('C_P1_CMC_LOG(LV_CMC_L)');
}

/* ---- main program ---- */
function aBound(o, R) {
  o.push('IF (GV_NEST<1) OR (GV_NEST>' + R.total + ')');
  o.push('  GV_NEST=1');
  o.push('ENDIF');
}
function aStepStart(o) { o.push('LV_STEP_START=$A_HOUR*3600+$A_MINUTE*60+$A_SECOND'); }
function fMain(R) {
  var o = [], N = R.total, U = R.U, cmc = R.cmcList.length > 0;
  o.push('; PROGRAM      : A_P1.MPF');
  o.push('; PRG FUNCTION : MAIN PROGRAM - RUNS EVERY STEP ACROSS EVERY NEST');

  o.push('; MATERIAL     : ' + (R.header.material || 'XXXX'));
  o.push('; STOCK        : ' + (R.header.stock || 'XXXX'));
  o.push('; MACHINE      : ' + (R.header.machine || 'XXXX'));
  o.push('; CONTROL      : SINUMERIK ONE');
  o.push('; PROGRAMMER   : ' + (R.header.programmer || 'XXXX'));
  o.push('; DATE CREATED : ' + R.date);
  o.push('; PALLET       : 1');

  o.push('; KINEMATICS   : ' + kinDesc(R));

  o.push(fwNeeds());
  rev(o, R);
  o.push(';');
  o.push(';-------------------');
  o.push('; GLOBAL VARIABLES (UGUD.DEF)');
  o.push(';-------------------');
  o.push(';GV_STEP           - CURRENT STEP (0 = FRESH PALLET)');
  o.push(';GV_NEST           - CURRENT NEST');
  o.push(';GV_NEST_STATUS[#] - 0 OFF, 1 RUNNING, 2 NO PART, 100+STEP FAILED');
  if (cmc) o.push(';                    ' + CMC_SCRAP_STATUS + ' CMC SCRAP (SET BY A_P1 AFTER THE CMC STEP)');
  o.push(';GV_WO[#]          - WO FRAME PER NEST');
  o.push(';GV_SKIP           - 1 = EVERY NEST OFF, SKIP THE STEP');
  o.push(';GV_BRK_COUNT      - BREAKS THIS STEP');
  o.push(';GV_NESTS_CUT      - NESTS CUT THIS STEP');
  o.push(';GV_PROBE_CHK      - 1 = PROBE HEALTH CHECK DONE THIS JOB');
  o.push(';-----------------');
  o.push('; LOCAL VARIABLES (DEFINITIONS FIRST, NC 4.1.1.4)');
  o.push(';-----------------');
  o.push('DEF INT LV_GOOD_PARTS              ;GOOD PART COUNT AT END');
  o.push('DEF INT LV_I                       ;LOOP COUNTER');
  o.push('DEF REAL LV_CYCLE_START            ;CYCLE START TIME (SECONDS)');
  o.push('DEF REAL LV_STEP_START             ;STEP START TIME (SECONDS)');
  o.push('DEF REAL LV_CYCLE_TIME             ;CYCLE TIME (SECONDS)');
  if (cmc) {
    o.push('DEF INT LV_CMC_OK                  ;CMC NESTS OK THIS STEP');
    o.push('DEF INT LV_CMC_OUT                 ;CMC NESTS OUT OF TOLERANCE, ACCEPTED');
    o.push('DEF INT LV_CMC_SCRAP               ;CMC NESTS SCRAP');
    o.push('DEF STRING[180] LV_CMC_L           ;CMC LOG LINE');
    o.push('EXTERN C_P1_CMC_LOG(STRING[180])   ;WKS SUB-PROGRAM WITH A PARAMETER (NC 4.2.3.2)');
  }
  o.push(';----------------');
  o.push('; SUB PROGRAMS');
  o.push(';----------------');
  o.push(';C_P1_WO       - WRITE WO FOR ALL NESTS (FRESH START ONLY)');
  o.push(';C_P1_NESTS    - SET NEST STATUS (FRESH START ONLY)');
  o.push(';C_P1_LOAD_WO  - LOAD G54 WITH THE CURRENT NEST WO');
  o.push(';C_P1_HOME     - SAFE Z AT THE TOP OF TRAVEL');
  if (R.probeStep.enabled) o.push(';' + pad(R.probeStep.program, 14) + '- PROBE ONE NEST');
  R.cmcList.forEach(function (s) {
    o.push(';' + pad(cmcName(s.step), 14) + '- CMC STEP ' + s.step + ': CUT / MEASURE / CUT ONE NEST (R' + s.cmcBase + '-R' + (s.cmcBase + CMC_BLOCK - 1) + ')');
    o.push(';' + pad(cmcName(s.step) + '_M', 14) + '- CMC STEP ' + s.step + ': MEASURE ONLY');
  });
  if (cmc) {
    o.push(';C_P1_CMC_BACK - CMC: RECORDED CUTTER BACK IN THE SPINDLE');
    o.push(';C_P1_CMC_LOG  - CMC: ONE LINE INTO CMC_LOG.SPF');
    o.push(';C_P1_CMC_CLEAR - CMC: WEAR A STOPPED CUT LEFT PUT BACK, R BLOCKS CLEARED');
  }
  o.push(';L_PAL_CHECK   - CHECK PALLET NUMBER (CYCLE DIR)');
  o.push(';L_SKIP_CHECK  - SKIP A STEP IF EVERY NEST IS OFF');
  o.push(';L_TOOL_LOAD   - LOAD THE STEP TOOL BY NAME');
  o.push(';L_RUN_NESTS   - RUN ONE STEP ACROSS EVERY NEST');
  o.push(';L_TOOL_MEAS   - BLUM LASER TOOL MEASURE');
  o.push(';L_TOOL_BRK    - BLUM LASER BREAKAGE CHECK');
  o.push(';L_STEP_LOG    - STEP TIME + DATA LOGGING');
  o.push(';L_DATA_LOG    - PRODUCTION DATA LOG LINE');
  o.push(';L_STEP_ERROR  - HOLD IF GV_STEP IS UNKNOWN');
  o.push(';');
  o.push('GROUP_BEGIN(0,"SETUP",0,0)');
  o.push(pad(U.g, 35) + ';' + (R.units === 'INCH' ? 'INCH' : 'METRIC') + ' - SAME AS THE BASIC SYSTEM');
  o.push(';=== ' + modeDesc(R) + ' ===');
  o.push(';--------------------');
  o.push(';  PALLET & WCS SETUP');
  o.push(';--------------------');
  o.push('L_PAL_CHECK(1)');
  o.push('C_P1_WO');
  o.push('C_P1_NESTS');
  if (cmc) {
    o.push('IF (GV_STEP==0)');
    o.push('  C_P1_CMC_CLEAR                   ;CMC: wear a stopped cut left put back, R blocks cleared');
    o.push('ENDIF');
  }
  if (!R.single) {
    o.push(';--------------------');
    o.push(';  TURN OFF A NEST');
    o.push(';--------------------');
    o.push('; Delete the ; in front of a nest below to skip');
    o.push('; it this run (no probing, no machining).');
    o.push(';--------------------');
    for (var n = 1; n <= N; n++) o.push(';GV_NEST_STATUS[' + n + ']=0');
  }
  o.push('STOPRE');
  o.push(';--------------------');
  o.push(';   HOME POSITION');
  o.push(';--------------------');
  o.push('C_P1_HOME');
  o.push('GROUP_END(0,0)');
  o.push('GROUP_BEGIN(0,"STEP LIST",0,0)');
  o.push(';=====================');
  o.push(';     STEP LIST');
  o.push(';=====================');
  if (R.probeStep.enabled) {
    o.push(';STEP ' + R.probeStep.step + ': PROBE');
    o.push(';   PROG: ' + R.probeStep.program);
    o.push(';   TOOL: ' + R.P.tool);
    o.push(';');
  }
  R.steps.forEach(function (s) {
    o.push(';STEP ' + s.step + ':');
    o.push(';   PROG: ' + s.program);
    o.push(';   TOOL: ' + s.tool);
    o.push(';   MEAS=' + (s.meas ? (s.measAlways ? 'ALWAYS' : 'SMART') : 'OFF') + ' BRK=' + (s.brk ? 'ON TOL ' + fix(s.brkTol, U.dec) + ' MAX ' + s.maxBrk : 'OFF') +
           ' SETPIECE=' + (s.setpiece ? s.life : 'OFF') + (s.debug ? ' DEBUG M1' : ''));
    if (s.cmc) {
      o.push(';   CMC: ' + s.cmc.feature + ' ' + cmcNum(s.cmc.nom, R) + ' +' + cmcNum(s.cmc.tolP, R) + '/-' + cmcNum(s.cmc.tolM, R) +
             ', ' + cmcName(s.step) + ', R' + s.cmcBase + '-R' + (s.cmcBase + CMC_BLOCK - 1));
    }
    o.push(';');
  });
  o.push('GROUP_END(0,0)');
  o.push(';--------------------');
  o.push(';      RE-START');
  o.push(';--------------------');
  o.push(';GV_STEP<>0 MEANS THE LAST RUN DID NOT FINISH: THE JOB');
  o.push(';RESUMES AT THAT STEP AND NEST. A FRESH SISTER TOOL IS');
  o.push(';MEASURED AUTOMATICALLY.');
  o.push('LV_CYCLE_START=$A_HOUR*3600+$A_MINUTE*60+$A_SECOND');

  o.push('  M0');
  o.push('  STOPRE');
  o.push('ENDIF');
  if (R.probeStep.enabled) o.push('IF (GV_STEP==' + R.probeStep.step + ') GOTOF STEP' + R.probeStep.step);
  R.steps.forEach(function (s) { o.push('IF (GV_STEP==' + s.step + ') GOTOF STEP' + s.step); });
  o.push('L_STEP_ERROR');
  if (R.probeStep.enabled) {
    if (R.single) singleProbeStep(o, R); else probeStep(o, R);
  }
  R.steps.forEach(function (s) { cutStep(o, R, s); });
  if (R.single) singleEnd(o, R); else tombEnd(o, R);
  return text(o);
}
function stepBanner(o, s, l2, l3) {
  o.push(';================================');
  o.push(';          STEP ' + s);
  o.push(';        ' + l2);
  if (l3) o.push(';        ' + l3);
  o.push(';================================');
}
function probeStep(o, R) {
  var s = R.probeStep.step, N = R.total;
  stepBanner(o, s, 'PROBE ALL NESTS', R.probeStep.program);
  o.push('GV_STEP=' + s);
  o.push('STEP' + s + ':');
  o.push('MSG("STEP ' + s + ' / ' + R.lastStep + ' - PROBE")');
  aStepStart(o);
  o.push(';--- resume at the nest that was running, or start at 1 ---');
  aBound(o, R);
  o.push('STEP' + s + '_NEST:');
  o.push('IF (GV_NEST_STATUS[GV_NEST]==1)');
  o.push('  C_P1_LOAD_WO');
  o.push('  ' + R.probeStep.program);
  o.push('  STOPRE');
  o.push('ENDIF');
  o.push('GV_NEST=GV_NEST+1');
  o.push('IF (GV_NEST<=' + N + ') GOTOB STEP' + s + '_NEST');
  o.push(';---- STEP ' + s + ' END ----');
  o.push('L_STEP_LOG(' + s + ',' + q('PROBE') + ',0,0,LV_STEP_START)');
  o.push('STOPRE');
}
function singleProbeStep(o, R) {
  var s = R.probeStep.step;
  stepBanner(o, s, 'PROBE PART', R.probeStep.program);
  o.push('GV_STEP=' + s);
  o.push('STEP' + s + ':');
  o.push('MSG("STEP ' + s + ' / ' + R.lastStep + ' - PROBE")');
  aStepStart(o);
  o.push('GV_NEST=1');
  o.push('IF (GV_NEST_STATUS[1]==1)');
  o.push('  C_P1_LOAD_WO');
  o.push('  ' + R.probeStep.program);
  o.push('  STOPRE');
  o.push('ENDIF');
  o.push(';--- single part: no part or out of tolerance = hold ---');
  o.push('IF (GV_NEST_STATUS[1]<>1)');
  o.push('  C_P1_HOME');
  o.push('  LOOP');
  o.push('    MSG("NO PART, OUT OF TOLERANCE OR NEST OFF AT STEP ' + s + '")');
  o.push('    M0');
  o.push('    STOPRE');
  o.push('  ENDLOOP');
  o.push('ENDIF');
  o.push(';---- STEP ' + s + ' END ----');
  o.push('L_STEP_LOG(' + s + ',' + q('PROBE') + ',0,0,LV_STEP_START)');
  o.push('STOPRE');
}
function cutStep(o, R, s) {
  var U = R.U, N = R.total;
  stepBanner(o, s.step, q(s.tool), s.program);
  o.push('GV_STEP=' + s.step);
  o.push('STEP' + s.step + ':');
  o.push(';--- resume at the nest that was running, or start at 1 ---');
  aBound(o, R);
  o.push('MSG("STEP ' + s.step + ' / ' + R.lastStep + ' - ' + s.tool + '")');
  o.push('GV_NESTS_CUT=0 GV_BRK_COUNT=0');
  aStepStart(o);
  o.push('L_SKIP_CHECK(' + N + ')');
  o.push('IF (GV_SKIP==1) GOTOF STEP' + s.step + '_DONE');
  o.push('L_TOOL_LOAD(' + q(s.tool) + ')');
  /* a CMC step runs its CMC program per nest in place of the B program */
  o.push('L_RUN_NESTS(' + [q(s.tool), fix(s.brkTol, U.dec), N, q(s.cmc ? cmcName(s.step) : s.program), s.meas ? 1 : 0, s.measAlways ? 1 : 0,
    s.brk ? 1 : 0, s.maxBrk, s.debug ? 1 : 0, s.life, s.setpiece ? 1 : 0].join(',') + ')');
  if (s.cmc) cmcAfter(o, R, s);
  o.push('STEP' + s.step + '_DONE:');
  o.push(';---- STEP ' + s.step + ' END ----');
  o.push('L_STEP_LOG(' + s.step + ',' + q(s.tool) + ',GV_NESTS_CUT,GV_BRK_COUNT,LV_STEP_START)');
  o.push('STOPRE');
}
function cycleTime(o) {
  o.push('LV_CYCLE_TIME=$A_HOUR*3600+$A_MINUTE*60+$A_SECOND-LV_CYCLE_START');
  o.push('IF (LV_CYCLE_TIME<0)');
  o.push('  LV_CYCLE_TIME=LV_CYCLE_TIME+86400');
  o.push('ENDIF');
}
function tombEnd(o, R) {
  var N = R.total;
  o.push(';===================');
  o.push(';   PROGRAM END');
  o.push(';===================');
  o.push(';--- COUNT GOOD PARTS, LOG THE CYCLE ---');
  o.push('LV_GOOD_PARTS=0');
  o.push('LV_I=1');
  o.push('WHILE (LV_I<=' + N + ')');
  o.push('  IF (GV_NEST_STATUS[LV_I]==1)');
  o.push('    LV_GOOD_PARTS=LV_GOOD_PARTS+1');
  o.push('  ENDIF');
  o.push('  LV_I=LV_I+1');
  o.push('ENDWHILE');
  o.push('L_STEP_LOG(0,' + q('TOTAL') + ',LV_GOOD_PARTS,0,LV_CYCLE_START)');
  cycleTime(o);
  o.push(';--- SAFE HOME, THEN REPORT EVERY NEST THAT IS NOT GOOD ---');
  o.push('C_P1_HOME');
  o.push('LV_I=1');
  o.push('WHILE (LV_I<=' + N + ')');
  o.push('  IF (GV_NEST_STATUS[LV_I]==0)');
  o.push('    MSG("NEST " << LV_I << " = INACTIVE (OPERATOR)")');
  o.push('    M0');
  o.push('    STOPRE');
  o.push('  ENDIF');
  o.push('  IF (GV_NEST_STATUS[LV_I]==2)');
  o.push('    MSG("NEST " << LV_I << " = NO PART OR OUT OF TOLERANCE (PROBE)")');
  o.push('    M0');
  o.push('    STOPRE');
  o.push('  ENDIF');
  o.push('  IF (GV_NEST_STATUS[LV_I]>=100)');
  o.push('    MSG("NEST " << LV_I << " = TOOL FAILURE AT STEP " << (GV_NEST_STATUS[LV_I]-100))');
  o.push('    M0');
  o.push('    STOPRE');
  o.push('  ENDIF');
  if (R.cmcList.length) {
    o.push('  IF (GV_NEST_STATUS[LV_I]==' + CMC_SCRAP_STATUS + ')');
    o.push('    MSG("NEST " << LV_I << " = CMC SCRAP (SEE CMC_LOG)")');
    o.push('    M0');
    o.push('    STOPRE');
    o.push('  ENDIF');
  }
