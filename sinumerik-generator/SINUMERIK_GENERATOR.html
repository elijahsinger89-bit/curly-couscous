<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SINUMERIK ONE Generator</title>
<style>
:root {
  --bg: #f4f5f7; --panel: #ffffff; --ink: #1d2330; --muted: #5d6677; --line: #d5d9e0;
  --accent: #0b6e8a; --accent-ink: #ffffff; --bad: #b3261e; --bad-bg: #fdecea; --warn: #8a5a00;
  --warn-bg: #fff4dc; --ok: #1e7a3c; --ok-bg: #e7f5ec; --field: #ffffff; --off: #eceef2; --code: #f7f8fa;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14171c; --panel: #1c2027; --ink: #e3e6eb; --muted: #9aa3b2; --line: #343a45;
    --accent: #3fa7c4; --accent-ink: #0d1014; --bad: #ff8a80; --bad-bg: #3a1d1b; --warn: #f0c060;
    --warn-bg: #3a3018; --ok: #7fd49a; --ok-bg: #1b3324; --field: #232831; --off: #2a2f38; --code: #171a20;
  }
}
:root[data-theme="dark"] {
  --bg: #14171c; --panel: #1c2027; --ink: #e3e6eb; --muted: #9aa3b2; --line: #343a45;
  --accent: #3fa7c4; --accent-ink: #0d1014; --bad: #ff8a80; --bad-bg: #3a1d1b; --warn: #f0c060;
  --warn-bg: #3a3018; --ok: #7fd49a; --ok-bg: #1b3324; --field: #232831; --off: #2a2f38; --code: #171a20;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
header.top { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between;
  padding: 12px 16px; background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; }
header.top h1 { font-size: 17px; margin: 0; }
header.top .sub { color: var(--muted); font-size: 12px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
button { font: inherit; padding: 6px 12px; border: 1px solid var(--line); background: var(--field); color: var(--ink); border-radius: 6px; cursor: pointer; }
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
button.small { padding: 2px 8px; font-size: 12px; }
nav.tabs { display: flex; gap: 4px; padding: 8px 16px 0; overflow-x: auto; }
nav.tabs button { border-radius: 6px 6px 0 0; border-bottom: none; background: transparent; color: var(--muted); }
nav.tabs button.active { background: var(--panel); color: var(--ink); border-color: var(--line); font-weight: 600; }
main { padding: 0 16px 32px; }
.tab { display: none; background: var(--panel); border: 1px solid var(--line); border-radius: 0 8px 8px 8px; padding: 16px; }
.tab.active { display: block; }
h2 { font-size: 15px; margin: 18px 0 8px; }
h2:first-child { margin-top: 0; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px 16px; }
label.f { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--muted); }
label.f.chk { flex-direction: row; align-items: center; gap: 6px; color: var(--ink); font-size: 13px; }
input, select { font: inherit; color: var(--ink); background: var(--field); border: 1px solid var(--line); border-radius: 5px; padding: 5px 7px; min-width: 0; }
input[type=checkbox] { width: 16px; height: 16px; }
input:disabled, select:disabled { background: var(--off); color: var(--muted); }
input.err, select.err { border-color: var(--bad); background: var(--bad-bg); }
.note { color: var(--muted); font-size: 12px; margin: 4px 0 0; }
.box { border: 1px solid var(--line); border-radius: 8px; padding: 12px; margin-top: 10px; }
.tblwrap { overflow-x: auto; }
table.t { border-collapse: collapse; width: 100%; font-size: 13px; }
table.t th, table.t td { border-bottom: 1px solid var(--line); padding: 4px 5px; text-align: left; white-space: nowrap; }
table.t th { color: var(--muted); font-weight: 600; font-size: 12px; }
table.t input[type=text] { width: 100%; min-width: 64px; }
table.t td.c, table.t th.c { text-align: center; }
table.t th input.colall { margin: 3px 0 0; }
table.t td.ro { color: var(--muted); font-variant-numeric: tabular-nums; }
#msgs { margin: 10px 16px 0; }
.msg { border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; border: 1px solid; }
.msg.bad { background: var(--bad-bg); border-color: var(--bad); }
.msg.ok { background: var(--ok-bg); border-color: var(--ok); }
.msg.warn { background: var(--warn-bg); border-color: var(--warn); }
.msg ul { margin: 6px 0 0; padding-left: 20px; }
.msg a { color: inherit; }
.out { display: grid; grid-template-columns: minmax(200px, 280px) 1fr; gap: 12px; }
@media (max-width: 760px) { .out { grid-template-columns: 1fr; } }
.flist { list-style: none; margin: 0; padding: 0; border: 1px solid var(--line); border-radius: 8px; max-height: 70vh; overflow: auto; }
.flist li { padding: 6px 10px; border-bottom: 1px solid var(--line); cursor: pointer; display: flex; justify-content: space-between; gap: 8px; }
.flist li.sel { background: var(--off); font-weight: 600; }
.flist .dir { color: var(--muted); font-size: 11px; }
.viewer { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
.viewer .vh { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 6px 10px; border-bottom: 1px solid var(--line); }
.viewer pre { margin: 0; padding: 8px 0; background: var(--code); max-height: 70vh; overflow: auto; font: 12.5px/1.45 ui-monospace, Consolas, "Courier New", monospace; }
.viewer pre span.ln { display: inline-block; width: 4.2em; padding-right: 10px; text-align: right; color: var(--muted); user-select: none; }
dialog { border: 1px solid var(--line); border-radius: 10px; background: var(--panel); color: var(--ink); max-width: 560px; width: calc(100% - 32px); }
dialog::backdrop { background: rgba(0,0,0,.45); }
dialog .btns { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
.pill { display: inline-block; padding: 1px 8px; border-radius: 10px; background: var(--off); color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<header class="top">
  <div>
    <h1>SINUMERIK ONE Program Generator</h1>
    <div class="sub">Tombstone / single-part nest framework. Offline. <span id="jobLabel"></span></div>
  </div>
  <div class="actions">
    <button id="btnLoad" type="button">Load job…</button>
    <input type="file" id="fileLoad" accept=".json,application/json" hidden>
    <button id="btnBList" type="button" title="Pre-fill from the hyperMILL B program list (_B_PROGRAMS.json)">Import B list…</button>
    <input type="file" id="fileBList" accept=".json,application/json" hidden>
    <button id="btnSave" type="button">Save job</button>
    <button id="btnValidate" type="button">Validate</button>
    <button id="btnGenerate" type="button" class="primary">Generate ZIP</button>
  </div>
</header>
<nav class="tabs" role="tablist">
  <button type="button" data-tab="config" class="active">1 · Config &amp; steps</button>
  <button type="button" data-tab="probing">2 · Probing</button>
  <button type="button" data-tab="wcs">3 · Work offsets</button>
  <button type="button" data-tab="output">4 · Output</button>
</nav>
<div id="msgs"></div>
<main>
  <section class="tab active" id="tab-config"></section>
  <section class="tab" id="tab-probing"></section>
  <section class="tab" id="tab-wcs"></section>
  <section class="tab" id="tab-output"></section>
</main>
<dialog id="dlg">
  <h2 id="dlgTitle"></h2>
  <div id="dlgBody"></div>
  <div class="btns" id="dlgBtns"></div>
</dialog>

<script id="engine">
/* ==========================================================================
   ENGINE: pure functions. No DOM. Also loaded by the test harness (Node).
   Every emitted construct was checked against:
     SINUMERIK ONE Measuring cycles PM 07/2025 (MC)
     SINUMERIK ONE NC programming PM 07/2025   (NC)
     SINUMERIK ONE System variables LM 07/2022 (SV)
   ========================================================================== */
(function (G) {
'use strict';

var GEN_VERSION = '1.4.0';
/* Framework revision of the fixed files installed once per machine
   (L_ cycles, C_P1_HOME, C_P1_LOAD_WO, UGUD.DEF). Comment only.
   RULE: any change to the code or text of a fixed file means bump FW_REV
   and add a row to FW_HISTORY (tests/framework_revNN.sha256 enforces it). */
var FW_REV = '01';
var FW_HISTORY = [
  ['00', '2026-11-11', ['EXCEL/VBA PACKAGE']],
  ['01', '2026-11-12', ['REBUILT AND CHECKED AGAINST THE SINUMERIK ONE',
                        'MANUALS (NC PROGRAMMING, MEASURING CYCLES 07/2025)']]
];
var MAX_NESTS = 32;
var AXES = ['NONE', 'A', 'B', 'C'];
var XY_METHODS = ['SPLIT EXTERIOR', 'BORE', 'BOSS', 'RECT POCKET', 'RECT SPIGOT', 'NONE'];
var OUTSIDE = { 'SPLIT EXTERIOR': 1, 'BOSS': 1, 'RECT SPIGOT': 1 };
var INSIDE = { 'BORE': 1, 'RECT POCKET': 1 };
var LASER_RPM = 3750;               /* shop laser speed - fixed */
var UNIT = {
  METRIC: { key: 'METRIC', dec: 3, g: 'G71', label: 'METRIC (MM)', u: 'mm',
            clr: 1, feed: 300, fa: 5, travel: 15, zTol: 0.1, xyTol: 0.1, outClr: 25, inMargin: 1 },
  INCH:   { key: 'INCH', dec: 4, g: 'G70', label: 'INCH (IN)', u: 'in',
            clr: 0.04, feed: 12, fa: 0.2, travel: 0.6, zTol: 0.004, xyTol: 0.004, outClr: 1, inMargin: 0.04 }
};

/* ---------------- job model ---------------- */
function blankWcsRow() { return { x: '', y: '', z: '', trunnion: '', rotary: '', notes: '' }; }
function blankStep(stepNo) {
  return { step: String(stepNo), tool: '', brkTol: '', program: '', meas: true, measAlways: false,
           brk: true, maxBrk: '2', debug: false, life: '1', setpiece: true,
           /* from the hyperMILL B program list: toolpaths in the B program, G41/G42 found in its NC file */
           jobs: '', rcomp: '',
           /* CMC (cut / measure / cut) card, used when cmc is ticked */
           cmc: false, cmcTool: 'ROTATING', cmcFeature: 'BORE', cmcSide: '+', cmcEdge: '1', cmcField: 'AUTO',
           cmcUnit: 'RADIUS', cmcSign: '', cmcNom: '', cmcTolP: '', cmcTolM: '', cmcX: '', cmcY: '', cmcZ: '',
           cmcAppZ: '', cmcStock: '', cmcWindow: '', cmcLimit: '', cmcClean: 'NONE', cmcCleanM: '',
           cmcVerify: false, cmcOut: 'RECUT', cmcMaxTry: '3', cmcReturn: 'TCA' };
}
function defaultJob() {
  var wcs = [];
  for (var i = 0; i < MAX_NESTS; i++) wcs.push(blankWcsRow());
  return {
    format: 'SINUMERIK_ONE_GENERATOR_JOB', version: 1,
    header: { part: '', material: '', stock: '', machine: '', programmer: '' },
    config: { units: 'METRIC', trunnion: 'NONE', rotary: 'B', mode: 'TOMBSTONE',
              faces: '4', nestsPerFace: '2', totalNests: '8' },
    probeStep: { enabled: true, step: '1', program: '' },
    builder: { first: '10', last: '', inc: '10' },
    steps: [blankStep(10)],
    probing: {
      tool: 'PROBE', limitClear: '', feed: '', searchDist: '', prnum: '1', probeOnM: 'M56',
      partCheck: true, maxTravel: '', chkAlt: false, chkX: '', chkY: '', chkZ: '',
      skipZ: false, zAlt: false, zX: '', zY: '', zZ: '', zNom: '0', zTol: '',
      xyMethod: 'SPLIT EXTERIOR', widthX: '', widthY: '', diameter: '', appX: '0', appY: '0',
      probeZ: '', xyTol: '', approachClr: '',
      health: false, hX: '', hY: '', hStartZ: '', hTargetZ: '', hFeed: ''
    },
    /* CMC R parameters: first R of the first CMC block (50 per CMC step), R count on the control (MD28050),
       tool carrier for TCA (spindle) */
    cmcR: { first: '700', count: '1000', carrier: '1' },
    wcs: wcs
  };
}
/* merge a loaded object over the defaults; unknown keys are dropped */
function normalizeJob(src) {
  var d = defaultJob();
  if (!src || typeof src !== 'object') return d;
  function mergeFlat(def, s) {
    if (!s || typeof s !== 'object') return def;
    Object.keys(def).forEach(function (k) {
      if (!(k in s) || s[k] === null || s[k] === undefined) return;
      if (typeof def[k] === 'boolean') def[k] = (s[k] === true || s[k] === 'true' || s[k] === 1 || s[k] === 'YES');
      else def[k] = String(s[k]);
    });
    return def;
  }
  mergeFlat(d.header, src.header);
  mergeFlat(d.config, src.config);
  mergeFlat(d.probeStep, src.probeStep);
  mergeFlat(d.builder, src.builder);
  mergeFlat(d.probing, src.probing);
  mergeFlat(d.cmcR, src.cmcR);
  if (Array.isArray(src.steps)) {
    d.steps = src.steps.map(function (s) { return mergeFlat(blankStep(''), s); });
  }
  if (Array.isArray(src.wcs)) {
    for (var i = 0; i < MAX_NESTS; i++) d.wcs[i] = mergeFlat(blankWcsRow(), src.wcs[i]);
  }
  return d;
}

/* ---------------- numbers and text ---------------- */
function isBlank(v) { return v === undefined || v === null || String(v).trim() === ''; }
function num(v) {
  if (isBlank(v)) return NaN;
  var t = String(v).trim();
  if (!/^[+-]?(\d+(\.\d*)?|\.\d+)$/.test(t)) return NaN;
  return Number(t);
}
function isNum(v) { return !isNaN(num(v)); }
function isInt(v) { var n = num(v); return !isNaN(n) && Math.floor(n) === n; }
function fix(v, d) {
  var p = Math.pow(10, d);
  var a = Math.round(Math.abs(v) * p + 1e-7) / p;
  var s = a.toFixed(d);
  if (Number(s) !== 0 && v < 0) s = '-' + s;
  return s;
}
function compact(v, maxDec) {
  var s = fix(v, maxDec);
  if (s.indexOf('.') >= 0) s = s.replace(/0+$/, '').replace(/\.$/, '');
  return s;
}
function ascii(s) {
  return String(s === undefined || s === null ? '' : s).replace(/[\r\n\t]+/g, ' ')
    .replace(/[^\x20-\x7E]/g, '?').trim();
}
function pad(s, w) { s = String(s); while (s.length < w) s += ' '; return s; }
function today() {
  var d = new Date();
  return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
}
var PROG_RE = /^[A-Za-z_][A-Za-z_][A-Za-z0-9_]{0,22}$/;
var RESERVED = ['CON', 'PRN', 'AUX', 'NUL', 'COM1', 'COM2', 'COM3', 'COM4', 'COM5', 'COM6', 'COM7', 'COM8', 'COM9',
                'LPT1', 'LPT2', 'LPT3', 'LPT4', 'LPT5', 'LPT6', 'LPT7', 'LPT8', 'LPT9'];
function progNameError(name) {
  if (isBlank(name)) return 'program name is required';
  var t = String(name).trim();
  if (t.length > 24) return 'program name is ' + t.length + ' characters (max 24, NC 3.3)';
  if (!PROG_RE.test(t)) return 'program name must use A-Z, 0-9, _ and start with two letters/underscores (NC naming rules)';
  if (RESERVED.indexOf(t.toUpperCase()) >= 0) return 'program name ' + t + ' is reserved';
  return '';
}
function toolNameError(name) {
  if (isBlank(name)) return 'tool name is required';
  var t = String(name).trim();
  if (t.length > 25) return 'tool name is ' + t.length + ' characters (max 25, the L_ cycles take STRING[25])';
  if (/["]/.test(t)) return 'tool name must not contain a double quote';
  if (/[^\x20-\x7E]/.test(t)) return 'tool name must be plain ASCII';
  return '';
}

/* ---------------- step builder: first / last / increment ----------------
   Program names B_[part]_[step]_[machine], step zero-padded to 3 digits
   (4 when any step >= 1000), max 24 characters (NC naming rules).        */
var NAME_PART_RE = /^[A-Za-z0-9_]+$/;
var MAX_BUILD_ROWS = 100;
function nameParts(job) {
  return { part: String(job.header.part || '').trim(), mach: String(job.header.machine || '').trim() };
}
function nameInputsError(job) {
  var n = nameParts(job);
  if (!n.part) return 'Enter the part number (Header) first: program names are B_[part]_[step]_[machine].';
  if (!NAME_PART_RE.test(n.part)) return 'Part number "' + n.part + '" can only use letters, numbers and _ to be part of a program name.';
  if (n.mach && !NAME_PART_RE.test(n.mach)) return 'Machine "' + n.mach + '" can only use letters, numbers and _ to be part of a program name (or leave Machine blank).';
  return '';
}
function nameWidth(stepNos) {
  var hi = 0;
  stepNos.forEach(function (s) { if (isFinite(s) && s > hi) hi = s; });
  return hi >= 1000 ? 4 : 3;
}
function rawName(job, stepNo, width) {
  var n = nameParts(job), s = String(stepNo);
  while (s.length < width) s = '0' + s;
  return 'B_' + n.part + '_' + s + (n.mach ? '_' + n.mach : '');
}
function progName(job, stepNo, width) {
  var nm = rawName(job, stepNo, width);
  return progNameError(nm) ? '' : nm;
}
function maxMachineLen(job, width) {
  return 24 - (2 + nameParts(job).part.length + 1 + width + 1);
}
function allStepNos(steps, ps) {
  var a = [];
  steps.forEach(function (s) { if (isInt(s.step)) a.push(num(s.step)); });
  if (ps.enabled && isInt(ps.step)) a.push(num(ps.step));
  return a;
}
function cloneStep(s) { return JSON.parse(JSON.stringify(s)); }
function hasStepData(job) {
  return job.steps.some(function (s) { return !isBlank(s.tool) || !isBlank(s.program) || !isBlank(s.brkTol); });
}
/* mode 'overwrite': a fresh row per step of the range, every name generated.
   mode 'keep': every current row untouched, missing steps added, sorted.   */
function buildSteps(job, mode) {
  var b = job.builder, ps = job.probeStep;
  var R = { steps: null, probeProgram: ps.program, unnamed: [], error: '', count: 0, added: 0, width: 3 };
  var ne = nameInputsError(job);
  if (ne) { R.error = ne; return R; }
  if (!isInt(b.first) || !isInt(b.last) || !isInt(b.inc)) { R.error = 'First step, last step and increment must be whole numbers.'; return R; }
  var first = num(b.first), last = num(b.last), inc = num(b.inc);
  if (first < 1 || last > 99999) { R.error = 'Step numbers must be 1-99999.'; return R; }
  if (last < first) { R.error = 'Last step (' + last + ') must not be below first step (' + first + ').'; return R; }
  if (inc < 1) { R.error = 'Increment must be at least 1.'; return R; }
  var count = Math.floor((last - first) / inc) + 1;
  if (count > MAX_BUILD_ROWS) { R.error = 'That range makes ' + count + ' steps (max ' + MAX_BUILD_ROWS + ').'; return R; }
  if (ps.enabled && isInt(ps.step) && first <= num(ps.step)) { R.error = 'First step must come after the probe step (' + num(ps.step) + ').'; return R; }
  var range = [];
  for (var s = first; s <= last; s += inc) range.push(s);
  var steps, fresh = [];
  if (mode === 'keep') {
    steps = job.steps.map(cloneStep);
    var have = {};
    steps.forEach(function (st) { if (isInt(st.step)) have[num(st.step)] = 1; });
    range.forEach(function (n) { if (!have[n]) { var r = blankStep(n); fresh.push(r); steps.push(r); } });
    steps.sort(function (a, c) {
      var x = isInt(a.step) ? num(a.step) : Infinity, y = isInt(c.step) ? num(c.step) : Infinity;
      return x - y;
    });
  } else {
    steps = range.map(function (n) { var r = blankStep(n); fresh.push(r); return r; });
  }
  var w = nameWidth(allStepNos(steps, ps));
  fresh.forEach(function (st) {
    var nm = progName(job, num(st.step), w);
    if (nm) st.program = nm; else R.unnamed.push(num(st.step));
  });
  if (ps.enabled && isInt(ps.step) && (mode !== 'keep' || isBlank(ps.program))) {
    var pn = progName(job, num(ps.step), w);
    if (pn) R.probeProgram = pn; else R.unnamed.unshift(num(ps.step));
  }
  R.steps = steps; R.count = range.length; R.added = fresh.length; R.width = w;
  R.maxMachine = maxMachineLen(job, w);
  return R;
}
/* "Fill blank program names": same pattern, only blank names are touched */
function fillNames(job) {
  var ps = job.probeStep;
  var R = { steps: job.steps.map(cloneStep), probeProgram: ps.program, unnamed: [], error: '', filled: 0 };
  var ne = nameInputsError(job);
  if (ne) { R.error = ne; return R; }
  var w = nameWidth(allStepNos(job.steps, ps));
  R.width = w; R.maxMachine = maxMachineLen(job, w);
  if (ps.enabled && isBlank(ps.program) && isInt(ps.step)) {
    var pn = progName(job, num(ps.step), w);
    if (pn) { R.probeProgram = pn; R.filled++; } else R.unnamed.push(num(ps.step));
  }
  R.steps.forEach(function (st) {
    if (!isBlank(st.program) || !isInt(st.step)) return;
    var nm = progName(job, num(st.step), w);
    if (nm) { st.program = nm; R.filled++; } else R.unnamed.push(num(st.step));
  });
  return R;
}

/* ---------------- B program list import (hyperMILL b_program_export / go-to-machine) ----------------
   Format: B_PROGRAM_LIST_FORMAT.txt. Version 1. Unknown keys are ignored.                          */
var BLIST_FORMAT = 'SINUMERIK_B_PROGRAM_LIST';
function readBList(data) {
  var R = { error: '', list: null };
  if (!data || typeof data !== 'object' || data.format !== BLIST_FORMAT) { R.error = 'Not a B program list (format tag missing). Pick the _B_PROGRAMS.json file the hyperMILL export wrote.'; return R; }
  if (data.version !== 1) { R.error = 'B program list version ' + data.version + ' is not supported (this generator reads version 1).'; return R; }
  if (data.units !== 'INCH' && data.units !== 'METRIC') { R.error = 'B program list units must be INCH or METRIC, not ' + data.units + '.'; return R; }
  if (!Array.isArray(data.steps) || !data.steps.length) { R.error = 'The B program list has no steps.'; return R; }
  var rows = [], bad = [];

    if (!isBlank(pr.prnum) && (!isInt(pr.prnum) || num(pr.prnum) < 1 || num(pr.prnum) > 40)) err('probing.prnum', 'CMC probe (tab 2): calibration data set must be 1-40 (MC S_PRNUM)');
    if (!isBlank(pr.probeOnM) && !/^M\d{1,4}$/.test(String(pr.probeOnM).trim().toUpperCase())) err('probing.probeOnM', 'CMC probe (tab 2): probe-on M code must look like M56 (or be blank)');
  }
  if (!isInt(cr.first) || num(cr.first) < 0) err('cmcR.first', 'CMC: first R number must be a whole number');
  if (!isInt(cr.count) || num(cr.count) < 1) err('cmcR.count', 'CMC: R parameters on the control (MD28050) must be a whole number');
  if (isInt(cr.first) && isInt(cr.count)) {
    var last = num(cr.first) + CMC_BLOCK * rows.length - 1;
    if (last > num(cr.count) - 1)
      err('cmcR.first', 'CMC: ' + rows.length + ' CMC step' + (rows.length > 1 ? 's use' : ' uses') + ' R' + num(cr.first) + '-R' + last +
          ', above the last R on the control (R' + (num(cr.count) - 1) + ', MD28050 = ' + num(cr.count) + ')');
  }
  if (!isInt(cr.carrier) || num(cr.carrier) < 1) err('cmcR.carrier', 'CMC: TCA tool carrier (spindle) must be a whole number >= 1');
  var P = { fa: isBlank(job.probing.searchDist) ? U.fa : num(job.probing.searchDist) };
  var clrIn = isBlank(job.probing.approachClr) ? P.fa + U.inMargin : num(job.probing.approachClr);
  rows.forEach(function (i) {
    var s = job.steps[i], p = 'steps.' + i + '.', tag = 'CMC step ' + (isInt(s.step) ? num(s.step) : 'row ' + (i + 1)) + ': ';
    var d = CMC_DEF[s.cmcFeature];
    if (!d) { err(p + 'cmcFeature', tag + 'pick the feature'); return; }
    if (CMC_TOOLS.indexOf(s.cmcTool) < 0) err(p + 'cmcTool', tag + 'tool type must be ROTATING or TURNING');
    if (!isNum(s.cmcNom)) err(p + 'cmcNom', tag + 'nominal must be a number');
    else if (d.kind === 'size' && num(s.cmcNom) <= 0) err(p + 'cmcNom', tag + 'nominal diameter / width must be > 0');
    ['cmcTolP', 'cmcTolM'].forEach(function (k) {
      if (!isNum(s[k]) || num(s[k]) < 0) err(p + k, tag + 'tolerance ' + (k === 'cmcTolP' ? '+' : '-') + ' must be a number >= 0');
    });
    if (isNum(s.cmcTolP) && isNum(s.cmcTolM) && num(s.cmcTolP) + num(s.cmcTolM) <= 0) err(p + 'cmcTolP', tag + 'the tolerance band must be wider than 0');
    if (!isNum(s.cmcStock) || num(s.cmcStock) <= 0) err(p + 'cmcStock', tag + 'first-cut wear must be a number > 0 (it leaves material for the measurement)');
    if (!isBlank(s.cmcWindow) && (!isNum(s.cmcWindow) || num(s.cmcWindow) <= 0)) err(p + 'cmcWindow', tag + 'check window must be a number > 0 (blank = the first-cut wear)');
    if (!isBlank(s.cmcLimit) && (!isNum(s.cmcLimit) || num(s.cmcLimit) <= 0)) err(p + 'cmcLimit', tag + 'correction limit must be a number > 0 (blank = ' + CMC_LIMIT[U.key] + ')');
    if (!isInt(s.cmcEdge) || num(s.cmcEdge) < 1 || num(s.cmcEdge) > 9) err(p + 'cmcEdge', tag + 'edge (D number) must be 1-9');
    if (CMC_FIELDS.indexOf(s.cmcField) < 0) err(p + 'cmcField', tag + 'wear field must be AUTO or DP12-DP15');
    if (s.cmcTool === 'TURNING' && ['LARGER', 'SMALLER'].indexOf(s.cmcSign) < 0)
      err(p + 'cmcSign', tag + 'turning tool: say what +wear does to the measured value (larger / smaller)');
    /* location */
    if (d.kind === 'size' || d.kind === 'floor') {
      if (!isNum(s.cmcX)) err(p + 'cmcX', tag + (d.kind === 'size' ? 'centre X' : 'point X') + ' must be a number');
      if (!isNum(s.cmcY)) err(p + 'cmcY', tag + (d.kind === 'size' ? 'centre Y' : 'point Y') + ' must be a number');
    } else if (d.ma === 1) {
      if (!isNum(s.cmcY)) err(p + 'cmcY', tag + 'point Y along the wall must be a number');
    } else if (!isNum(s.cmcX)) err(p + 'cmcX', tag + 'point X along the wall must be a number');
    if (d.kind !== 'floor' && !isNum(s.cmcZ)) err(p + 'cmcZ', tag + 'probe depth Z must be a number');
    if (!isNum(s.cmcAppZ)) err(p + 'cmcAppZ', tag + 'approach Z (clear above the feature) must be a number');
    else if (d.kind !== 'floor' && isNum(s.cmcZ) && num(s.cmcAppZ) <= num(s.cmcZ))
      err(p + 'cmcAppZ', tag + 'approach Z must be above the probe depth');
    else if (d.kind === 'floor' && isNum(s.cmcNom) && isNum(s.cmcStock) && num(s.cmcAppZ) < num(s.cmcNom) + num(s.cmcStock) + clrIn)
      err(p + 'cmcAppZ', tag + 'approach Z must be at least ' + compact(num(s.cmcNom) + num(s.cmcStock) + clrIn, 4) + ' (floor + first-cut wear + S_FA clearance)');
    if (s.cmcClean === 'M CODE' && !/^M\d{1,4}$/i.test(String(s.cmcCleanM || '').trim()))
      err(p + 'cmcCleanM', tag + 'cleaning M code like M50');
    if (CMC_CLEAN.indexOf(s.cmcClean) < 0) err(p + 'cmcClean', tag + 'cleaning must be NONE, M CODE or M0');
    if (s.cmcVerify && s.cmcOut !== 'ACCEPT' && (!isInt(s.cmcMaxTry) || num(s.cmcMaxTry) < 1))
      err(p + 'cmcMaxTry', tag + 'max re-cuts must be a whole number >= 1');
    if (['TCA', 'T M6'].indexOf(s.cmcReturn) < 0) err(p + 'cmcReturn', tag + 'return to the cutter must be TCA or T M6');
    /* warnings from the hyperMILL B program list */
    if (isInt(s.jobs) && num(s.jobs) > 1)
      warn(p + 'cmc', tag + 'the B program has ' + num(s.jobs) + ' toolpaths; CMC re-cuts every one of them. Keep the CMC toolpath alone in its compound job.');
    if (s.cmcTool !== 'TURNING' && d.kind !== 'floor' && s.rcomp === 'NO')
      warn(p + 'cmc', tag + 'the posted B program has no G41/G42: radius wear ($TC_DP15) has no effect without cutter compensation.');
  });
}
function validateProbe(job, err, needNum) {
  var p = job.probing, U = UNIT[job.config.units === 'INCH' ? 'INCH' : 'METRIC'];
  var te = toolNameError(p.tool); if (te) err('probing.tool', 'Probe tool: ' + te);
  function optPos(path, v, label) { if (!isBlank(v) && (!isNum(v) || num(v) <= 0)) err(path, label + ' must be a number > 0'); }
  optPos('probing.limitClear', p.limitClear, 'Limit clearance');
  optPos('probing.feed', p.feed, 'Probe feed');
  optPos('probing.searchDist', p.searchDist, 'Measuring path (search distance)');
  if (!isBlank(p.prnum) && (!isInt(p.prnum) || num(p.prnum) < 1 || num(p.prnum) > 40)) err('probing.prnum', 'Probe calibration data set must be 1-40 (MC S_PRNUM)');
  var fa = orDefault(p.searchDist, U.fa);
  var P = resolveProbe(p, { U: U });
  if (!P.hasWork) err('probing.xyMethod', 'The probe step has nothing to do: health check off, part check off, Z skipped and XY method NONE');
  var needsMeas = P.health || P.partCheck;
  if (!isBlank(p.probeOnM) && !/^M\d{1,4}$/.test(String(p.probeOnM).trim().toUpperCase())) err('probing.probeOnM', 'Probe-on M code must look like M56 (or be blank)');
  if (!isBlank(p.approachClr) && (!isNum(p.approachClr) || num(p.approachClr) <= 0)) err('probing.approachClr', 'Approach clearance must be a number > 0 (or blank for auto)');
  if (!isNum(p.zNom)) err('probing.zNom', 'Z nominal must be a number');
  /* Z datum */
  if (!p.skipZ) {
    optPos('probing.zTol', p.zTol, 'Z tolerance');
    if (isNum(fa) && P.zTol >= fa) err('probing.zTol', 'Z tolerance must be smaller than the measuring path ' + fa);
    if (p.zAlt) {
      needNum('probing.zX', p.zX, 'Alternate Z location X'); needNum('probing.zY', p.zY, 'Alternate Z location Y');
      needNum('probing.zZ', p.zZ, 'Alternate Z location Z (start height)');
      if (isNum(p.zZ) && isNum(p.zNom) && num(p.zZ) - num(p.zNom) <= fa)
        err('probing.zZ', 'Alternate Z start height must be more than the measuring path (' + fa + ') above Z nominal (MC 4.3.7)');
    } else {
      if (P.inside) err('probing.zAlt', 'Z datum at the XY approach point of a ' + p.xyMethod + ' probes into empty space: set an alternate Z location or skip Z');
      needNum('probing.appX', p.appX, 'Approach X'); needNum('probing.appY', p.appY, 'Approach Y');
      if (P.approachSet && isNum(p.approachClr) && num(p.approachClr) <= fa)
        err('probing.approachClr', 'Approach clearance must be larger than the measuring path ' + fa + ' (Z datum start, MC 4.3.7)');
    }
  }
  /* part check (MEAS touch) */
  if (p.partCheck) {
    optPos('probing.maxTravel', p.maxTravel, 'Max probe travel');
    if (p.chkAlt) {
      needNum('probing.chkX', p.chkX, 'Alternate check X'); needNum('probing.chkY', p.chkY, 'Alternate check Y');
      needNum('probing.chkZ', p.chkZ, 'Alternate check Z (start height)');
    } else {
      if (p.zAlt ? false : P.inside) err('probing.chkAlt', 'Part check at the XY approach point of a ' + p.xyMethod + ' touches nothing: set an alternate check location');
      if (p.zAlt) { needNum('probing.zX', p.zX, 'Alternate Z location X'); needNum('probing.zY', p.zY, 'Alternate Z location Y'); needNum('probing.zZ', p.zZ, 'Alternate Z location Z'); }
      else { needNum('probing.appX', p.appX, 'Approach X'); needNum('probing.appY', p.appY, 'Approach Y'); }
      var gap = P.zLoc.z - P.zNom;
      if (isFinite(gap) && isFinite(P.maxTravel) && P.maxTravel <= gap)
        err('probing.maxTravel', 'Max probe travel (' + P.maxTravel + ') must exceed the start-to-surface gap (' + compact(gap, 4) + '), or every nest reads "no part"');
    }
  }
  if (needsMeas && isBlank(p.probeOnM)) { /* allowed: some probes are always on */ }
  /* XY datum */
  if (P.xyMethod !== 'NONE') {
    needNum('probing.appX', p.appX, 'Approach X'); needNum('probing.appY', p.appY, 'Approach Y');
    needNum('probing.probeZ', p.probeZ, 'Probe depth Z');
    optPos('probing.xyTol', p.xyTol, 'XY tolerance');
    if (isNum(fa) && P.xyTol >= fa) err('probing.xyTol', 'XY tolerance must be smaller than the measuring path ' + fa);
    if (P.xyMethod === 'SPLIT EXTERIOR' || P.xyMethod === 'RECT POCKET' || P.xyMethod === 'RECT SPIGOT') {
      if (!isNum(p.widthX) || num(p.widthX) <= 0) err('probing.widthX', 'Part width X must be a number > 0 for ' + P.xyMethod);
      if (!isNum(p.widthY) || num(p.widthY) <= 0) err('probing.widthY', 'Part width Y must be a number > 0 for ' + P.xyMethod);
    }
    if (P.xyMethod === 'BORE' || P.xyMethod === 'BOSS') {
      if (!isNum(p.diameter) || num(p.diameter) <= 0) err('probing.diameter', 'Diameter must be a number > 0 for ' + P.xyMethod);
    }
    if (isNum(p.probeZ) && isNum(p.zNom) && !(num(p.probeZ) < P.xyStartZ))
      err('probing.probeZ', 'Probe depth Z must be below the XY start height (' + compact(P.xyStartZ, 4) + ')');
  }
  /* health check */
  if (p.health) {
    needNum('probing.hX', p.hX, 'Health check X'); needNum('probing.hY', p.hY, 'Health check Y');
    needNum('probing.hStartZ', p.hStartZ, 'Health check start Z'); needNum('probing.hTargetZ', p.hTargetZ, 'Health check target Z');
    if (isNum(p.hStartZ) && isNum(p.hTargetZ) && num(p.hTargetZ) >= num(p.hStartZ)) err('probing.hTargetZ', 'Health check target Z must be below the start Z');
    optPos('probing.hFeed', p.hFeed, 'Health check feed');
  }
}

/* ---------------- NC helpers ---------------- */
function retract(clr) { return 'G0 SUPA G17 G90 Z=$MA_POS_LIMIT_PLUS[AX3]-' + compact(clr, 4) + ' D0'; }
function kinDesc(R) {
  if (R.trunnion === 'NONE' && R.rotary === 'NONE') return '3-AXIS: NO ROTARY AXIS';
  if (R.trunnion === 'NONE') return '4-AXIS HORIZONTAL: ' + R.rotary + ' = ROTARY';
  if (R.rotary === 'NONE') return R.trunnion + ' = TRUNNION/4TH, NO ROTARY';
  return R.trunnion + R.rotary + ' MACHINE: ' + R.trunnion + ' = TRUNNION/4TH, ' + R.rotary + ' = ROTARY';
}
function orientLine(R) {
  var a = [];
  if (R.trunnion !== 'NONE') a.push(R.trunnion + '0');
  if (R.rotary !== 'NONE') a.push(R.rotary + '0');
  return a.join(' ');
}
function L(R) { return { lines: [], len: function (v) { return fix(v, R.U.dec); } }; }
function rev(lines, R) {
  lines.push(';--------------------');
  lines.push(';  REVISION CONTROL');
  lines.push(';--------------------');
  lines.push('; REV  DATE        BY            DESCRIPTION');
  lines.push(';  00  ' + R.date + '  ' + pad(R.header.programmer || 'XXXX', 13) + ' Generated');
}
function hdr(lines, R, prog, func, extra) {
  lines.push('; PROGRAM      : ' + prog);
  lines.push('; PRG FUNCTION : ' + func);
  lines.push('; CONTROL      : SINUMERIK ONE');
  (extra || []).forEach(function (e) { lines.push(e); });
  lines.push('; GENERATED    : ' + R.date + ' BY SINUMERIK_GENERATOR.HTML V' + GEN_VERSION);
  lines.push(fwNeeds());
}
/* job files name the framework revision they were generated for */
function fwNeeds() { return '; FRAMEWORK    : NEEDS NEST FRAMEWORK REV ' + FW_REV; }
/* revision comment block for the fixed files (no dates of generation, no
   generator version, so every job produces byte-identical fixed files) */
function fwBlock(R, withUnits) {
  var b = [';-------------------------------------------',
           '; FRAMEWORK    : SINUMERIK ONE NEST FRAMEWORK REV ' + FW_REV];
  if (withUnits) b.push('; UNITS        : ' + R.units + ' - RETRACT ' + compact(R.clr, 4) + ' BELOW THE Z SOFTWARE LIMIT');
  b.push(';  REV  DATE        DESCRIPTION');
  FW_HISTORY.forEach(function (h) {
    h[2].forEach(function (d, i) {
      b.push(i === 0 ? ';  ' + h[0] + '   ' + h[1] + '  ' + d : ';                   ' + d);
    });
  });
  b.push(';-------------------------------------------');
  return b;
}
/* insert the block after line 1 (the PROC line where there is one) */
function fw(txt, R, withUnits) {
  var lines = txt.split('\n');
  Array.prototype.splice.apply(lines, [1, 0].concat(fwBlock(R, withUnits)));
  return lines.join('\n');
}
function modeDesc(R) {
  return R.single ? 'SINGLE PART: 1 NEST (G505)'
    : 'TOMBSTONE: ' + R.faces + ' FACES x ' + R.npf + ' NESTS/FACE, ' + R.total + ' NESTS USED';
}
function text(lines) { return lines.join('\n') + '\n'; }
function q(s) { return '"' + s + '"'; }

function fRunNests() {
  return text([
    'PROC L_RUN_NESTS(STRING[25] LD_TNAME, REAL LD_BRK_TOL, INT LD_TOTAL, STRING[32] LD_PROG, INT LD_MEAS, INT LD_ALWAYS, INT LD_USEBRK, INT LD_MAXBRK, INT LD_DEBUG, INT LD_LIFE, INT LD_USESP)',
    'DEF INT LV_TNO                    ;spindle tool T number (GETEXET)',
    ';L_RUN_NESTS.SPF',
    ';Runs one machining step across all its nests.',
    ';GV_NEST is set by the caller: 1 on a fresh run, or the nest',
    ';that was running when the job stopped (restart). Loops from',
    ';there to LD_TOTAL.',
    ';',
    ';NEW TOOL (top of each running nest): GETEXET reads the tool in',
    ';the spindle ($P_TOOLNO is not reliable with magazine management,',
    ';SV). If it is disabled ($TC_TP8 bit 2, set when a break is found)',
    ';or its piece count is used up ($TC_MOP13>0 and $TC_MOP4<=0),',
    ';T/M6 by name brings in a sister.',
    ';MEASURE: LD_ALWAYS=1 measures before every nest. LD_ALWAYS=0',
    ';measures only while $TC_TP8 bit 7 (tool was in use) is 0.',
    ';STOPRE after the cut: the nest is finished before anything is',
    ';counted or GV_NEST moves on, so a restart never skips a half-cut',
    ';nest.',
    ';Results come back in GV_NESTS_CUT and GV_BRK_COUNT.',
    ';',
    ';  LD_TNAME   - tool name',
    ';  LD_BRK_TOL - break tolerance',
    ';  LD_TOTAL   - nest count',
    ';  LD_PROG    - B_ program (called per nest)',
    ';  LD_MEAS    - 1 = measuring on (laser)',
    ';  LD_ALWAYS  - 1 = always measure, 0 = smart (bit 7)',
    ';  LD_USEBRK  - 1 = break check after each nest',
    ';  LD_MAXBRK  - breaks this step before a hard stop',
    ';  LD_DEBUG   - 1 = M1 optional stop between nests',
    ';  LD_LIFE    - pieces to count per good nest (SETPIECE)',
    ';  LD_USESP   - 1 = SETPIECE on',
    ';',
    'GV_BRK_COUNT=0',
    'GV_NESTS_CUT=0',
    ';',

    '  GETEXET(LV_TNO)',
    '  ;--- new tool needed? (disabled by breakage, or used up) ---',
    '  IF (($TC_TP8[LV_TNO] B_AND 4)>0) OR (($TC_MOP13[LV_TNO,1]>0) AND ($TC_MOP4[LV_TNO,1]<=0))',
    '    T=LD_TNAME',
    '    M6',
    '    STOPRE',
    '    GETEXET(LV_TNO)',
    '  ENDIF',
    '  ;--- measure the tool in the spindle ---',
    '  IF (LD_MEAS==1)',
    '    IF (LD_ALWAYS==1)',
    '      L_TOOL_MEAS(LD_TNAME)',
    '    ELSE',
    '      IF (($TC_TP8[LV_TNO] B_AND 128)==0)',
    '        L_TOOL_MEAS(LD_TNAME)',
    '      ENDIF',
    '    ENDIF',
    '  ENDIF',
    '  C_P1_LOAD_WO',
    '  CALL LD_PROG',
    '  STOPRE',
    '  IF (LD_USEBRK==1)',
    '    L_TOOL_BRK(LD_TNAME,LD_BRK_TOL)',
    '    IF (GV_NEST_STATUS[GV_NEST]<>1)',
    '      GV_BRK_COUNT=GV_BRK_COUNT+1',
    '    ELSE',
    '      GV_NESTS_CUT=GV_NESTS_CUT+1',
    '      IF (LD_USESP==1)',
    '        SETPIECE(LD_LIFE)',
    '      ENDIF',
    '    ENDIF',
    '  ELSE',
    '    GV_NESTS_CUT=GV_NESTS_CUT+1',
    '    IF (LD_USESP==1)',
    '      SETPIECE(LD_LIFE)',
    '    ENDIF',
    '  ENDIF',
    'ENDIF',
    ';--- too many breaks? (jump kept outside the IF blocks, NC 4.1.7) ---',
    'IF (GV_BRK_COUNT>0) AND (GV_BRK_COUNT>=LD_MAXBRK) GOTOF _RN_MAXBRK',
    'IF (LD_DEBUG==1)',
    '  M1',
    'ENDIF',
    'GV_NEST=GV_NEST+1',
    'IF (GV_NEST<=LD_TOTAL) GOTOB _RN_LOOP',
    'RET',
    ';',
    ';--- too many breaks this step: park and hold until reset ---',
    ';A restart resumes at GV_STEP / GV_NEST; broken nests stay off.',
    '_RN_MAXBRK:',
    'C_P1_HOME',
    'LOOP',
    '  MSG("MAX BREAKAGE: " << GV_BRK_COUNT << " AT STEP " << GV_STEP << " - CHECK SETUP")',
    '  M0',
    '  STOPRE',
    'ENDLOOP',
    'RET',
    ';'
  ]);
}

function fWO(R) {
  var o = [], len = function (v) { return fix(v, R.U.dec); };
  hdr(o, R, 'C_P1_WO.SPF', R.single ? 'WRITE THE WORK OFFSET FOR THE SINGLE PART' : 'WRITE WORK OFFSET VALUES FOR ALL NESTS', [
    '; PALLET       : 1',
    '; MODE         : ' + modeDesc(R),
    '; KINEMATICS   : ' + kinDesc(R),
    '; UNITS        : ' + R.U.label + ' - MUST MATCH THE BASIC SYSTEM MD10240'
  ]);
  rev(o, R);
  o.push(';');
  o.push(';-------------------');
  o.push('; GLOBAL VARIABLES');
  o.push(';-------------------');
  o.push(';GV_WO[#]  - WO FRAME INDEX PER NEST ($P_UIFR[5] = G505)');
  o.push(';-------------------');
  o.push('; LOCAL VARIABLES');
  o.push(';-------------------');
  o.push('DEF INT LV_NEST');
  o.push('L_PAL_CHECK(1)');
  o.push(';-------------------------------------------');
  o.push('; THE FRAME CARRIES THE ROTARY ZERO OFFSET, NOT MOTION.');
  o.push('; LOAD THE OFFSET AND COMMAND ' + (orientLine(R) || 'THE ROTARY AXIS AT 0') + ': THE TABLE');
  o.push('; SWIVELS TO PRESENT THIS NEST\'S FACE.');
  o.push('; CTRANS WRITES X/Y/Z AND CLEARS EVERY OTHER COMPONENT,');
  o.push('; FINE OFFSETS INCLUDED. ROTARY AXES GET THEIR OWN TR LINE.');
  o.push(';-------------------------------------------');
  o.push('; VALUES WRITE ONLY ON A FRESH START (GV_STEP==0).');
  o.push('; A RESTART SKIPS THIS SO PROBED OFFSETS SURVIVE.');
  o.push('IF (GV_STEP==0)');
  var lastFace = -1;
  R.nests.forEach(function (nn) {
    if (!R.single && nn.face !== lastFace) {
      lastFace = nn.face;
      var first = (nn.face - 1) * R.npf + 1, last = Math.min(nn.face * R.npf, R.total);
      o.push('  ;-------------------------------------------');
      o.push('  ; FACE ' + nn.face + ': NESTS ' + first + (last > first ? '-' + last : ''));
      o.push('  ;-------------------------------------------');
    }
    o.push('  ;NEST ' + nn.n + ' G5' + ('0' + (nn.frame)).slice(-2) + (nn.notes ? ' - ' + nn.notes : '') + (nn.blank ? ' (BLANK X/Y/Z WRITTEN AS 0)' : ''));
    o.push('  LV_NEST=' + nn.n);
    o.push('  GV_WO[LV_NEST]=' + nn.frame);
    o.push('  $P_UIFR[GV_WO[LV_NEST]]=CTRANS(X,' + len(nn.x) + ',Y,' + len(nn.y) + ',Z,' + len(nn.z) + ')');
    if (R.trunnion !== 'NONE') o.push('  $P_UIFR[GV_WO[LV_NEST],' + R.trunnion + ',TR]=' + fix(nn.trun, 3));
    if (R.rotary !== 'NONE') o.push('  $P_UIFR[GV_WO[LV_NEST],' + R.rotary + ',TR]=' + fix(nn.rot, 3));
    o.push('  STOPRE');
  });
  o.push('ENDIF');
  o.push(';');
  o.push('RET');
  o.push(';');
  return text(o);
}

/* ---- probe program ---- */
/* opt (CMC measure only): { knum: '0', setv: 'LD_SETV' } - S_KNUM 0 = no correction,
   S_SETV given as a variable name. Without opt the output is the WO-correcting call. */
function cyc977(R, mvar, setv, setv0, setv1, sid, ma, opt) {
  var P = R.P, len = function (v) { return fix(v, R.U.dec); };
  opt = opt || {};
  var a = [];
  a[0] = String(mvar);            /* S_MVAR  1xx = WO correction            */
  a[1] = opt.knum || 'GV_WO[GV_NEST]';   /* S_KNUM  adjustable WO, fine (MC 5.1.7) */
  a[2] = '';                      /* S_KNUM1                                */
  a[3] = String(P.prnum);         /* S_PRNUM probe data set                 */
  a[4] = opt.setv || len(setv);   /* S_SETV  diameter / width               */
  a[5] = len(setv0);              /* S_SETV0 rectangle X                    */
  a[6] = len(setv1);              /* S_SETV1 rectangle Y                    */
  a[7] = len(P.fa);               /* S_FA    measurement path               */
  a[8] = len(P.fa);               /* S_TSA   safe area = S_FA               */
  a[9] = '0';                     /* S_STA1  starting angle                 */
  a[10] = len(sid);               /* S_ID    lowering for outside features  */
  a[11] = '0';                    /* S_SZA                                  */
  a[12] = '0';                    /* S_SZO                                  */
  a[13] = String(ma);             /* S_MA                                   */
  a[14] = '1';                    /* S_NMSP                                 */
  a[15] = '""';                   /* S_TNAME                                */
  for (var i = 16; i <= 24; i++) a[i] = '';   /* S_DLNUM..S_MCBIT */
  a[25] = '1';                    /* _DMODE  G17 inside the cycle           */
  a[26] = '0';                    /* _AMODE  no dimensional tolerance       */
  return 'CYCLE977(' + a.join(',') + ')';
}
/* opt (CMC measure only): { mvar: '0', knum: '0', setv: 'LD_SETV', ma: 1|2|3, md: 1|2 } */
function cyc978(R, opt) {
  var P = R.P, len = function (v) { return fix(v, R.U.dec); };
  opt = opt || {};
  var a = [];
  a[0] = opt.mvar || '100';       /* S_MVAR  surface, WO correction         */
  a[1] = opt.knum || 'GV_WO[GV_NEST]';   /* S_KNUM  adjustable WO, fine     */
  a[2] = '';                      /* S_KNUM1                                */
  a[3] = String(P.prnum);         /* S_PRNUM                                */
  a[4] = opt.setv || len(P.zNom); /* S_SETV  setpoint Z                     */
  a[5] = len(P.fa);               /* S_FA                                   */
  a[6] = len(P.fa);               /* S_TSA = S_FA                           */
  a[7] = String(opt.ma || 3);     /* S_MA    3rd axis of the plane (Z)      */
  a[8] = String(opt.md || 2);     /* S_MD    2 = negative direction         */
  a[9] = '1';                     /* S_NMSP                                 */
  a[10] = '""';                   /* S_TNAME                                */
  for (var i = 11; i <= 19; i++) a[i] = '';   /* S_DLNUM..S_MCBIT */
  a[20] = '1';                    /* _DMODE  G17 inside the cycle           */
  a[21] = '0';                    /* _AMODE                                 */
  return 'CYCLE978(' + a.join(',') + ')';
}

  o.push('M19');
  o.push(';');
  var mOn = P.probeOnM;
  if (P.health) {
    o.push(';--- PROBE HEALTH CHECK (ONCE PER JOB, FIRST ACTIVE NEST) ---');
    o.push('IF (GV_PROBE_CHK==0)');

    if (mOn) o.push('  ' + mOn + '                              ;probe on');
    o.push('  G0 X=' + len(P.hX) + ' Y=' + len(P.hY));
    o.push('  G0 Z=' + len(P.hStartZ));
    o.push('  G1 MEAS=1 Z=' + len(P.hTargetZ) + ' F' + feed(P.hFeed));
    o.push('  STOPRE');
    o.push('  IF ($AC_MEA[1]==0)');

    o.push('      M0');
    o.push('      STOPRE');
    o.push('    ENDLOOP');
    o.push('  ENDIF');
    o.push('  ' + ret);
    o.push('  GV_PROBE_CHK=1');
    o.push('ENDIF');
    o.push(';');
  }

    o.push('G54 D1');
    if (mOn) o.push(mOn + '                                ;probe on');
    o.push('G0 X=' + len(P.chkLoc.x) + ' Y=' + len(P.chkLoc.y));
    o.push('G0 Z=' + len(P.chkLoc.z));
    o.push('G1 MEAS=1 Z=' + len(P.chkTarget) + ' F' + feed(P.feed));
    o.push('STOPRE');
    o.push('IF ($AC_MEA[1]==0)');
    o.push('  GV_NEST_STATUS[GV_NEST]=2');
    o.push('  MSG("NEST " << GV_NEST << " - NO PART")');

    o.push(ret);
    o.push('IF (GV_NEST_STATUS[GV_NEST]<>1) GOTOF PROBE_END');
    o.push(';');
  }
  if (!P.skipZ) {
    o.push(';--- Z DATUM: SURFACE (CYCLE978) ---');
    o.push('G54 D1');
    o.push('G0 X=' + len(P.zLoc.x) + ' Y=' + len(P.zLoc.y));
    o.push('G0 Z=' + len(P.zLoc.z));
    o.push(cyc978(R));
    o.push('STOPRE');
    tolCheck(o, R, 'Z', 'SURFACE');
    o.push(ret);
    o.push(';');
  }
  if (P.xyMethod !== 'NONE') {
    o.push(';--- XY DATUM: ' + P.xyMethod + ' ---');
    o.push('G54 D1');
    o.push('G0 X=' + len(P.appX) + ' Y=' + len(P.appY));
    if (P.outside) {
      o.push('G0 Z=' + len(P.xyStartZ) + '                    ;start above the feature');
      o.push(';  THE CYCLE LOWERS TO MEASURING HEIGHT ITSELF: S_ID = ' + len(P.sid));
    } else {
      o.push('G0 Z=' + len(P.xyStartZ));

        o.push(cyc977(R, 104, w, 0, 0, sid, 1));
        o.push('STOPRE');
        tolCheck(o, R, 'X', 'RIB');
        o.push(';--- Y RIB (STARTS ABOVE THE CENTER, MC 4.3.10) ---');
        o.push(cyc977(R, 104, h, 0, 0, sid, 2));
        o.push('STOPRE');
        tolCheck(o, R, 'Y', 'RIB');
        break;
      case 'BORE':
        o.push(cyc977(R, 101, d, 0, 0, 0, 1));
        o.push('STOPRE');
        tolCheck(o, R, 'X', 'BORE'); tolCheck(o, R, 'Y', 'BORE');
        break;
      case 'BOSS':
        o.push(cyc977(R, 102, d, 0, 0, sid, 1));
        o.push('STOPRE');
        tolCheck(o, R, 'X', 'BOSS'); tolCheck(o, R, 'Y', 'BOSS');
        break;
      case 'RECT POCKET':
        o.push(cyc977(R, 105, 0, w, h, 0, 1));
        o.push('STOPRE');
        tolCheck(o, R, 'X', 'POCKET'); tolCheck(o, R, 'Y', 'POCKET');
        break;
      case 'RECT SPIGOT':
        o.push(cyc977(R, 106, 0, w, h, sid, 1));
        o.push('STOPRE');
        tolCheck(o, R, 'X', 'SPIGOT'); tolCheck(o, R, 'Y', 'SPIGOT');
        break;
    }
    o.push(';');
  }
  o.push('PROBE_END:');
  o.push(';--- SAFE Z RETRACT ---');
  o.push(ret);
  o.push(';');
  o.push('RET');
  o.push(';');
  return text(o);
}

/* ---- CMC (cut / measure / cut) programs ---- */
function cmcNum(v, R) { return compact(v, R.U.dec + 2); }
/* a constant inside an expression: negative values in brackets */
function cmcVal(v, R) { return v < 0 ? '(' + cmcNum(v, R) + ')' : cmcNum(v, R); }
/* "GOTO? LABEL" -> GOTOF / GOTOB from where the label is */
function cmcJumps(o) {
  var at = {};
  o.forEach(function (l, i) { var m = /^([A-Z_][A-Z0-9_]*):$/.exec(l); if (m) at[m[1]] = i; });
  return o.map(function (l, i) {
    return l.replace(/GOTO\? ([A-Z_][A-Z0-9_]*)/, function (all, lab) {
      if (!(lab in at)) throw new Error('CMC: no label ' + lab);
      return (at[lab] > i ? 'GOTOF ' : 'GOTOB ') + lab;
    });
  });
}
function cmcRLines(b, total) {
  return [
    ';  R' + b + '-R' + (b + CMC_BLOCK - 1) + ' (R PARAMETERS ARE KEPT THROUGH POWER-OFF):',
    ';   R' + b + ' PASS: 0 IDLE, 1 FIRST CUT, 2 FIRST CUT DONE, 3 CORRECTION SET,',
    ';        4 FINAL CUT, 5 FINAL CUT DONE, 6 VERIFY, 9 NEST DONE',
    ';   R' + (b + 1) + ' NEST   R' + (b + 2) + ' T NUMBER   R' + (b + 3) + ' SISTER (DUPLO)   R' + (b + 4) + ' EDGE',
    ';   R' + (b + 5) + ' WEAR ON THE TOOL NOW   R' + (b + 6) + ' LAST MEASURED',
    ';   R' + (b + 7) + ' CORRECTION WEAR   R' + (b + 8) + ' RE-CUTS',
    ';   R' + (b + 9) + ' OPERATOR DECISION AT A HOLD (M0)',
    ';   R' + (b + 10) + '-R' + (b + 9 + total) + ' RESULT PER NEST 1-' + total + ': 0 NOT RUN, 1 OK, 2 OUT ACCEPTED, 3 SCRAP'
  ];
}
function fCmcMeas(R, s) {

    '; PART NUMBER  : ' + (R.header.part || 'XXXX'),
    '; UNITS        : ' + U.label
  ]);

  o.push(';');
  o.push(';  CALLED BY   : ' + cmcName(s.step) + ' AFTER THE FIRST CUT (LD_SETV = EXPECTED)');
  o.push(';                AND TO VERIFY (LD_SETV = NOMINAL)');
  o.push(';  FEATURE     : ' + d.text + (d.kind === 'wall' ? ', MATERIAL ON THE ' + c.side + ' SIDE' : ''));
  o.push(';  CYCLE       : CYCLE' + d.cyc + ' S_MVAR=' + mvar + ' S_KNUM=0: MEASURE ONLY (MC 5.1.' + (d.cyc === 977 ? '7' : '5') + ')');
  o.push(';  RESULT      : LD_M = _OVR[4] (ACTUAL VALUE)');
  o.push(';  S_FA        : ' + len(P.fa) + ' (SEARCH DISTANCE); S_TSA = S_FA');
  o.push(';  CLEANING    : ' + (c.clean === 'M CODE' ? c.cleanM : c.clean === 'M0' ? 'M0 - OPERATOR CLEANS' : 'NONE'));
  o.push(';-------------------------------------------');
  o.push(';');
  o.push(';--- TOOL CALL ---');
  o.push('T=' + q(P.tool) + ' M6');
  o.push(ret);
  o.push('CYCLE800()                         ;deselect any active swivel plane');
  o.push('TRAFOOF                            ;cancel any active transformation');
  o.push('G54 D1');
  var ol = orientLine(R);
  if (ol) o.push(pad(ol, 35) + ';swivel to this nest\'s face (angle is in the WO)');
  o.push('M19');
  if (c.clean === 'M CODE') o.push(pad(c.cleanM, 35) + ';cleaning');
  if (c.clean === 'M0') {
    o.push('MSG("CMC STEP ' + s.step + ' NEST " << GV_NEST << ": CLEAN THE PROBE AND THE FEATURE, THEN CYCLE START")');
    o.push('M0');

      o.push(';  THE CYCLE LOWERS TO MEASURING HEIGHT ITSELF: S_ID = ' + len(c.z - c.appZ));

    o.push('G1 Z=' + len(c.z) + ' F' + feed + '                 ;lower to probe depth');

  } else {
    o.push('G0 X=' + len(c.x) + ' Y=' + len(c.y));
    o.push('G0 Z=' + len(c.appZ));
    o.push('G1 Z=LD_SETV+' + len(P.clrIn) + ' F' + feed + '        ;start ' + len(P.clrIn) + ' above the face');
    o.push(cyc978(R, { mvar: '0', knum: '0', setv: 'LD_SETV', ma: 3, md: 2 }));
  }
  o.push('STOPRE');
  o.push('LD_M=_OVR[4]                       ;actual value');
  o.push(';--- SAFE Z RETRACT ---');
  o.push(ret);
  o.push(';');
  o.push('RET');
  o.push(';');
  return text(o);

    o.push('LV_L=LV_L << ",' + n(c.nom) + '," << LV_E << "," << ROUND(LV_M*' + rnd + ')/' + rnd + ' << "," << ROUND((LV_M-LV_E)*' + rnd + ')/' + rnd);
    o.push('LV_L=LV_L << "," << LV_WB << "," << ROUND(LV_W*' + rnd + ')/' + rnd + ' << "," << ' + pass + ' << "," << ' + r(8) + ' << ",' + result + '"');

      o.push(';out of tolerance, material left: re-cut (max ' + c.maxTry + ')');
      o.push('IF (' + r(8) + '>=' + c.maxTry + ') GOTO? CMC_HOLD2');
      o.push('IF (ABS(LV_W)>' + n(c.limit) + ') GOTO? CMC_HOLD2');
      o.push(r(7) + '=LV_W ' + r(8) + '=' + r(8) + '+1 ' + r(0) + '=3');
      o.push('STOPRE');
      log('RECUT', 'LV_PS');
      o.push('GOTO? CMC_BACK');
      hold('CMC_HOLD2', 'NOMINAL ' + n(c.nom), ['ACCEPT', 'CMC_OUT'], 'CMC_VERIFY');
    }
  }
  o.push('CMC_SISTER:');
  o.push(';--- THE RECORDED SISTER IS DISABLED OR GONE: ANOTHER SISTER IS IN ---');
  o.push(';--- THE SPINDLE. THIS NEST AGAIN FROM THE FIRST CUT.               ---');
  log('SISTER', '"BACK"');
  if (s.meas) {
    if (s.measAlways) o.push('L_TOOL_MEAS(' + tool + ')');
    else {
      o.push('GETEXET(LV_T)');
      o.push('IF (($TC_TP8[LV_T] B_AND 128)==0)');
      o.push('  L_TOOL_MEAS(' + tool + ')');
      o.push('ENDIF');
    }
  }
  o.push('C_P1_LOAD_WO');
  o.push('GOTO? CMC_CUT1');
  o.push('CMC_OK:');
  log('OK', 'LV_PS');
  o.push(res + '=1');
  o.push('GOTO? CMC_END');
  if (c.verify) {
    o.push('CMC_OUT:');
    log('OUT', 'LV_PS');
    o.push(res + '=2');
    o.push('GOTO? CMC_END');
  }
  o.push('CMC_SCRAP:');
  log('SCRAP', 'LV_PS');
  o.push(res + '=' + CMC_RES.SCRAP);
  o.push('CMC_END:');
  o.push(';--- CUTTER BACK IN THE SPINDLE FOR L_RUN_NESTS (BREAK CHECK, SETPIECE) ---');
  back();
  zeroRecorded('ALWAYS 0 AFTER THE NEST');
  o.push('SETPIECE(0)                        ;the probe and the extra passes are not counted');
  o.push(r(0) + '=9');
  o.push('STOPRE');
  o.push('CMC_RET:');
  o.push('MSG()');
  o.push('RET');
  o.push(';');
  return text(cmcJumps(o));
}
function fCmcBack(R) {
  var o = [];
  o.push('PROC C_P1_CMC_BACK(STRING[25] LD_TNAME, INT LD_DUPLO, INT LD_TNO, INT LD_MODE, VAR INT LD_CHG)');
  hdr(o, R, 'C_P1_CMC_BACK.SPF', 'CMC - PUT THE RECORDED CUTTER BACK IN THE SPINDLE', []);
  rev(o, R);
  o.push(';');
  o.push(';  LD_TNAME : TOOL NAME           LD_DUPLO : RECORDED SISTER');
  o.push(';  LD_TNO   : RECORDED T NUMBER   LD_MODE  : 0 = TCA, 1 = T M6 BY NAME');
  o.push(';  LD_CHG   : RETURNS 1 WHEN THE SPINDLE HOLDS ANOTHER SISTER');
  o.push(';  TCA (NC: TOOL SELECTION/CHANGE IRRESPECTIVE OF TOOL STATUS) LOADS');
  o.push(';  THE RECORDED SISTER, SO IT IS ONLY USED WHEN THAT SISTER STILL');
  o.push(';  EXISTS (GETT) AND IS NOT DISABLED ($TC_TP8 BIT 2). OTHERWISE A');
  o.push(';  NORMAL T M6 BY NAME LOADS THE ACTIVE SISTER.');
  o.push(';  TO CONFIRM ON THE MACHINE: TCA LOADS THAT SISTER WITH THE NORMAL');
  o.push(';  TOOL CHANGE.');
  o.push(';-------------------------------------------');
  o.push('DEF INT LV_NOW, LV_T');
  o.push('LD_CHG=0');
  o.push('STOPRE');
  o.push('GETEXET(LV_NOW)');
  o.push('IF (LV_NOW==LD_TNO) GOTOF _CB_END');
  o.push('CYCLE800()');
  o.push('TRAFOOF');
  o.push(retract(R.clr));
  o.push('IF (LD_MODE==1) GOTOF _CB_TM6');
  o.push('LV_T=GETT(LD_TNAME,LD_DUPLO)');
  o.push('IF (LV_T<>LD_TNO) GOTOF _CB_TM6');
  o.push('IF (($TC_TP8[LV_T] B_AND 4)>0) GOTOF _CB_TM6');
  o.push('TCA(LD_TNAME,LD_DUPLO,' + R.cmcCarrier + ')');
  o.push('STOPRE');
  o.push('GOTOF _CB_CHECK');
  o.push('_CB_TM6:');
  o.push('T=LD_TNAME');
  o.push('M6');
  o.push('STOPRE');
  o.push('_CB_CHECK:');
  o.push('GETEXET(LV_NOW)');
  o.push('IF (LV_NOW<>LD_TNO)');
  o.push('  LD_CHG=1');
  o.push('ENDIF');
  o.push('_CB_END:');
  o.push('RET');
  o.push(';');
  return text(o);
}
function fCmcLog(R) {
  var o = [];
  o.push('PROC C_P1_CMC_LOG(STRING[160] LD_LINE)');
  hdr(o, R, 'C_P1_CMC_LOG.SPF', 'CMC - ONE LINE INTO CMC_LOG.SPF', []);

  o.push(';');
  o.push(';  WRITES "DATE,TIME," + LD_LINE INTO CMC_LOG.SPF IN THE DIRECTORY OF');

  o.push(';   RESULT: CUT, RECUT, OK, OUT, SCRAP, HOLD, SISTER');
  o.push(';  STEP LINE: DATE,TIME,STEP,SUMMARY,OK=n,OUT=n,SCRAP=n');
  o.push(';-------------------------------------------');

    o.push('IF (' + p[0] + '<10)');

    o.push('ENDIF');
  });
  o.push('WRITE(LV_ERR,"CMC_LOG_SPF","" << $A_YEAR << "-" << LV_MO << "-" << LV_DY << "," << LV_HH << ":" << LV_MM << ":" << LV_SS << "," << LD_LINE)');
  o.push('IF (LV_ERR<>0)');
  o.push('  MSG("CMC LOG WRITE ERROR: " << LV_ERR)');
  o.push('ENDIF');
  o.push('RET');

}
function fCmcClear(R) {
  var o = [];
  hdr(o, R, 'C_P1_CMC_CLEAR.SPF', 'CMC - WEAR LEFT BY A STOPPED CMC BACK TO 0, R BLOCKS CLEARED', [
    '; PART NUMBER  : ' + (R.header.part || 'XXXX')
  ]);
  rev(o, R);
  o.push(';');
  o.push(';  A_P1 RUNS THIS ON A FRESH START (GV_STEP==0). RUN IT BY HAND WHEN A');
  o.push(';  JOB IS ABANDONED PART-WAY THROUGH A CMC STEP: WEAR IS ONLY ON THE');
  o.push(';  CUTTER WHILE THE PASS IS 1 (FIRST CUT) OR 4 (FINAL CUT).');
  o.push(';  GETT CHECKS THE RECORDED SISTER STILL HAS THE RECORDED T NUMBER.');
  o.push(';-------------------------------------------');
  o.push('DEF INT LV_T, LV_D, LV_DUP, LV_I');
  R.cmcList.forEach(function (s) {
    var b = s.cmcBase, c = s.cmc;
    o.push(';--- STEP ' + s.step + ': R' + b + '-R' + (b + CMC_BLOCK - 1) + ', ' + s.tool + ' D' + c.edge + ' $TC_' + c.field + ' ---');
    o.push('IF (R' + b + '>=1) AND (R' + b + '<=6) AND (R' + (b + 2) + '>0)');
    o.push('  LV_DUP=R' + (b + 3));
    o.push('  LV_T=GETT(' + q(s.tool) + ',LV_DUP)');
    o.push('  IF (LV_T==R' + (b + 2) + ')');
    o.push('    LV_D=' + c.edge);
    o.push('    $TC_' + c.field + '[LV_T,LV_D]=0');
    o.push('  ENDIF');
    o.push('ENDIF');
    o.push('LV_I=' + b);
    o.push('WHILE (LV_I<=' + (b + CMC_BLOCK - 1) + ')');
    o.push('  R[LV_I]=0');
    o.push('  LV_I=LV_I+1');
    o.push('ENDWHILE');
  });
  o.push('STOPRE');
  o.push('RET');
  o.push(';');
  return text(o);
}
/* A_P1 after a CMC step: count the nest results, scrap nests off (status 3), one log line */
function cmcAfter(o, R, s) {
  var b = s.cmcBase, N = R.total;
  o.push(';--- CMC RESULTS R' + (b + 10) + '-R' + (b + 9 + N) + ': SCRAP NESTS OFF FOR THE LATER STEPS (STATUS ' + CMC_SCRAP_STATUS + ') ---');
  o.push('LV_CMC_OK=0 LV_CMC_OUT=0 LV_CMC_SCRAP=0');
  o.push('LV_I=1');
  o.push('WHILE (LV_I<=' + N + ')');
  o.push('  IF (R[' + (b + 9) + '+LV_I]==' + CMC_RES.OK + ')');
  o.push('    LV_CMC_OK=LV_CMC_OK+1');
  o.push('  ENDIF');
  o.push('  IF (R[' + (b + 9) + '+LV_I]==' + CMC_RES.OUT + ')');
  o.push('    LV_CMC_OUT=LV_CMC_OUT+1');
  o.push('  ENDIF');
  o.push('  IF (R[' + (b + 9) + '+LV_I]==' + CMC_RES.SCRAP + ')');
  o.push('    LV_CMC_SCRAP=LV_CMC_SCRAP+1');
  o.push('    IF (GV_NEST_STATUS[LV_I]==1)');
  o.push('      GV_NEST_STATUS[LV_I]=' + CMC_SCRAP_STATUS);
  o.push('    ENDIF');
  o.push('  ENDIF');
  o.push('  LV_I=LV_I+1');
  o.push('ENDWHILE');
  o.push('LV_CMC_L="' + s.step + ',SUMMARY,OK=" << LV_CMC_OK << ",OUT=" << LV_CMC_OUT << ",SCRAP=" << LV_CMC_SCRAP');
  o.push('C_P1_CMC_LOG(LV_CMC_L)');
}

  o.push('IF (GV_NEST<1) OR (GV_NEST>' + R.total + ')');

function fMain(R) {

  o.push(';GV_NEST_STATUS[#] - 0 OFF, 1 RUNNING, 2 NO PART, 100+STEP FAILED');
  if (cmc) o.push(';                    ' + CMC_SCRAP_STATUS + ' CMC SCRAP (SET BY A_P1 AFTER THE CMC STEP)');

  o.push(';GV_SKIP           - 1 = EVERY NEST OFF, SKIP THE STEP');

  o.push('DEF REAL LV_STEP_START             ;STEP START TIME (SECONDS)');
  o.push('DEF REAL LV_CYCLE_TIME             ;CYCLE TIME (SECONDS)');

    o.push('DEF INT LV_CMC_OUT                 ;CMC NESTS OUT OF TOLERANCE, ACCEPTED');
    o.push('DEF INT LV_CMC_SCRAP               ;CMC NESTS SCRAP');
    o.push('DEF STRING[160] LV_CMC_L           ;CMC LOG LINE');
    o.push('EXTERN C_P1_CMC_LOG(STRING[160])   ;WKS SUB-PROGRAM WITH A PARAMETER (NC 4.2.3.2)');
  }
  o.push(';----------------');
  o.push('; SUB PROGRAMS');
  o.push(';----------------');

  o.push(';C_P1_NESTS    - SET NEST STATUS (FRESH START ONLY)');

    o.push(';' + pad(cmcName(s.step) + '_M', 14) + '- CMC STEP ' + s.step + ': MEASURE ONLY');

  o.push(';L_TOOL_BRK    - BLUM LASER BREAKAGE CHECK');
  o.push(';L_STEP_LOG    - STEP TIME + DATA LOGGING');
  o.push(';L_DATA_LOG    - PRODUCTION DATA LOG LINE');
  o.push(';L_STEP_ERROR  - HOLD IF GV_STEP IS UNKNOWN');
  o.push(';');
  o.push('GROUP_BEGIN(0,"SETUP",0,0)');
  o.push(pad(U.g, 35) + ';' + (R.units === 'INCH' ? 'INCH' : 'METRIC') + ' - SAME AS THE BASIC SYSTEM');
  o.push(';=== ' + modeDesc(R) + ' ===');
  o.push(';--------------------');

  }

    o.push(';--------------------');
    o.push(';  TURN OFF A NEST');
    o.push(';--------------------');
    o.push('; Delete the ; in front of a nest below to skip');
    o.push('; it this run (no probing, no machining).');
    o.push(';--------------------');
    for (var n = 1; n <= N; n++) o.push(';GV_NEST_STATUS[' + n + ']=0');
  }
  o.push('STOPRE');
  o.push(';--------------------');
  o.push(';   HOME POSITION');
  o.push(';--------------------');
  o.push('C_P1_HOME');
  o.push('GROUP_END(0,0)');
  o.push('GROUP_BEGIN(0,"STEP LIST",0,0)');
  o.push(';=====================');
  o.push(';     STEP LIST');
  o.push(';=====================');

    o.push(';STEP ' + R.probeStep.step + ': PROBE');
    o.push(';   PROG: ' + R.probeStep.program);
    o.push(';   TOOL: ' + R.P.tool);
    o.push(';');
  }

    o.push(';STEP ' + s.step + ':');

    o.push(';   TOOL: ' + s.tool);

           ' SETPIECE=' + (s.setpiece ? s.life : 'OFF') + (s.debug ? ' DEBUG M1' : ''));

      o.push(';   CMC: ' + s.cmc.feature + ' ' + cmcNum(s.cmc.nom, R) + ' +' + cmcNum(s.cmc.tolP, R) + '/-' + cmcNum(s.cmc.tolM, R) +
             ', ' + cmcName(s.step) + ', R' + s.cmcBase + '-R' + (s.cmcBase + CMC_BLOCK - 1));
    }
    o.push(';');
  });
  o.push('GROUP_END(0,0)');
  o.push(';--------------------');
  o.push(';      RE-START');
  o.push(';--------------------');
  o.push(';GV_STEP<>0 MEANS THE LAST RUN DID NOT FINISH: THE JOB');
  o.push(';RESUMES AT THAT STEP AND NEST. A FRESH SISTER TOOL IS');
  o.push(';MEASURED AUTOMATICALLY.');
  o.push('LV_CYCLE_START=$A_HOUR*3600+$A_MINUTE*60+$A_SECOND');

  o.push('  M0');
  o.push('  STOPRE');
  o.push('ENDIF');
  if (R.probeStep.enabled) o.push('IF (GV_STEP==' + R.probeStep.step + ') GOTOF STEP' + R.probeStep.step);
  R.steps.forEach(function (s) { o.push('IF (GV_STEP==' + s.step + ') GOTOF STEP' + s.step); });
  o.push('L_STEP_ERROR');
  if (R.probeStep.enabled) {
    if (R.single) singleProbeStep(o, R); else probeStep(o, R);
  }
  R.steps.forEach(function (s) { cutStep(o, R, s); });
  if (R.single) singleEnd(o, R); else tombEnd(o, R);
  return text(o);
}
function stepBanner(o, s, l2, l3) {
  o.push(';================================');

function probeStep(o, R) {

  aBound(o, R);

  o.push('IF (GV_NEST_STATUS[GV_NEST]==1)');
  o.push('  C_P1_LOAD_WO');
  o.push('  ' + R.probeStep.program);
  o.push('  STOPRE');

  o.push('GV_NEST=GV_NEST+1');
  o.push('IF (GV_NEST<=' + N + ') GOTOB STEP' + s + '_NEST');
  o.push(';---- STEP ' + s + ' END ----');

function singleProbeStep(o, R) {

function cutStep(o, R, s) {
  var U = R.U, N = R.total;
  stepBanner(o, s.step, q(s.tool), s.program);
  o.push('GV_STEP=' + s.step);
  o.push('STEP' + s.step + ':');
  o.push(';--- resume at the nest that was running, or start at 1 ---');
  aBound(o, R);
  o.push('MSG("STEP ' + s.step + ' / ' + R.lastStep + ' - ' + s.tool + '")');
  o.push('GV_NESTS_CUT=0 GV_BRK_COUNT=0');
  aStepStart(o);
  o.push('L_SKIP_CHECK(' + N + ')');
  o.push('IF (GV_SKIP==1) GOTOF STEP' + s.step + '_DONE');
  o.push('L_TOOL_LOAD(' + q(s.tool) + ')');
  /* a CMC step runs its CMC program per nest in place of the B program */
  o.push('L_RUN_NESTS(' + [q(s.tool), fix(s.brkTol, U.dec), N, q(s.cmc ? cmcName(s.step) : s.program), s.meas ? 1 : 0, s.measAlways ? 1 : 0,

function tombEnd(o, R) {

  o.push('  IF (GV_NEST_STATUS[LV_I]==1)');

  o.push('C_P1_HOME');
  o.push('LV_I=1');
  o.push('WHILE (LV_I<=' + N + ')');
  o.push('  IF (GV_NEST_STATUS[LV_I]==0)');
  o.push('    MSG("NEST " << LV_I << " = INACTIVE (OPERATOR)")');
  o.push('    M0');
  o.push('    STOPRE');
  o.push('  ENDIF');
  o.push('  IF (GV_NEST_STATUS[LV_I]==2)');
  o.push('    MSG("NEST " << LV_I << " = NO PART OR OUT OF TOLERANCE (PROBE)")');
  o.push('    M0');
  o.push('    STOPRE');
  o.push('  ENDIF');
  o.push('  IF (GV_NEST_STATUS[LV_I]>=100)');

  o.push('    STOPRE');

    o.push('    M0');
    o.push('    STOPRE');
    o.push('  ENDIF');
  }
  o.push('  LV_I=LV_I+1');
  o.push('ENDWHILE');

  o.push(';===================');

  o.push('  LV_GOOD_PARTS=1');

  o.push('C_P1_HOME');
  o.push('IF (GV_NEST_STATUS[1]==1)');
  o.push('  MSG("CYCLE COMPLETE - GOOD PART - " << LV_CYCLE_TIME << " SEC")');

  o.push('  IF (GV_NEST_STATUS[1]>=100)');

  o.push('  ELSE');
  o.push('    IF (GV_NEST_STATUS[1]==2)');

}

var CRC_TABLE = (function () {

    central.push(new Uint8Array([].concat(u32(0x02014b50), u16(20), u16(20), u16(0), u16(0), u16(dosTime), u16(dosDate),
      u32(crc), u32(data.length), u32(data.length), u16(name.length), u16(0), u16(0), u16(0), u16(0),
      u32(0), u32(offset))), name);

/* ---- messages ---- */
function showMsgs(kind, title, items) {

function clearMsgs() { $('#msgs').innerHTML = ''; }
function tabOf(path) {

}
function showTab(name) {
  document.querySelectorAll('nav.tabs button').forEach(function (b) { b.classList.toggle('active', b.dataset.tab === name); });
  document.querySelectorAll('.tab').forEach(function (t) { t.classList.toggle('active', t.id === 'tab-' + name); });
}
function gotoPath(path) {
