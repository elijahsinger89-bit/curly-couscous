/* ---- page layout: each tab is a 12-column grid of panels on the light canvas.
   An h2 starts a panel (head = the h2 and its tags, body = what follows up to the next h2).
   Cards (.card2) and notices (.msg) stay panels / bars of their own. data-span on the h2 = columns. */
function setTab(name, html) {
  var el = $('#tab-' + name);
  el.innerHTML = html;
  var kids = Array.prototype.slice.call(el.childNodes), body = null;
  kids.forEach(function (k) {
    if (k.nodeType === 3 && !k.textContent.trim()) { el.removeChild(k); return; }
    if (k.nodeType === 1 && k.tagName === 'H2') {
      var panel = document.createElement('div'), ph = document.createElement('div');
      panel.className = 'panel'; ph.className = 'ph';
      if (k.dataset.span) panel.dataset.span = k.dataset.span;
      body = document.createElement('div'); body.className = 'pb';
      el.insertBefore(panel, k);
      ph.appendChild(k); panel.appendChild(ph); panel.appendChild(body);
      return;
    }
    if (k.nodeType === 1 && (k.classList.contains('card2') || k.classList.contains('msg'))) { body = null; return; }
    if (!body) {
      var p2 = document.createElement('div');
      p2.className = 'panel';
      body = document.createElement('div'); body.className = 'pb';
      p2.appendChild(body);
      el.insertBefore(p2, k);
    }
    body.appendChild(k);
  });
}
var TAB_INFO = {
  config: ['01', 'Config & steps', 'Machine, nests and step sequence', 'Header, machine type, nest count and the steps the framework runs on every nest.'],
  probing: ['02', 'Probing', 'Probe step and checks', 'How each nest is found and checked before the first cut. Click a box to see it on the picture.'],
  wcs: ['03', 'Work offsets', 'Nest work offsets', 'Machine position and table angle of every nest. Nest 1 = G505.'],
  output: ['04', 'Output', 'Preview and generate', 'Read every NC file before it goes to the machine, then download the zip.'],
  cmc: ['05', 'CMC', 'Cut / measure / cut', 'Measuring cards for the steps with CMC ticked on tab 1.']
};
function setHead(name) {
  var t = TAB_INFO[name] || TAB_INFO.config;
  $('#phNum').textContent = t[0];
  $('#phEyebrow').textContent = t[1];
  $('#phTitle').textContent = t[2];
  $('#phSub').textContent = t[3];
}

function renderAll() {
  renderConfig(); renderProbing(); renderWcs(); renderOutput(); renderCmc();
  var part = S.ascii(job.header.part);
  $('#jobLabel').textContent = part || 'untitled';
}

/* ---- messages ---- */
function showMsgs(kind, title, items) {
  var h = '<div class="msg ' + kind + '"><b>' + esc(title) + '</b>';
  if (items && items.length) h += '<ul>' + items.map(function (e) {
    return '<li>' + (e.path ? '<a href="#" data-goto="' + esc(e.path) + '">' + esc(e.msg) + '</a>' : esc(e.msg || e)) + '</li>'; }).join('') + '</ul>';
  h += '</div>';
  $('#msgs').innerHTML = h;
  if ($('#msgs').getBoundingClientRect().top < $('header.nav').offsetHeight) $('#msgs').scrollIntoView({ behavior: 'smooth', block: 'start' });
}
function clearMsgs() { $('#msgs').innerHTML = ''; }
function tabOf(path) {
  if (/^probing\./.test(path)) return 'probing';
  if (/^cmcR\./.test(path) || /^steps\.\d+\.cmc[A-Z]/.test(path)) return 'cmc';
  if (/^wcs\./.test(path)) return 'wcs';
  return 'config';
}
function showTab(name) {
  var was = document.querySelector('.tab.active');
  document.querySelectorAll('nav.tabs button').forEach(function (b) { b.classList.toggle('active', b.dataset.tab === name); });
  document.querySelectorAll('.tab').forEach(function (t) { t.classList.toggle('active', t.id === 'tab-' + name); });
  setHead(name);
  if (!was || was.id !== 'tab-' + name) window.scrollTo(0, 0);
}
function gotoPath(path) {
  showTab(tabOf(path));
  var el = document.querySelector('[data-path="' + path + '"]');
  if (el) { el.focus(); el.scrollIntoView({ block: 'center' }); }
}

/* ---- validation flow ---- */
function runValidate() {
  var v = S.validate(job);
  errPaths = {};
  v.errors.forEach(function (e) { if (!errPaths[e.path]) errPaths[e.path] = e.msg; });
  renderAll();
  return v;
}
/* generic modal: paragraphs of plain text, buttons [{label, value, primary}];
   Escape answers escValue */
function askChoice(title, paras, buttons, escValue) {
  return new Promise(function (resolve) {
    var d = $('#dlg');
    $('#dlgTitle').textContent = title;
    var body = $('#dlgBody'), btns = $('#dlgBtns');
    body.innerHTML = ''; btns.innerHTML = '';
    paras.forEach(function (t) { var p = document.createElement('p'); p.textContent = t; body.appendChild(p); });
    function done(v) { d.close(); d.oncancel = null; btns.innerHTML = ''; resolve(v); }
    buttons.forEach(function (b) {
      var el = document.createElement('button');
      el.type = 'button'; el.textContent = b.label; el.dataset.choice = b.value;
      if (b.primary) el.className = 'primary';
      el.onclick = function () { done(b.value); };
      btns.appendChild(el);
    });
    d.oncancel = function (ev) { ev.preventDefault(); done(escValue); };
    d.showModal();
  });
}
function askBlank(list) {
  return askChoice('Blank work offsets', [
    'Nest' + (list.length > 1 ? 's ' : ' ') + list.join(', ') + ' ' + (list.length > 1 ? 'have' : 'has') + ' a blank X, Y or Z work offset.',
    'Those X / Y / Z values will be written as 0.000 = machine zero, not the part. In a multi-nest job that is almost always a mistake.',
    'Generate anyway?'
  ], [
    { label: 'No – stop', value: 'no', primary: true },
    { label: 'Yes – write 0.000', value: 'yes' }
  ], 'no').then(function (v) { return v === 'yes'; });
}

/* ---- step builder ---- */
function namesMsg(r) {
  if (!r.unnamed.length) return '';
  var m = ' Step' + (r.unnamed.length > 1 ? 's ' : ' ') + r.unnamed.join(', ') + ' got no program name: B_[part]_[step]_[machine] would be over 24 characters.';
  m += r.maxMachine > 0 ? ' With this part number the machine name can be at most ' + r.maxMachine + ' characters.'
    : ' The part number is too long for the pattern; type these names by hand.';
  return m;
}
function runBuilder() {
  var check = S.buildSteps(job, 'overwrite');
  if (check.error) { showMsgs('bad', 'Step builder: ' + check.error); return Promise.resolve(null); }
  var withData = job.steps.filter(function (s) { return !S.isBlank(s.tool) || !S.isBlank(s.program) || !S.isBlank(s.brkTol); }).length;
  var b = job.builder;
  var range = 'steps ' + S.num(b.first) + ' to ' + S.num(b.last) + ' by ' + S.num(b.inc) + ' (' + check.count + ' rows)';
  var gate = S.hasStepData(job) ? askChoice('Step table already has data', [
    'The table has ' + job.steps.length + ' row' + (job.steps.length === 1 ? '' : 's') + ', ' + withData + ' with a tool, program or tolerance filled in.',
    'Overwrite all: replace every row with ' + range + '. Everything typed in the table is lost.',
    'Keep existing: leave every current row exactly as it is, add the steps of the range that are missing, and sort by step number.'
  ], [
    { label: 'Overwrite all', value: 'overwrite' },
    { label: 'Keep existing, add missing', value: 'keep', primary: true },
    { label: 'Cancel', value: 'cancel' }
  ], 'cancel') : Promise.resolve('overwrite');
  return gate.then(function (mode) {
    if (mode === 'cancel') { showMsgs('warn', 'Step builder cancelled. Nothing changed.'); return null; }
    var r = S.buildSteps(job, mode);
    if (r.error) { showMsgs('bad', 'Step builder: ' + r.error); return null; }
    job.steps = r.steps; job.probeStep.program = r.probeProgram;
    changed(); errPaths = {}; renderAll(); showTab('config');
    var msg = (mode === 'keep' ? 'Kept every existing row and added ' + r.added + ' of ' + range + '.'
      : 'Step table rebuilt: ' + range + '.') + ' Fill in tool, breakage tolerance and life per row.' + namesMsg(r);
    showMsgs(r.unnamed.length ? 'warn' : 'ok', msg);
    return mode;
  });
}
function build(download) {
  var v = runValidate();
  if (v.errors.length) {
    showMsgs('bad', 'Cannot generate. Fix these first (' + v.errors.length + '):', v.errors);
    return Promise.resolve(null);
  }
  var gate = v.blankNests.length ? askBlank(v.blankNests) : Promise.resolve(true);
  return gate.then(function (yes) {
    if (!yes) { showMsgs('warn', 'Generation stopped. Fill in the blank work offsets on tab 3, then generate again.'); return null; }
    var g = S.generate(job);
    lastFiles = g.files; selFile = 0; stale = false;
    var wtxt = v.warnings.length ? ' CMC warnings: ' + v.warnings.map(function (w) { return w.msg; }).join(' ') : '';
    if (download) {
      var z = S.makeZip(g.files);
      var name = (S.ascii(job.header.part).replace(/[^A-Za-z0-9_-]+/g, '_') || 'SINUMERIK') + '_NC_' + g.R.date + '.zip';
      saveBlob(new Blob([z], { type: 'application/zip' }), name);
      showMsgs(wtxt ? 'warn' : 'ok', 'Generated ' + g.files.length + ' files into ' + name + '.' + (v.blankNests.length ? ' Blank offsets written as 0 for nest(s) ' + v.blankNests.join(', ') + '.' : '') + wtxt);
    } else {
      showMsgs(wtxt ? 'warn' : 'ok', 'Preview built: ' + g.files.length + ' files. Nothing saved yet.' + wtxt);
    }
    showTab('output'); renderOutput();
    return g;
  });
}
function saveBlob(blob, name) {
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

/* ---- edits ---- */
var STRUCT = /^(config\.|probeStep\.|probing\.\w+$|steps\.\d+\.(brk|meas|setpiece|step|tool|program|cmc\w*)$|cmcR\.)/;
function onEdit(e) {
  var el = e.target;
  if (el.dataset && el.dataset.col) {
    if (e.type !== 'change') return;
    S.setColumn(job.steps, el.dataset.col, el.checked);
    changed();
    scheduleRender();
    return;
  }
  var p = el.dataset && el.dataset.path;
  if (!p) return;
  var v = el.type === 'checkbox' ? el.checked : el.value;
  setPath(job, p, v);
  changed();
  if (errPaths[p] && e.type === 'input') {
    delete errPaths[p]; el.classList.remove('err');
    var fe = el.closest('label') && el.closest('label').querySelector('.ferr'); if (fe) fe.remove();
  }
  if (e.type === 'input') { var pc = el.closest('[data-pic]'); if (pc) refreshPic(pc); }
  if (/^(header\.(part|machine)|builder\.)/.test(p)) {   /* live, no re-render */
    var bn = $('#builderNote'); if (bn) bn.innerHTML = builderNote();
    var part = S.ascii(job.header.part);
    $('#jobLabel').textContent = part || 'untitled';
  }
  if (e.type !== 'change') return;
  if (p === 'config.faces' || p === 'config.nestsPerFace') {
    var f = S.num(job.config.faces), n = S.num(job.config.nestsPerFace);
    if (S.isInt(job.config.faces) && S.isInt(job.config.nestsPerFace) && f > 0 && n > 0)
      job.config.totalNests = String(Math.min(f * n, S.MAX_NESTS));
  }
  if (p === 'config.mode' && job.config.mode === 'SINGLE PART') { /* kept, not used */ }
  if (p === 'config.machineType') S.syncKin(job.config);
  /* turning bore: +L1 makes the bore bigger (your setting); other turning features must be chosen */
  var cm = /^steps\.(\d+)\.(cmcTool|cmcFeature)$/.exec(p);
  if (cm) {
    var st = job.steps[Number(cm[1])];
    if (st.cmcTool === 'TURNING' && st.cmcFeature === 'BORE' && !st.cmcSign) st.cmcSign = 'LARGER';
  }
  /* ANGLES: data block and direction from the first known plane when blank (audit 6) */
  if (/(^probing\.swMode|\.cmcSwMode)$/.test(p) && v === 'ANGLES' && S.isBlank(job.probing.swBlock) && S.isBlank(job.probing.swDir)) {
    var dflt = S.swivelDefaults(job);
    if (dflt) { job.probing.swBlock = dflt.block; job.probing.swDir = dflt.dir; }
  }
  if (STRUCT.test(p)) scheduleRender();
}
/* A change event fires on blur, which can be the mousedown of a button
   click. Re-rendering then would replace the button and swallow the click,
   so the re-render waits until the mouse button is released. */
var pointerDown = false, pendingRender = false;
document.addEventListener('mousedown', function () { pointerDown = true; }, true);
document.addEventListener('mouseup', function () {
  pointerDown = false;
  if (pendingRender) { pendingRender = false; setTimeout(doRender, 0); }
}, true);
function scheduleRender() { if (pointerDown) pendingRender = true; else doRender(); }
function doRender() {
  var a = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.path : null;
  renderAll();
  if (a) { var b = document.querySelector('[data-path="' + a + '"]'); if (b) b.focus(); }
}
/* Machine type <-> Axes by hand. Axes by hand starts from the machine type's axes; back to Machine
   type picks the type with those axes when there is one. */
/* where the step table comes from (tab 1, Step sequence): BUILDER or IMPORT. Page setting, not in the job;
   the last choice is remembered in this browser. */
var stepSrc = (function () { try { return localStorage.getItem('sng.stepSrc') === 'IMPORT' ? 'IMPORT' : 'BUILDER'; } catch (ex) { return 'BUILDER'; } })();
function setStepSrc(v) {
  stepSrc = v === 'IMPORT' ? 'IMPORT' : 'BUILDER';
  try { localStorage.setItem('sng.stepSrc', stepSrc); } catch (ex) { /* not kept */ }
  renderConfig();
}
function setKinStyle(style) {
  var c = job.config;
  if (style === c.kinStyle) return;
  if (style === 'MACHINE') { var mt = S.machineFromAxes(c.trunnion, c.rotary); if (mt) c.machineType = mt.key; }
  c.kinStyle = style;
  S.syncKin(c);
  changed(); errPaths = {};
  renderAll();
}
function onClick(e) {
  var t = e.target.closest('[data-act],[data-tab],[data-file],[data-goto],[data-jump],[data-kin],[data-src]');
  if (!t) return;
  if (t.dataset.kin) { setKinStyle(t.dataset.kin); return; }
  if (t.dataset.src) { setStepSrc(t.dataset.src); return; }
  if (t.dataset.jump) { var jt = document.getElementById(t.dataset.jump); if (jt) jt.scrollIntoView({ block: 'start' }); return; }
  if (t.dataset.tab) { showTab(t.dataset.tab); return; }
  if (t.dataset.goto) { e.preventDefault(); gotoPath(t.dataset.goto); return; }
  if (t.dataset.file !== undefined) { selFile = Number(t.dataset.file); renderOutput(); return; }
  var act = t.dataset.act, i = Number(t.dataset.i);
  if (act === 'add') {
    var last = job.steps.length ? S.num(job.steps[job.steps.length - 1].step) : NaN;
    var next = isNaN(last) ? 10 : Math.floor(last / 10) * 10 + 10;
    job.steps.push(S.blankStep(next)); changed(); renderAll();
  } else if (act === 'del') {
    if (job.steps.length <= 1) { showMsgs('warn', 'A job needs at least one cutting step.'); return; }
    job.steps.splice(i, 1); changed(); errPaths = {}; renderAll();
  } else if (act === 'up' && i > 0) {
    var a = job.steps[i - 1]; job.steps[i - 1] = job.steps[i]; job.steps[i] = a; changed(); errPaths = {}; renderAll();
  } else if (act === 'down' && i < job.steps.length - 1) {
    var b = job.steps[i + 1]; job.steps[i + 1] = job.steps[i]; job.steps[i] = b; changed(); errPaths = {}; renderAll();
  } else if (act === 'names') {
    var r = S.fillNames(job);
    if (r.error) { showMsgs('bad', r.error); return; }
    job.steps = r.steps; job.probeStep.program = r.probeProgram;
    changed(); renderAll();
    showMsgs(r.unnamed.length ? 'warn' : 'ok', 'Filled ' + r.filled + ' blank program name' + (r.filled === 1 ? '' : 's') + '.' + namesMsg(r));
  } else if (act === 'build') { runBuilder(); }
  else if (act === 'blist') { $('#fileBList').value = ''; $('#fileBList').click(); }
  else if (act === 'preview') { build(false); }
  else if (act === 'zip') { build(true); }
  else if (act === 'dlone' && lastFiles) {
    var f = lastFiles[selFile];
    saveBlob(new Blob([f.text], { type: 'text/plain' }), f.path.split('/').pop());
  }
}

/* ---- save / load ---- */
function saveJob() {
  var name = (S.ascii(job.header.part).replace(/[^A-Za-z0-9_-]+/g, '_') || 'JOB') + '_job.json';
  saveBlob(new Blob([JSON.stringify(job, null, 2) + '\n'], { type: 'application/json' }), name);
  unsaved = false; updDot();
  showMsgs('ok', 'Saved ' + name + '. File > Open… reopens it.');
}
function loadJob(file) {
  var r = new FileReader();
  r.onload = function () {
    try {
      var obj = JSON.parse(String(r.result));
      if (!obj || obj.format !== 'SINUMERIK_ONE_GENERATOR_JOB') throw new Error('not a job file saved by this generator');
      job = S.normalizeJob(obj); errPaths = {}; lastFiles = null; stale = false; unsaved = false; updDot();
      renderAll(); showTab('config');
      showMsgs('ok', 'Loaded ' + file.name + '.');
    } catch (ex) { showMsgs('bad', 'Could not load ' + file.name + ': ' + ex.message); }
  };
  r.readAsText(file);
}

/* ---- import B program list (hyperMILL export) ---- */
function importBList(file) {
  var r = new FileReader();
  r.onload = function () {
    var data;
    try { data = JSON.parse(String(r.result)); }
    catch (ex) { showMsgs('bad', 'Could not read ' + file.name + ': ' + ex.message); return; }
    var rd = S.readBList(data);
    if (rd.error) { showMsgs('bad', file.name + ': ' + rd.error); return; }
    runImport(file.name, rd.list);
  };
  r.readAsText(file);
}
function runImport(fname, L) {
  var cancel = function () { showMsgs('warn', 'Import cancelled. Nothing changed.'); return null; };
  var units = job.config.units;
  var gate = L.units === units ? Promise.resolve('same') : askChoice('Units differ', [
    'The B program list is ' + L.units + ', this page is ' + units + '. Its tolerances and diameters are ' + L.units + '.',
    'Switch the page to ' + L.units + ' to import it.'
  ], [{ label: 'Switch to ' + L.units, value: 'switch', primary: true }, { label: 'Cancel', value: 'cancel' }], 'cancel');
  return gate.then(function (u) {
    if (u === 'cancel') return cancel();
    var hp = S.ascii(job.header.part), hm = S.ascii(job.header.machine);
    var differs = (hp && hp !== L.part) || (hm && L.machine && hm !== L.machine);
    var hdr = !differs ? Promise.resolve('file') : askChoice('Part number or machine differ', [
      'Page: part ' + (hp || '-') + ', machine ' + (hm || '-') + '.',
      'B program list: part ' + (L.part || '-') + ', machine ' + (L.machine || '-') + '.'
    ], [{ label: 'Use the list\'s', value: 'file', primary: true }, { label: 'Keep the page\'s', value: 'page' },
        { label: 'Cancel', value: 'cancel' }], 'cancel');
    return hdr.then(function (h) {
      if (h === 'cancel') return cancel();
      var withData = job.steps.filter(function (s) { return !S.isBlank(s.tool) || !S.isBlank(s.program) || !S.isBlank(s.brkTol); }).length;
      var rows = S.hasStepData(job) ? askChoice('Step table already has data', [
        'The table has ' + job.steps.length + ' row' + (job.steps.length === 1 ? '' : 's') + ', ' + withData + ' with a tool, program or tolerance filled in.',
        'Overwrite all: replace every row with the ' + L.steps.length + ' B programs of the list' +
          (job.probeStep.enabled ? ', and regenerate the probe program name.' : '.'),
        'Keep existing: leave every current row as it is, add the list\'s steps that are missing, and sort by step number.'
      ], [{ label: 'Overwrite all', value: 'overwrite' }, { label: 'Keep existing, add missing', value: 'keep', primary: true },
          { label: 'Cancel', value: 'cancel' }], 'cancel') : Promise.resolve('overwrite');
      return rows.then(function (mode) {
        if (mode === 'cancel') return cancel();
        if (u === 'switch') job.config.units = L.units;
        if (h === 'file') {
          if (!hp || differs) job.header.part = L.part;
          if (L.machine && (!hm || differs)) job.header.machine = L.machine;
        }
        var ap = S.applyBList(job, L, mode);
        job.steps = ap.steps; job.probeStep.program = ap.probeProgram;
        changed(); lastFiles = null;
        var v = runValidate();
        showTab('config');
        var blank = L.steps.filter(function (s) { return s.brk && S.isBlank(s.brkTol); }).length;
        var msg = (mode === 'keep' ? 'Kept the existing rows and added ' + ap.added + ' of the ' : 'Imported the ') +
          L.steps.length + ' B programs from ' + fname + ' (part ' + (L.part || '-') + ', machine ' + (L.machine || '-') + ', ' + L.units + ').' +
          (u === 'switch' ? ' Page switched to ' + L.units + '.' : '') +
          (blank ? ' ' + blank + ' step' + (blank === 1 ? ' has' : 's have') + ' break check on and no tolerance: fill them (red).' : '') +
          (ap.nameError ? ' Probe program name not generated: ' + ap.nameError : namesMsg(ap));
        var items = L.refused.map(function (x) { return { msg: 'Left out in hyperMILL: ' + x.name + ' (' + x.reason + ')' }; })
          .concat(v.errors);
        showMsgs(v.errors.length || L.refused.length ? 'warn' : 'ok', msg, items);
        return mode;
      });
    });
  });
}

document.addEventListener('input', onEdit);
document.addEventListener('change', onEdit);
document.addEventListener('click', onClick);
$('#btnValidate').addEventListener('click', function () {
  var v = runValidate();
  if (v.errors.length) showMsgs('bad', 'Validation: ' + v.errors.length + ' problem(s).', v.errors);
  else if (v.blankNests.length) showMsgs('warn', 'Valid, but nest(s) ' + v.blankNests.join(', ') + ' have blank X/Y/Z (written as 0.000 = machine zero). You will be asked when you generate.');
  else if (v.warnings.length) showMsgs('warn', 'Valid. CMC warnings (' + v.warnings.length + '):', v.warnings);
  else showMsgs('ok', 'Validation passed.');
});
$('#footL').textContent = 'SINUMERIK ONE Program Generator ' + S.GEN_VERSION + ' | Nest framework REV ' + S.FW_REV + ' | Offline';
$('#footR').textContent = String(new Date().getFullYear());
setHead('config');
/* ---- File menu: New job, Open..., Save (Ctrl+O, Ctrl+S) ---- */
function closeMenu() { $('.filemenu').open = false; }
/* unsaved changes: ask before they are replaced. Resolves 'go' or 'cancel'. */
function askUnsaved(what) {
  if (!unsaved) return Promise.resolve('go');
  return askChoice('Unsaved changes', ['This job has changes that are not saved.', what], [
    { label: 'Save first', value: 'save', primary: true }, { label: 'Discard', value: 'discard' }, { label: 'Cancel', value: 'cancel' }
  ], 'cancel').then(function (v) {
    if (v === 'save') { saveJob(); return 'go'; }
    return v === 'discard' ? 'go' : 'cancel';
  });
}
function newJob() {
  askUnsaved('New job starts again from a blank page.').then(function (v) {
    if (v !== 'go') return;
    job = S.defaultJob(); errPaths = {}; lastFiles = null; stale = false; unsaved = false;
    renderAll(); showTab('config'); updDot();
    showMsgs('ok', 'New job. Start with the Header and the machine type.');
  });
}
function openJob() {
  askUnsaved('Open replaces it with the job you pick.').then(function (v) {
    if (v === 'go') { $('#fileLoad').value = ''; $('#fileLoad').click(); }
  });
}
$('#btnNew').addEventListener('click', function () { closeMenu(); newJob(); });
$('#btnLoad').addEventListener('click', function () { closeMenu(); openJob(); });
$('#btnSave').addEventListener('click', function () { closeMenu(); saveJob(); });
document.addEventListener('click', function (e) { if (!e.target.closest('.filemenu')) closeMenu(); });
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') { closeMenu(); return; }
  if (!(e.ctrlKey || e.metaKey) || e.altKey || $('#dlg').open) return;
  var k = e.key.toLowerCase();
  if (k === 's') { e.preventDefault(); closeMenu(); saveJob(); }
  else if (k === 'o') { e.preventDefault(); closeMenu(); openJob(); }
});
/* the bar's height for scroll-padding (it wraps to two rows on a narrow window) */
function setBarH() { document.documentElement.style.setProperty('--barh', $('header.nav').offsetHeight + 'px'); }
window.addEventListener('resize', setBarH);
setBarH();
$('#fileLoad').addEventListener('change', function () { if (this.files && this.files[0]) loadJob(this.files[0]); });
$('#fileBList').addEventListener('change', function () { if (this.files && this.files[0]) importBList(this.files[0]); });
window.addEventListener('beforeunload', function (e) { if (unsaved) { e.preventDefault(); e.returnValue = ''; } });
window.SNG_UI = { getJob: function () { return job; }, setJob: function (j) { job = S.normalizeJob(j); errPaths = {}; lastFiles = null; unsaved = false; stale = false; renderAll(); updDot(); } };
renderAll();
})();
</script>
</body>
</html>
